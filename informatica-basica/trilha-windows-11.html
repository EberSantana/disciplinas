<title>Trilha Windows 11</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: console de estudo — barra superior, trilha de módulos à esquerda, área de trabalho com abas por tipo de atividade */
:root{
  --bg:#EDF1F7; --surface:#FFFFFF; --surface-2:#F6F8FC; --ink:#142033; --muted:#596780; --line:#D5DDEA;
  --accent:#1F5FD1; --accent-ink:#FFFFFF; --accent-soft:#E2EBFB;
  --paper:#FFF9E8; --paper-line:#EADCB4; --paper-ink:#3B3220; --margin:#E59B8F;
  --ok:#1C8556; --ok-soft:#DDF3E8; --bad:#BF3B34; --bad-soft:#FBE3E1; --warn:#9A6512; --warn-soft:#FBEFD6;
  --shadow:0 1px 2px rgba(20,32,51,.06),0 6px 18px rgba(20,32,51,.06);
  --f-display:"Sora","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1420; --surface:#152035; --surface-2:#1A263D; --ink:#E5EBF5; --muted:#93A1B8; --line:#273551;
  --accent:#6EA2FF; --accent-ink:#0B1220; --accent-soft:#1C2C4B;
  --paper:#26211A; --paper-line:#433924; --paper-ink:#EFE3C6; --margin:#8C4A42;
  --ok:#4CC38A; --ok-soft:#173527; --bad:#F07A72; --bad-soft:#3A1D1C; --warn:#E3B05C; --warn-soft:#352914;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1420; --surface:#152035; --surface-2:#1A263D; --ink:#E5EBF5; --muted:#93A1B8; --line:#273551;
  --accent:#6EA2FF; --accent-ink:#0B1220; --accent-soft:#1C2C4B;
  --paper:#26211A; --paper-line:#433924; --paper-ink:#EFE3C6; --margin:#8C4A42;
  --ok:#4CC38A; --ok-soft:#173527; --bad:#F07A72; --bad-soft:#3A1D1C; --warn:#E3B05C; --warn-soft:#352914;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
kbd{font-family:var(--f-mono);font-size:.8em;padding:.1em .45em;border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;background:var(--surface-2);white-space:nowrap}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.logo{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:26px;height:26px}
.logo i{background:var(--accent);border-radius:2px}
.brand b{font-family:var(--f-display);font-size:1.02rem}
.brand small{display:block;font-size:.78rem;color:var(--muted);text-align:left}
.gprog{flex:1;min-width:180px;display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--muted)}
.bar{flex:1;height:8px;background:var(--accent-soft);border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:.85rem}
.ghost:hover{border-color:var(--accent);color:var(--accent)}

.shell{display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;max-width:1280px;margin:0 auto;padding-block:24px;padding-inline:20px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;max-height:calc(100vh - 100px);overflow:auto;display:flex;flex-direction:column;gap:4px}
.side .lbl{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 10px 8px}
.mi{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:center;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:8px 10px}
.mi:hover{background:var(--surface)}
.mi[aria-current="true"]{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)}
.mi .num{font-family:var(--f-mono);font-size:.8rem;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.mi.done .num{background:var(--ok);color:var(--surface)}
.mi .tt{font-size:.92rem;font-weight:600;line-height:1.25}
.mi .mini{height:4px;background:var(--line);border-radius:9px;margin-top:5px;overflow:hidden}
.mi .mini span{display:block;height:100%;background:var(--accent)}

main{min-width:0}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;display:grid;gap:14px;box-shadow:var(--shadow)}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.hero h1{font-size:clamp(1.6rem,3.2vw,2.3rem)}
.hero p{margin:0;max-width:65ch;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:6px}
.step{background:var(--surface-2);border-radius:12px;padding:14px}
.step b{display:block;font-family:var(--f-display);font-size:.95rem;margin-bottom:2px}
.step span{font-size:.88rem;color:var(--muted)}
.step .sn{font-family:var(--f-mono);font-size:.72rem;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:22px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px}
.mcard:hover{border-color:var(--accent)}
.mcard .k{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.mcard h3{font-size:1.02rem}
.mcard .row{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin-top:auto}

.mhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:16px}
.mhead h1{font-size:clamp(1.5rem,3vw,2.1rem);margin-top:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:.8rem;padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.chip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .ct{font-family:var(--f-mono);font-size:.72rem;margin-left:6px;padding:1px 6px;border-radius:6px;background:var(--surface-2)}
.tab.full .ct{background:var(--ok-soft);color:var(--ok)}

.panel{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;min-width:0}
.card h2{font-size:1.15rem;margin-bottom:8px}
.sum ul{margin:0;padding-left:1.15em;display:grid;gap:8px;max-width:72ch}
.note{background:var(--warn-soft);border-radius:12px;padding:14px 18px;color:var(--ink);font-size:.95rem}
.note b{color:var(--warn)}
.keys{display:flex;flex-wrap:wrap;gap:10px}
.keys div{background:var(--surface-2);border-radius:10px;padding:8px 12px;font-size:.9rem}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:9px;padding:9px 16px;font-weight:600}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.sec{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}

.toolbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;font-size:.92rem;color:var(--muted)}
.q .qn{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.q .qt{font-weight:600;font-size:1.04rem;margin:4px 0 10px;max-width:72ch}
textarea{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2);color:var(--ink);font:inherit;font-size:.95rem}
.acts{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:10px}
.chk{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted)}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.hint{font-size:.82rem;color:var(--muted)}
.paper{margin-top:12px;background:var(--paper);color:var(--paper-ink);border-radius:10px;padding:12px 16px 12px 30px;position:relative;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 25px,var(--paper-line) 25px,var(--paper-line) 26px);line-height:26px}
.paper::before{content:"";position:absolute;left:18px;top:0;bottom:0;width:2px;background:var(--margin)}
.paper .lab{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.self{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;font-size:.9rem}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:.88rem}
.pill.okk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.pill.rev[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:var(--surface)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:8px 18px;font-weight:600}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.res{margin-top:12px;border-radius:10px;padding:12px 14px;font-size:.95rem}
.res.good{background:var(--ok-soft)} .res.good b{color:var(--ok)}
.res.bad{background:var(--bad-soft)} .res.bad b{color:var(--bad)}
.score{display:flex;gap:10px;align-items:baseline;font-variant-numeric:tabular-nums}
.score strong{font-family:var(--f-display);font-size:1.4rem;color:var(--ink)}

.deck{display:grid;gap:14px;justify-items:center}
.fc{width:min(100%,560px);aspect-ratio:16/10;max-width:100%;perspective:1200px;background:none;border:0;padding:0}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;border:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;text-align:center;box-shadow:var(--shadow)}
.face.front{background:var(--surface)}
.face.back{background:var(--accent-soft);transform:rotateY(180deg)}
.face .tag{position:absolute;top:14px;left:16px;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.face .st{position:absolute;top:14px;right:16px;font-size:.75rem;font-weight:600}
.face .big{font-family:var(--f-display);font-size:clamp(1.15rem,3vw,1.6rem);font-weight:600}
.face .txt{font-size:clamp(.98rem,2.2vw,1.1rem);max-width:44ch}
.dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line);border:0;padding:0}
.dot.sei{background:var(--ok)} .dot.rev{background:var(--warn)} .dot.cur{outline:2px solid var(--accent);outline-offset:2px}
.nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

.pbl .meta{display:grid;gap:12px;margin-top:8px}
.pbl h3{font-size:.8rem;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.pbl ol{margin:0;padding-left:1.2em;display:grid;gap:4px}
.pbl p{margin:0;max-width:72ch}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--bad-soft);padding:10px 20px;font-size:.9rem}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);padding-inline:16px;gap:16px}
  .side{position:static;max-height:none;flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .side .lbl{display:none}
  .mi{grid-template-columns:30px auto;min-width:max-content}
  .mi .tt{font-size:.85rem;white-space:nowrap}
  .mi .mini{display:none}
  .top{padding:10px 16px}
  .hero{padding:20px}
  .card{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div id="confirm" class="confirm" hidden>
  <span>Apagar todo o progresso salvo neste navegador?</span>
  <button class="btn" id="yesReset" style="background:var(--bad)">Apagar progresso</button>
  <button class="btn sec" id="noReset">Cancelar</button>
</div>
<header class="top">
  <button class="brand" id="home" aria-label="Início da trilha">
    <span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <span><b>Trilha Windows 11</b><small>12 aulas · 18 h · 480 atividades</small></span>
  </button>
  <div class="gprog"><span id="gtxt">0%</span><div class="bar"><span id="gbar" style="width:0"></span></div></div>
  <button class="ghost" id="reset">Zerar progresso</button>
</header>
<div class="shell">
  <nav class="side" id="side" aria-label="Aulas"></nav>
  <main id="main"></main>
</div>

<script>
/* ========= CONTEÚDO =========
 r: resumo | k: atalhos | n: nota de atualização
 c: caderno [pergunta, resposta] | f: flashcards [frente, verso]
 v: V/F [afirmação, 1=V/0=F, justificativa] | p: PBL [título, cenário, [tarefas], entregável, referência]
 [[X]] vira tecla */
const M=[
{t:"Introdução ao Windows 11",
r:["O sistema operacional administra hardware, arquivos e programas e oferece a interface entre o computador e o usuário.","O Windows 11 foi lançado em 5 de outubro de 2021, sucessor do Windows 10, com visual mais limpo, ícones redesenhados e cantos arredondados.","A barra de tarefas gerencia os aplicativos abertos; no Windows 11 o menu Iniciar e os ícones ficam centralizados por padrão.","O menu Iniciar traz fixados, recomendados e o botão Todos os aplicativos, em ordem alfabética com índice por letra.","Ligar/Desligar: Desligar encerra tudo; Reiniciar ajuda em travamentos; Suspender pausa a sessão mas continua consumindo energia.","O menu suspenso (botão direito) oferece Mover para frente, Desafixar de Iniciar, Executar como administrador, Fixar na barra de tarefas, Configurações do aplicativo e Desinstalar.","Snap Layout organiza várias janelas em divisões da tela ao passar o mouse sobre o botão Maximizar."],
k:[["[[Win]]","Abre o menu Iniciar"],["[[Win]] + [[Z]]","Abre os layouts do Snap"],["[[Win]] + [[←]] / [[→]]","Encaixa a janela na metade da tela"],["[[Alt]] + [[F4]]","Fecha a janela ativa"]],
n:"Em atualizações recentes o menu Iniciar ganhou novas disposições (seção Todos com categorias). Se a tela da sua máquina for diferente das figuras da apostila, procure os mesmos nomes de botões.",
c:[["Qual é a função de um sistema operacional?","Administrar e gerenciar os recursos do computador (hardware, sistema de arquivos e programas) e oferecer uma interface simples entre a máquina e o usuário final."],
["Quando o Windows 11 foi lançado e qual versão ele sucedeu?","Foi lançado em 5 de outubro de 2021 e é o sucessor do Windows 10."],
["Cite três mudanças visuais do Windows 11 em relação às versões anteriores.","Visual mais limpo e minimalista, ícones remodelados, janelas com novo visual (cantos arredondados) e menu Iniciar centralizado na barra de tarefas."],
["Qual é a função da barra de tarefas?","Gerenciar os aplicativos abertos, permitindo que o usuário acompanhe suas atividades e tenha acesso rápido a cada aplicativo."],
["Como localizar rapidamente um aplicativo que começa com a letra M em Todos os aplicativos?","Abrir Iniciar > Todos os aplicativos, clicar em uma das letras-título da lista e escolher a letra M no índice; a lista salta para os apps que começam com M."],
["Explique a diferença entre Suspender e Desligar e quando usar cada um.","Suspender pausa a sessão e retoma rápido, mas o computador continua recebendo energia; serve para pausas curtas. Desligar encerra tudo e é o indicado para longos períodos, como de um dia para o outro."],
["Em que situação o modo Reiniciar é útil? O que fazer se o problema se repetir?","Quando o sistema trava ou fica instável; reiniciar recarrega o sistema e pode corrigir o problema. Se o caso se repetir, consultar um técnico em informática."],
["O que significa a opção Executar como administrador?","Executa o programa com privilégios elevados, pois ele precisa de autorização para alterar configurações ou criar registros no computador."],
["Diferencie Fixar na barra de tarefas e Mover para frente.","Fixar na barra de tarefas cria um atalho do app na barra, sem abrir o Iniciar. Mover para frente apenas reposiciona o ícone para o primeiro lugar da lista de fixados do Iniciar."],
["Como acionar o Snap Layout e o que acontece após escolher uma opção?","Posicionando o ponteiro sobre o botão Maximizar/Restaurar (ou [[Win]] + [[Z]]). O sistema divide a tela e sugere as outras janelas abertas para preencher as demais divisões."]],
f:[["Sistema operacional","Software que gerencia hardware, arquivos e programas e faz a interface com o usuário."],["Lançamento do Windows 11","5 de outubro de 2021, sucessor do Windows 10."],["Barra de tarefas","Gerencia apps abertos e dá acesso rápido; no Win 11 os ícones ficam centralizados."],["Menu Iniciar","Acesso aos programas instalados, fixados, recomendados e ao Ligar/Desligar."],["Todos os aplicativos","Lista de apps em ordem alfabética, com índice por letra."],["Desligar","Encerra o sistema; indicado para pausas longas."],["Reiniciar","Desliga e liga de novo; útil em travamentos."],["Suspender","Pausa a sessão para pausas curtas; continua gastando energia."],["Menu suspenso","Menu aberto com o botão direito sobre um ícone; opções variam por item."],["Desafixar de Iniciar","Remove o atalho dos fixados, sem desinstalar o app."],["Snap Layout","Divide a tela em layouts para organizar várias janelas."],["[[Win]] + [[Z]]","Atalho que abre as opções de Snap Layout da janela ativa."]],
v:[["O Windows 11 foi lançado em 2021 como sucessor do Windows 10.",1,"Lançado em 5/10/2021, substituindo o Windows 10."],
["No Windows 11 o menu Iniciar fica sempre no canto esquerdo e não pode ser movido.",0,"Por padrão ele fica centralizado; o alinhamento pode ser mudado para a esquerda em Personalização > Barra de tarefas."],
["O modo Suspender desliga o computador por completo, sem consumo de energia.",0,"No modo Suspender o computador continua recebendo energia, por isso não é indicado para longos períodos."],
["Reiniciar pode corrigir travamentos temporários do sistema.",1,"Reiniciar recarrega o sistema operacional e costuma resolver falhas momentâneas."],
["O menu suspenso de um ícone aparece ao clicar com o botão esquerdo do mouse.",0,"Ele aparece com o botão direito do mouse sobre o ícone."],
["A opção Desinstalar remove o aplicativo do computador.",1,"Desinstalar retira o programa do sistema, diferente de apenas desafixá-lo."],
["Desafixar de Iniciar desinstala o aplicativo.",0,"Apenas remove o ícone da lista de fixados; o app continua instalado."],
["O Snap Layout aparece ao posicionar o ponteiro sobre o botão Fechar da janela.",0,"Ele aparece sobre o botão Maximizar/Restaurar."],
["Executar como administrador dá ao programa permissão para alterar configurações do sistema.",1,"É usado quando o programa precisa de privilégios elevados para alterar ou criar registros."],
["Fixar na barra de tarefas cria um atalho do aplicativo na barra.",1,"Assim o app é aberto sem passar pelo menu Iniciar."],
["Em Todos os aplicativos, os programas aparecem na ordem em que foram instalados.",0,"Eles aparecem em ordem alfabética, com índice por letra."],
["Gerenciar hardware e sistema de arquivos é uma das funções do sistema operacional.",1,"Administrar recursos de hardware e arquivos é o papel central de um SO."],
["Para deixar o computador parado de um dia para o outro, o recomendado é Suspender.",0,"Para períodos longos o recomendado é Desligar, para não gastar energia."],
["O Snap Layout permite organizar várias janelas em divisões da tela.",1,"Ele divide a tela e encaixa as janelas abertas nas divisões escolhidas."]],
p:[["Mesa do atendente","Uma loja de informática contratou você como estagiário. No balcão, o atendente precisa ver ao mesmo tempo a Calculadora, a Microsoft Store e o Relógio enquanto atende clientes, e hoje perde tempo alternando janelas.",["Escolha um layout de Snap adequado para três janelas.","Desenhe no caderno a tela dividida, indicando onde fica cada janela e por quê.","Liste os passos para montar esse layout."],"Desenho da tela + passo a passo numerado.","Um layout de três áreas (uma coluna larga e duas menores) funciona bem: Calculadora na área maior por ser a mais usada. Passos: abrir os três apps; passar o mouse sobre Maximizar da Calculadora (ou [[Win]] + [[Z]]); escolher o layout de três áreas e a posição; clicar nas outras duas janelas sugeridas para preencher as divisões."],
["Laboratório que nunca desliga","O laboratório de informática da escola fica com os computadores em Suspender durante a noite e no fim de semana. A conta de energia subiu e a direção pediu uma regra simples.",["Explique a diferença entre Suspender, Desligar e Reiniciar.","Escreva uma regra de uso com 3 situações: pausa de 15 min, fim do turno e computador travado.","Crie um cartaz curto (no caderno) para fixar na sala."],"Regra de uso + rascunho do cartaz.","Pausa curta (intervalo, até ~30 min): Suspender. Fim do turno, noite ou fim de semana: Desligar, pois Suspender mantém consumo. Travamento: Reiniciar; se repetir, chamar o técnico. O cartaz deve ser curto e visual (ícone de cada opção do Ligar/Desligar)."],
["Iniciar sob medida","A secretária da escola usa diariamente o Edge, o Explorador de Arquivos e a Calculadora, mas o menu Iniciar dela está cheio de jogos fixados.",["Decida o que fixar, desafixar e mover para frente.","Indique quais apps também merecem ficar na barra de tarefas.","Explique por que não é preciso desinstalar os jogos para limpar o Iniciar."],"Tabela no caderno: App | Ação | Motivo.","Edge: Mover para frente e Fixar na barra de tarefas. Explorador e Calculadora: manter fixados e fixar na barra. Jogos: Desafixar de Iniciar. Não é preciso desinstalar, porque desafixar só remove o atalho; desinstalar deve ser decidido pela gestão de TI."],
["Fluxo do travamento","Um colega relata que o computador ‘congela’ quando abre muitos programas. Ele pensa em chamar o técnico na primeira vez que isso acontece.",["Monte um fluxograma de decisão com pelo menos 4 passos.","Inclua quando usar Reiniciar e quando procurar o técnico.","Cite um cuidado antes de reiniciar."],"Fluxograma desenhado no caderno.","Exemplo: travou? → aguardar alguns segundos → fechar o programa (ou [[Alt]] + [[F4]]) → se não responder, Reiniciar pelo Iniciar → voltou ao normal? sim: fim; não ou se repetir com frequência: chamar o técnico. Cuidado: salvar os trabalhos abertos sempre que possível antes de reiniciar."]]},

{t:"Aplicativos Parte I",
r:["Bloco de notas, WordPad e Calculadora são os primeiros contatos com digitação e cálculos no Windows.","Bloco de notas: editor de texto simples (.txt), também usado para páginas web e scripts. Abre pelo Iniciar digitando o nome.","Nas configurações (engrenagem) do Bloco de notas: Tema do aplicativo (Claro, Escuro ou Usar configuração do sistema) e Fonte (família, estilo e tamanho de 8 a 72).","WordPad: editor com formatação básica, menu Arquivo e guias Início e Exibir.","Guia Início: Área de transferência (Copiar, Colar, Recortar), Fonte (negrito, itálico, sublinhado, tachado, subscrito, sobrescrito, cores), Parágrafo (alinhamentos e listas), Inserir (imagem, desenho do Paint, data e hora) e Editando.","Guia Exibir: Zoom, Mostrar ou ocultar (Régua e Barra de status) e Configurações.","Calculadora: modo Padrão (operações básicas) e Científico (funções avançadas), por mouse ou teclado."],
k:[["[[Ctrl]] + [[C]]","Copiar"],["[[Ctrl]] + [[X]]","Recortar"],["[[Ctrl]] + [[V]]","Colar"],["[[Ctrl]] + [[S]]","Salvar"],["[[F5]]","Data e hora no Bloco de notas"]],
n:"O WordPad foi removido do Windows 11 a partir da versão 24H2 (2024). Os conceitos de formatação continuam valendo: pratique no Word, no Word para a web ou no LibreOffice Writer.",
c:[["Por que a Microsoft manteve o Bloco de notas e o WordPad no Windows?","Para os primeiros contatos com a digitação: criar textos simples e poder imprimi-los."],
["Qual extensão o Bloco de notas edita e que outros usos ele tem?","Arquivos .txt; também é usado para criar e editar páginas web e scripts de linguagens de programação."],
["Quais opções existem na aba Tema do aplicativo do Bloco de notas?","Claro, Escuro ou Usar a configuração do sistema."],
["Na aba Fonte do Bloco de notas, o que pode ser alterado?","A família da fonte (ex.: Arial, Times New Roman), o estilo (negrito, itálico) e o tamanho, de 8 a 72."],
["Quais painéis compõem a guia Início do WordPad?","Área de transferência, Fonte, Parágrafo, Inserir e Editando."],
["Diferencie subscrito e sobrescrito com um exemplo de cada.","Subscrito fica abaixo da linha (CO₂, dióxido de carbono). Sobrescrito fica acima (10⁸, dez elevado a oito)."],
["Quais são os quatro alinhamentos de parágrafo?","À esquerda, à direita, centralizado e justificado."],
["Qual a diferença entre lista com marcadores e lista numerada? Dê um uso para cada.","Marcadores usam símbolos e servem quando a ordem não importa (lista de frutas). Numeração usa números/letras e serve quando a ordem importa (passos de uma receita)."],
["O que o painel Inserir do WordPad permite colocar no texto?","Uma imagem (foto), um desenho do Paint e a data e hora."],
["Diferencie os modos Padrão e Científico da Calculadora.","Padrão faz a matemática básica (soma, subtração, multiplicação, divisão, porcentagem). Científico traz funções mais complexas (potências, raízes, trigonometria, logaritmos)."]],
f:[["Bloco de notas","Editor de texto simples que salva em .txt."],[".txt","Extensão de arquivo de texto sem formatação."],["Engrenagem do Bloco de notas","Abre as configurações: Tema do aplicativo e Fonte."],["WordPad","Editor com formatação básica (removido no Windows 11 24H2)."],["Área de transferência","Painel com Copiar, Colar e Recortar."],["Tachado","Texto com um traço no meio: ~~exemplo~~."],["Sobrescrito","Texto acima da linha, como em 10⁸."],["Subscrito","Texto abaixo da linha, como em CO₂."],["Justificado","Texto alinhado às duas margens ao mesmo tempo."],["Guia Exibir (WordPad)","Zoom, Régua, Barra de status e Configurações."],["Calculadora Padrão","Operações básicas por mouse ou teclado."],["Calculadora Científica","Funções avançadas: potência, raiz, trigonometria."]],
v:[["O Bloco de notas salva o tipo e o tamanho da fonte dentro do arquivo .txt.",0,"A fonte é só uma configuração de exibição do aplicativo; o .txt guarda apenas o texto puro."],
["Muitos usuários usam o Bloco de notas para editar páginas web e scripts.",1,"Por trabalhar com texto puro, ele serve para HTML, CSS e scripts."],
["O tema do Bloco de notas pode acompanhar a configuração do sistema.",1,"A aba Tema do aplicativo tem a opção Usar a configuração do sistema."],
["O WordPad está presente no Windows desde o Windows 95.",1,"Ele acompanhou o Windows do 95 até ser removido na versão 24H2 do Windows 11."],
["Copiar, Colar e Recortar ficam no painel Área de transferência.",1,"É o painel da guia Início dedicado a essas três ações."],
["O alinhamento justificado alinha o texto apenas à margem esquerda.",0,"Justificado alinha às duas margens, esquerda e direita."],
["Para escrever CO₂ corretamente usa-se o sobrescrito.",0,"O 2 fica abaixo da linha, então é subscrito."],
["Pelo painel Inserir é possível colocar a data e a hora no documento.",1,"O painel Inserir oferece imagem, desenho do Paint e data e hora."],
["Na guia Exibir é possível mostrar ou ocultar a régua e a barra de status.",1,"Fazem parte do painel Mostrar ou ocultar."],
["No modo Padrão a Calculadora só faz somas.",0,"Faz soma, subtração, multiplicação e divisão, entre outras operações básicas."],
["A Calculadora pode ser usada pelo teclado, não apenas pelo mouse.",1,"Os números e operadores do teclado funcionam na Calculadora."],
["O WordPad continua disponível em todas as versões atuais do Windows 11.",0,"Ele foi removido a partir da versão 24H2."],
["O modo Científico oferece recursos mais complexos que o Padrão.",1,"Inclui funções como potências, raízes e trigonometria."],
["Lista com marcadores e lista numerada são a mesma coisa.",0,"Marcadores usam símbolos; listas numeradas indicam ordem com números ou letras."]],
p:[["Lista do mercadinho","O mercadinho do bairro quer uma lista de compras organizada por setor (Açougue, Padaria e Hortifruti), com preço, quantidade e total de cada setor.",["Crie a lista no Bloco de notas, um setor por bloco.","Use a Calculadora para somar cada setor e o total geral.","Salve com um nome que identifique o negócio."],"Lista com totais conferidos + nome do arquivo escolhido.","Estrutura sugerida: título do setor, linhas ‘produto – quantidade × preço = subtotal’, e linha TOTAL ao final de cada setor. Conferir os totais na Calculadora (multiplicar e somar). Nome do arquivo: ex.: ‘Mercadinho_Compras_Semana.txt’, salvo em Documentos."],
["Aviso da reunião de pais","A coordenação precisa de um aviso impresso para a reunião de pais, com título chamativo e texto organizado.",["Defina formatação de título (fonte, tamanho, cor, alinhamento).","Defina formatação do corpo (fonte, tamanho, alinhamento).","Inclua data e hora e uma lista com marcadores da pauta."],"Rascunho do aviso no caderno com as formatações anotadas ao lado.","Título: fonte sem serifa, 18–24, cor de destaque, centralizado. Corpo: 12, justificado. Pauta em lista com marcadores. Data e hora inseridas pelo painel Inserir (ou digitadas). Sem WordPad, aplicar o mesmo no Word ou Writer."],
["Orçamento da oficina","Um cliente pede orçamento: 3 pneus a R$ 289,90, alinhamento R$ 80,00 e balanceamento R$ 15,00 por roda (4 rodas), com 10% de desconto à vista.",["Calcule cada item na Calculadora.","Calcule o total e o valor com desconto usando a tecla %.","Registre o orçamento no Bloco de notas."],"Orçamento com cada cálculo mostrado.","Pneus: 3 × 289,90 = 869,70. Balanceamento: 4 × 15 = 60,00. Total: 869,70 + 80,00 + 60,00 = 1.009,70. Desconto 10%: 100,97. À vista: 908,73."],
["Sem WordPad, e agora?","O laboratório recebeu máquinas com Windows 11 24H2 e a apostila pede exercícios no WordPad, que não existe mais nelas.",["Pesquise duas alternativas gratuitas que façam a mesma formatação.","Compare: onde ficam negrito, alinhamento e inserir imagem em cada uma.","Recomende uma e justifique."],"Quadro comparativo + recomendação.","Alternativas: Word para a web (gratuito com conta Microsoft) e LibreOffice Writer (instalado, gratuito). Ambos têm Fonte e Parágrafo na guia/menu inicial e Inserir > Imagem. Recomendação depende do contexto: Writer funciona offline; Word web exige internet mas mantém o padrão .docx."]]},

{t:"Microsoft Edge",
r:["Navegadores acessam sites: ler, ouvir música, assistir vídeos, comprar e acessar o banco.","O Microsoft Edge é o navegador da Microsoft, sucessor do Internet Explorer, com extensões, captura de tela e versões para Android e iOS desde 2017.","Configurações de página (engrenagem no canto superior direito): layouts Em foco, Inspirador, Informativo e Personalizado.","Personalizado controla links rápidos, tela de fundo (imagem do dia ou sua imagem) e exibição das notícias do Microsoft News.","Tipos de site: blog (atualizado com frequência), site institucional (divulgação) e loja virtual (vendas 24 horas).","O buscador padrão do Edge é o Bing, que pesquisa por texto, voz, imagem e teclado virtual.","Favoritos guardam sites para acesso posterior e podem ser organizados em pastas."],
k:[["[[Ctrl]] + [[D]]","Adicionar aos favoritos"],["[[Ctrl]] + [[T]]","Nova guia"],["[[Ctrl]] + [[Shift]] + [[O]]","Gerenciar favoritos"],["[[Ctrl]] + [[L]]","Ir para a barra de endereço"]],
n:"O Internet Explorer foi aposentado em 2022. Os nomes dos layouts da página inicial do Edge mudam de tempos em tempos; procure pela engrenagem de Configurações de página.",
c:[["Para que servem os navegadores de internet?","Para acessar sites; com eles é possível ler, ouvir música, assistir vídeos, fazer compras, acessar o banco, entre outros."],
["Cite três recursos do Microsoft Edge citados na aula.","Novo visual, suporte a aplicativos e extensões, captura de tela transformada em imagem, dicas sobre o navegador e versões para celular."],
["Onde fica e como se chama o botão para mudar o layout da página inicial do Edge?","É o ícone de engrenagem chamado Configurações de página, no canto superior direito."],
["Diferencie os layouts Em foco e Inspirador.","Em foco é simples: barra de pesquisa do Bing, links rápidos e fundo plano. Inspirador usa a mesma base, mas com uma imagem de fundo."],
["O que o layout Informativo prioriza?","Mantém o plano de fundo e abre mais espaço para manchetes e artigos do Microsoft News."],
["Diferencie blog, site e loja virtual.","Blog: páginas atualizadas com frequência, pessoais ou de empresas. Site: divulgação online de um negócio. Loja virtual: vende produtos e serviços 24 horas e permite acompanhar a entrega."],
["O que é um buscador e qual é o padrão do Edge?","Programa que ajuda a encontrar informações na web; o Edge usa o Bing."],
["Cite três formas de pesquisar no Bing além de digitar.","Pesquisa por voz, pesquisa usando uma imagem e pesquisa com teclado virtual."],
["Por que o teclado virtual ajuda em operações bancárias?","Porque dificulta fraudes que capturam o que é digitado no teclado físico (programas espiões) e ajuda quando o teclado externo não funciona."],
["Como criar uma pasta para organizar favoritos?","Ao adicionar a página (estrela/Adicionar esta página aos favoritos), clicar em Mais > Nova pasta, nomeá-la (ex.: Aulas de Windows 11) e salvar o favorito nela."]],
f:[["Navegador","Programa para acessar sites na internet."],["Microsoft Edge","Navegador da Microsoft, sucessor do Internet Explorer."],["Configurações de página","Engrenagem que muda o layout da página inicial do Edge."],["Layout Em foco","Pesquisa do Bing, links rápidos e fundo plano."],["Layout Inspirador","Em foco + imagem de fundo."],["Layout Informativo","Mais espaço para manchetes do Microsoft News."],["Layout Personalizado","Escolhe links rápidos, fundo e exibição de notícias."],["Blog","Site atualizado com frequência, pessoal ou profissional."],["Loja virtual","Vende produtos e serviços 24 horas por dia."],["Bing","Motor de busca da Microsoft, padrão do Edge."],["Pesquisa visual","Busca a partir de uma imagem arrastada ou enviada."],["Favoritos","Sites salvos para acessar depois, organizáveis em pastas."]],
v:[["O Microsoft Edge é o sucessor do Internet Explorer.",1,"A Microsoft substituiu o IE pelo Edge."],
["O Edge só pode ser usado em computadores com Windows.",0,"Desde 2017 há versões para Android e iPhone (iOS)."],
["O layout Inspirador acrescenta uma imagem de fundo ao layout Em foco.",1,"É o Em foco com imagem de fundo."],
["O layout Informativo remove todas as notícias da página inicial.",0,"Ele faz o contrário: abre mais espaço para notícias."],
["No layout Personalizado é possível desativar o conteúdo de notícias.",1,"É possível gerenciar e até desabilitar o Microsoft News."],
["Blogs costumam ser páginas atualizadas com frequência.",1,"Essa é a característica central de um blog."],
["Uma loja virtual funciona apenas em horário comercial.",0,"Ela disponibiliza produtos e serviços 24 horas."],
["O Bing é o motor de busca do Google.",0,"O Bing é da Microsoft e foi criado para concorrer com Google e Yahoo."],
["A pesquisa por voz é também um recurso de acessibilidade.",1,"Permite pesquisar sem digitar, ajudando pessoas com deficiência física."],
["Para pesquisar usando uma imagem é obrigatório digitar uma descrição.",0,"Basta arrastar a imagem, colar uma URL ou usar Procurar."],
["O teclado virtual pode dificultar fraudes em operações bancárias.",1,"Programas que registram o teclado físico não capturam os cliques no teclado virtual."],
["Os favoritos podem ser organizados em pastas.",1,"É possível criar pastas como Aulas de Windows 11."],
["Um site é uma coleção de páginas web localizadas em um servidor.",1,"É a definição apresentada na aula."],
["Favoritos guardam uma cópia completa do site no computador.",0,"Guardam apenas o endereço (link) para acesso posterior."]],
p:[["Kit de pesquisa da feira de ciências","Sua turma vai pesquisar energias renováveis para a feira de ciências e cada um salva links de um jeito diferente.",["Crie uma estrutura de pastas de favoritos para o projeto.","Defina critérios para um site entrar no kit (fonte confiável, data).","Liste 3 sites que você incluiria e em qual pasta."],"Árvore de pastas desenhada + 3 sites justificados.","Ex.: pasta ‘Feira 2026’ com subpastas Solar, Eólica, Fontes oficiais. Critérios: órgão público, universidade ou instituição conhecida; data visível; autor identificado. Sites governamentais (.gov.br) e universidades (.edu.br/.br) costumam ser boas fontes."],
["Banco sem susto","A avó de um colega quer começar a pagar contas pelo internet banking no computador da família e tem medo de golpes.",["Explique o papel do teclado virtual.","Monte um checklist de 5 itens de navegação segura.","Diga o que NUNCA deve ser feito."],"Checklist para entregar à avó.","Checklist: digitar o endereço do banco (não clicar em links de e-mail/SMS); conferir o cadeado e o domínio; usar teclado virtual quando oferecido; não salvar senha em computador compartilhado; sair da conta ao final. Nunca: informar senha por telefone ou mensagem, instalar programa pedido por ‘atendente’."],
["Quiosque da biblioteca","A biblioteca terá um computador para consultas rápidas. A página inicial cheia de notícias distrai os alunos.",["Escolha o layout da página inicial e justifique.","Defina quais links rápidos fixar.","Indique as configurações no modo Personalizado."],"Configuração proposta, item por item.","Layout Em foco ou Personalizado com conteúdo desativado. Links rápidos: catálogo da biblioteca, site da escola, enciclopédia/repositório. Personalizado: tela de fundo desativada ou imagem do dia; Microsoft News desativado."],
["Que planta é essa?","Na horta da escola apareceu uma planta desconhecida e a professora quer saber se é tóxica.",["Descreva como usar a pesquisa por imagem do Bing.","Explique como confirmar o resultado em outra fonte.","Diga por que não confiar só no primeiro resultado."],"Passo a passo + estratégia de verificação.","Fotografar a planta, abrir bing.com, clicar no ícone de pesquisa visual, arrastar ou procurar a foto. Comparar o nome sugerido em sites de jardins botânicos ou universidades. A IA pode errar com plantas parecidas; a confirmação em fonte especializada é obrigatória antes de qualquer conclusão sobre toxicidade."]]},

{t:"Explorador de Arquivos Parte I",
r:["O bit (dígito binário) é a menor unidade de informação e vale 0 ou 1.","1 byte = 8 bits ≈ 1 caractere (letra, número ou símbolo).","1 KB = 1.024 bytes; 1 MB = 1.048.576 bytes; 1 GB = 1.073.741.824 bytes; 1 TB = 1.024 GB.","A memória RAM é um espaço temporário de trabalho: o que não for salvo é perdido ao desligar. Mais RAM permite mais programas abertos com fluidez.","Dispositivos de armazenamento: HD (fixo, onde ficam sistema e programas) e pen-drive (externo, USB). O Windows os identifica por letras (C:, D:, E:...).","O Explorador de Arquivos gerencia arquivos e pastas: copiar, excluir, mover e organizar.","Extensões indicam o programa de origem: .docx (Word), .xlsx (Excel), .pptx (PowerPoint), .mp3 (áudio), .mp4 (vídeo), .jpg (imagem)."],
k:[["[[Win]] + [[E]]","Abre o Explorador de Arquivos"],["[[Ctrl]] + [[Shift]] + [[N]]","Nova pasta"],["[[Alt]] + [[←]]","Voltar uma pasta"]],
n:"Na apostila aparece ‘1.048,576’ por erro de digitação; o correto é 1.048.576 bytes. Hoje muitos computadores usam SSD no lugar do HD, com a mesma função e mais velocidade.",
c:[["O que é o bit e quais valores ele pode assumir?","É a menor unidade de informação, a simplificação de dígito binário; assume apenas 0 ou 1 (verdadeiro ou falso)."],
["Quantos bits formam um byte e a que ele equivale em texto?","8 bits formam 1 byte, que equivale a 1 caractere."],
["Quantos bytes há em 2 KB? Mostre a conta.","2 × 1.024 = 2.048 bytes."],
["Quantos bytes há em 1 MB? Mostre a conta.","1.024 × 1.024 = 1.048.576 bytes."],
["Coloque em ordem crescente: GB, KB, TB, MB, Byte.","Byte < KB < MB < GB < TB."],
["Por que a memória RAM é chamada de espaço temporário de trabalho?","Porque guarda dados e programas apenas enquanto são usados; ao desligar, o que não foi gravado em um dispositivo de armazenamento é perdido."],
["Diferencie HD e pen-drive.","O HD é fixo no computador e guarda sistema, programas e arquivos, com grande capacidade (GB/TB). O pen-drive é externo, portátil e conectado via USB."],
["Como o Windows identifica os dispositivos de armazenamento?","Por letras: o disco do sistema costuma ser C: e outros dispositivos recebem letras como D:, E:, G:, dependendo do sistema."],
["Qual é a função do Explorador de Arquivos?","Gerenciar arquivos e pastas: acessar, copiar, mover, excluir e organizar documentos no disco local ou em outros dispositivos."],
["Associe cada extensão à origem: .docx, .xlsx, .pptx, .mp3, .mp4, .jpg.",".docx = Word; .xlsx = Excel; .pptx = PowerPoint; .mp3 = áudio; .mp4 = vídeo; .jpg = imagem."]],
f:[["Bit","Menor unidade de informação: 0 ou 1."],["Byte","8 bits, aproximadamente 1 caractere."],["Kilobyte (KB)","1.024 bytes."],["Megabyte (MB)","1.024 KB = 1.048.576 bytes."],["Gigabyte (GB)","1.024 MB, cerca de um bilhão de bytes."],["Terabyte (TB)","1.024 GB."],["Memória RAM","Memória temporária de trabalho; perde os dados ao desligar."],["HD","Disco rígido fixo onde ficam sistema, programas e arquivos."],["SSD","Armazenamento sem partes móveis, mais rápido que o HD."],["Pen-drive","Armazenamento externo e portátil conectado via USB."],["Explorador de Arquivos","Gerenciador de arquivos e pastas do Windows."],["Extensão","Final do nome do arquivo que indica o tipo, como .pdf."]],
v:[["O bit é a menor unidade de informação na computação.",1,"Ele representa apenas 0 ou 1."],
["1 byte equivale a 10 bits.",0,"1 byte equivale a 8 bits."],
["1 KB equivale a 1.024 bytes.",1,"Na base binária usada pelo sistema, 1 KB = 2¹⁰ bytes."],
["1 GB está na casa de um bilhão de bytes.",1,"1 GB = 1.073.741.824 bytes."],
["A memória RAM guarda os dados mesmo com o computador desligado.",0,"A RAM é volátil; o conteúdo não salvo é perdido."],
["Mais memória RAM permite trabalhar com mais aplicações ao mesmo tempo.",1,"Quanto mais RAM, mais programas abertos com fluidez."],
["O HD é um dispositivo externo e removível como o pen-drive.",0,"O HD é fixo no computador."],
["O pen-drive se conecta ao computador por uma entrada USB.",1,"É um meio flexível, usado em qualquer dispositivo com USB."],
["A letra C: costuma identificar o disco onde está o sistema.",1,"É o padrão mais comum no Windows."],
["O pen-drive sempre recebe a letra G:.",0,"A letra varia conforme o sistema e os dispositivos já conectados."],
["A extensão .xlsx pertence ao PowerPoint.",0,".xlsx é do Excel; o PowerPoint usa .pptx."],
["Arquivos .mp3 são arquivos de áudio.",1,"MP3 é um formato de áudio."],
["Pastas servem para organizar os documentos nas unidades de disco.",1,"Funcionam como as pastas de um escritório."],
["Pelo Explorador de Arquivos só é possível acessar o disco local.",0,"Ele acessa também pen-drives, OneDrive, rede e outros dispositivos."]],
p:[["Qual pen-drive comprar?","A turma vai entregar um trabalho com 40 fotos de 3 MB cada, um vídeo de 1,2 GB e 10 documentos de 500 KB. A papelaria vende pen-drives de 2, 4 e 8 GB.",["Calcule o espaço total em MB e GB.","Escolha o menor pen-drive que atende com folga.","Justifique considerando cópias futuras."],"Cálculo completo + escolha justificada.","Fotos: 40 × 3 = 120 MB. Documentos: 10 × 500 KB = 5.000 KB ≈ 4,9 MB. Vídeo: 1,2 GB ≈ 1.229 MB. Total ≈ 1.354 MB ≈ 1,32 GB. O de 2 GB cabe, mas com pouca folga (e a capacidade real é menor que a anunciada); o de 4 GB é a escolha mais segura."],
["A casa organizada","A família usa o mesmo computador e todos salvam tudo na Área de Trabalho, sem nenhuma organização.",["Projete uma árvore de pastas a partir de Documentos.","Inclua pastas por pessoa e por tipo (escola, filmes, músicas).","Diga onde ficariam 4 arquivos de exemplo com extensão."],"Árvore de pastas + exemplos de arquivos posicionados.","Ex.: Documentos > Minha Casa > Escola, Filmes, Músicas, Contas; ou por pessoa > Ana > Escola. Exemplos: ‘Tarefa de Matemática.docx’ em Escola; ‘Bandas de Rock.xlsx’ em Músicas; ‘Filmes de Ação.txt’ em Filmes; ‘Conta de luz.pdf’ em Contas."],
["Computador lento no trabalho","Uma recepcionista abre navegador com 20 guias, planilha e sistema da empresa ao mesmo tempo e o computador trava. O chefe quer comprar um HD maior.",["Explique a diferença de papel entre RAM e HD.","Diga se o HD maior resolve e por quê.","Proponha duas soluções."],"Diagnóstico escrito + propostas.","O problema provável é falta de RAM (muitos programas simultâneos), não falta de espaço em disco. HD maior só ajuda se o disco estiver cheio. Soluções: aumentar a RAM; fechar guias e programas sem uso; trocar HD por SSD para ganhar velocidade."],
["O terabyte que sumiu","Um cliente comprou um HD de 1 TB, mas o Windows mostra cerca de 931 GB e ele acha que foi enganado.",["Calcule 1 trilhão de bytes dividido por 1.024³.","Explique a diferença entre medida do fabricante e do Windows.","Escreva uma resposta educada ao cliente."],"Cálculo + resposta ao cliente.","Fabricantes usam base decimal (1 TB = 10¹² bytes). O Windows divide por 1.024: 10¹² ÷ 1.073.741.824 ≈ 931 GB. Não há perda; são duas formas de medir. A resposta deve explicar isso de forma simples e sem jargão."]]},

{t:"Explorador de Arquivos Parte II",
r:["Copiar envia itens à Área de transferência; o item fica lá até outro ser copiado ou recortado.","Renomear muda o nome do arquivo; Excluir envia para a Lixeira (se for do disco local) ou remove de vez (pen-drive, rede, cartão).","A Lixeira guarda temporariamente arquivos excluídos do disco rígido; quando enche, o Windows libera espaço sozinho.","Esvaziar Lixeira remove tudo definitivamente; Restaurar os itens selecionados ou Restaurar todos os itens recupera arquivos.","Menu de contexto (botão direito): Abrir, Abrir com, Compactar para ZIP, Copiar como caminho, Propriedades e Mostrar mais opções.","Selecionar tudo marca todos os itens; Seleção inversa troca o que está e o que não está marcado.","A caixa de pesquisa encontra arquivos em qualquer unidade; compactar (ZIP) reduz espaço e junta arquivos para envio."],
k:[["[[F2]]","Renomear"],["[[Ctrl]] + [[A]]","Selecionar tudo"],["[[Del]]","Enviar para a Lixeira"],["[[Shift]] + [[Del]]","Excluir sem passar pela Lixeira"],["[[Ctrl]] + [[Z]]","Desfazer a última ação"],["[[Shift]] + [[F10]]","Menu de contexto completo"]],
n:"O tamanho padrão da Lixeira varia conforme o tamanho do disco e pode ser ajustado em Propriedades da Lixeira; a apostila cita 10% como referência.",
c:[["O que acontece quando usamos o comando Copiar?","O item vai para a Área de transferência do Windows e pode ser colado em qualquer unidade; permanece lá até outro item ser copiado ou recortado."],
["Qual a diferença entre copiar e recortar (mover) um arquivo?","Copiar mantém o original e cria uma cópia no destino. Recortar retira o arquivo da origem e o coloca no destino."],
["Para onde vai um arquivo excluído do disco local? E de um pen-drive?","Do disco local, vai para a Lixeira. De pen-drive, cartão de memória ou rede, é removido permanentemente."],
["Como recuperar um único arquivo da Lixeira? E todos?","Selecionar o arquivo e clicar em Restaurar os itens selecionados. Para todos, Restaurar todos os itens."],
["O que faz Esvaziar Lixeira?","Remove definitivamente todo o conteúdo da Lixeira."],
["Diferencie Abrir e Abrir com.","Abrir usa o programa padrão do tipo de arquivo. Abrir com deixa escolher em qual programa abrir (ex.: abrir imagem no Photoshop em vez do Paint)."],
["Para que serve Copiar como caminho?","Copia o endereço completo do arquivo (ex.: C:\\Users\\Ana\\Documentos\\relatorio.docx), útil para configurações, referências e hiperlinks."],
["Que informações a opção Propriedades mostra?","Tipo de arquivo, tamanho, local, datas de criação e modificação, entre outras."],
["Explique como funciona a Seleção inversa com um exemplo.","Selecionam-se alguns itens (ex.: 2 de 10 com [[Ctrl]]) e aplica-se Seleção inversa: passam a ficar selecionados os outros 8 e os 2 deixam de estar."],
["Por que compactar arquivos em ZIP antes de enviar por e-mail?","Porque reduz o espaço ocupado e junta vários arquivos em um só, facilitando o envio."]],
f:[["Área de transferência","Memória temporária onde fica o item copiado ou recortado."],["Renomear","Alterar o nome do arquivo ([[F2]])."],["Excluir","Envia para a Lixeira; em pen-drive remove de vez."],["Lixeira","Guarda temporariamente arquivos excluídos do disco rígido."],["Esvaziar Lixeira","Apaga definitivamente tudo que está na Lixeira."],["Restaurar","Devolve o arquivo da Lixeira ao local original."],["Menu de contexto","Menu aberto com o botão direito sobre um item."],["Abrir com","Escolhe o programa que vai abrir o arquivo."],["Copiar como caminho","Copia o endereço completo do arquivo."],["Seleção inversa","Inverte a seleção atual."],["Compactar (ZIP)","Junta e reduz arquivos em um pacote .zip."],["Mostrar mais opções","Exibe o menu de contexto antigo ([[Shift]] + [[F10]])."]],
v:[["Um item copiado fica na Área de transferência até outro ser copiado ou recortado.",1,"Ao copiar ou recortar outro item, ele é substituído."],
["Arquivos excluídos de um pen-drive vão para a Lixeira.",0,"São removidos permanentemente; a Lixeira atende ao disco rígido local."],
["Renomear altera o conteúdo do arquivo.",0,"Renomear altera apenas o nome (título)."],
["Esvaziar a Lixeira remove os arquivos definitivamente.",1,"Depois disso, eles não são restaurados pela Lixeira."],
["É possível restaurar apenas um arquivo da Lixeira.",1,"Usando Restaurar os itens selecionados."],
["Quando a Lixeira atinge o limite, o Windows libera espaço automaticamente.",1,"Os itens mais antigos são removidos para dar lugar aos novos."],
["Abrir com permite escolher o programa que abrirá o arquivo.",1,"Ex.: abrir uma imagem em outro editor."],
["Copiar como caminho copia o conteúdo do arquivo.",0,"Copia apenas o endereço de onde o arquivo está."],
["A opção Propriedades mostra tamanho e datas do arquivo.",1,"Também mostra o tipo e o local."],
["Mostrar mais opções exibe a versão antiga do menu de contexto.",1,"É o menu clássico das versões anteriores."],
["Selecionar tudo marca apenas as pastas do local atual.",0,"Marca todos os arquivos e pastas do local atual."],
["A Seleção inversa marca os itens que não estavam selecionados.",1,"E desmarca os que estavam."],
["A caixa de pesquisa só procura arquivos no pen-drive.",0,"Procura em qualquer dispositivo: disco, pen-drive etc."],
["Compactar arquivos em ZIP ajuda a enviar vários documentos de uma só vez.",1,"Junta os arquivos em um pacote menor."]],
p:[["Loja ETC&TAL","Você foi contratado para organizar os arquivos da loja fictícia ETC&TAL: setores Masculino, Feminino e Infantil, com documentos de Moda Esportiva, Moda Íntima e Calçados, além de faixas etárias infantis.",["Desenhe a árvore final de pastas e arquivos.","Indique em quais passos você copia e em quais move.","Explique por que apagar os originais após copiar."],"Árvore + tabela Passo | Copiar ou Mover | Motivo.","ETC&TAL > Setor Masculino (Moda Esportiva, Moda Íntima, Calçados), Setor Feminino (os mesmos três), Setor Infantil (Bebês 1 a 5, Kids 4 a 12, Teen 10 a 16). Os três de moda são copiados (vão para dois setores); depois os originais são apagados para não duplicar. Os infantis são movidos (um único destino)."],
["Bike Sul","A loja Bike Sul precisa das pastas Bicicletas (Aro 12, 16 e 26 em documentos), Acessórios (Roupas, Óculos e Bolsas em planilhas) e Componentes (Câmbio, Freios e Pedais em apresentações).",["Desenhe a estrutura com as extensões corretas.","Escreva o caminho completo de um arquivo de cada pasta.","Proponha um padrão de nomes para futuros arquivos."],"Estrutura + 3 caminhos + padrão de nomes.","Ex.: Documentos\\Bike Sul\\Bicicletas\\Aro 26.docx; ...\\Acessórios\\Óculos.xlsx; ...\\Componentes\\Freios.pptx. Padrão sugerido: Categoria_Item_AAAA-MM (sem acentos e espaços para facilitar compartilhamento)."],
["Apaguei o trabalho!","Uma aluna apagou sem querer a pasta do TCC. Ela não sabe se apagou do computador ou do pen-drive, e já esvaziou a Lixeira uma vez esta semana.",["Liste os passos para tentar recuperar.","Explique em que casos a Lixeira não ajuda.","Proponha uma rotina de backup para evitar o problema."],"Plano de recuperação + rotina de backup.","Abrir a Lixeira e procurar (ou usar [[Ctrl]] + [[Z]] logo após apagar); se estiver lá, Restaurar. Não ajuda se veio de pen-drive, se a Lixeira foi esvaziada depois ou se usou [[Shift]] + [[Del]]. Backup: cópia semanal em nuvem (OneDrive/Drive) + pen-drive, com versões datadas."],
["Portfólio por e-mail","Para um processo seletivo, você precisa enviar 15 arquivos (fotos e PDFs) por e-mail, que aceita poucos anexos.",["Organize os arquivos em uma pasta com nomes claros.","Compacte a pasta e verifique o tamanho em Propriedades.","Escreva o nome final do ZIP e explique a escolha."],"Passos + nome do arquivo .zip.","Selecionar a pasta > botão direito > Compactar para arquivo ZIP. Conferir o tamanho em Propriedades (limites comuns de anexo ficam em torno de 20–25 MB). Nome sugerido: Portfolio_NomeSobrenome_2026.zip — identifica o candidato e o conteúdo."]]},

{t:"Personalizando o Sistema",
r:["Personalização fica em Configurações (Iniciar > Configurações) ou com o botão direito na Área de Trabalho.","Tela de fundo: imagem, cor sólida ou apresentação de slides (pasta de imagens trocadas por tempo, em ordem ou embaralhadas).","Ajustes da imagem: Preencher, Ajustar, Ampliar, Lado a lado, Centralizar e Estender.","Cores: modo Claro, Escuro ou Personalizado (um modo para o Windows e outro para os apps).","Efeitos de transparência e cor de destaque, com opção de mostrar a cor nas barras de título e bordas.","Temas alteram fundo, cor, sons e cursor do mouse; em Cursor do mouse > Ponteiros escolhe-se o esquema e a sombra do ponteiro.","Barra de tarefas: itens (Pesquisar, Visão de tarefas, Widgets, Chat), canto excedente e comportamentos (alinhamento à esquerda/centro, ocultar automaticamente)."],
k:[["[[Win]] + [[I]]","Abre Configurações"],["[[Win]] + [[D]]","Mostra a Área de Trabalho"],["[[Win]] + [[Tab]]","Visão de tarefas"]],
n:"O item Bate-papo (Chat) da barra de tarefas foi substituído pelo Microsoft Teams em versões recentes. Os nomes dos ajustes de imagem podem aparecer como Ajustar, Esticar ou Expandir conforme a tradução.",
c:[["Cite duas formas de abrir a Personalização.","Pelo menu Iniciar digitando Configurações > Personalização, ou clicando com o botão direito em um local vago da Área de Trabalho > Personalizar."],
["Quais três tipos de tela de fundo podem ser definidos?","Imagem, cor sólida ou apresentação de slides."],
["Como funciona a apresentação de slides na tela de fundo?","Escolhe-se uma pasta de imagens (botão Procurar), o tempo de troca de cada imagem e se a ordem será sequencial ou embaralhada."],
["Diferencie Preencher, Lado a lado e Centralizar.","Preencher: a imagem ocupa toda a tela. Lado a lado: repete a imagem várias vezes até preencher a tela. Centralizar: mantém o tamanho original no centro."],
["O que é o modo Personalizado em Cores?","Permite definir um modo para o Windows e outro para os aplicativos, ex.: Windows claro e apps escuros."],
["O que fazem os efeitos de transparência?","Deixam elementos como a barra de tarefas translúcidos, deixando ver o fundo e criando um visual dinâmico."],
["O que a cor de destaque altera?","Elementos do ambiente, como botões e destaques; marcando a opção, também barras de título e bordas das janelas."],
["Além do fundo e da cor, o que o painel Temas permite mudar?","Os Sons e o Cursor do mouse."],
["Para que serve a opção Ativar sombra do ponteiro?","Exibe uma sombra sutil no ponteiro do mouse, facilitando localizá-lo; é preciso clicar em Aplicar ou OK."],
["Como alinhar os ícones da barra de tarefas à esquerda?","Configurações > Personalização > Barra de tarefas > Comportamentos da barra de tarefas > Alinhamento da barra de tarefas: Esquerda."]],
f:[["Personalização","Categoria de Configurações para fundo, cores, temas e barra de tarefas."],["Apresentação de slides","Fundo que troca imagens de uma pasta por tempo."],["Preencher","A imagem ocupa a tela inteira."],["Lado a lado","Repete a imagem até preencher a tela."],["Centralizar","Imagem no tamanho original, no centro."],["Cor sólida","Fundo de uma única cor."],["Modo Personalizado","Um modo de cor para o Windows e outro para os apps."],["Transparência","Deixa a barra de tarefas e menus translúcidos."],["Cor de destaque","Cor dos realces do sistema e, opcionalmente, das bordas."],["Temas","Conjunto de fundo, cores, sons e cursor."],["Sombra do ponteiro","Sombra sutil no cursor do mouse."],["Ocultar automaticamente","A barra de tarefas some até o mouse chegar à borda."]],
v:[["É possível abrir a Personalização com o botão direito na Área de Trabalho.",1,"É um dos atalhos para essa categoria."],
["A tela de fundo aceita apenas imagens, não cores sólidas.",0,"Aceita imagem, cor sólida ou apresentação de slides."],
["Na apresentação de slides é possível embaralhar a ordem das imagens.",1,"Há a opção de ordem aleatória."],
["O ajuste Lado a lado repete a imagem até preencher a tela.",1,"É a definição desse ajuste."],
["O ajuste Centralizar estica a imagem para ocupar toda a tela.",0,"Centralizar mantém o tamanho original no centro."],
["No modo Personalizado, Windows e aplicativos podem ter modos de cor diferentes.",1,"Ex.: Windows claro e apps escuros."],
["Os efeitos de transparência não podem ser desativados.",0,"Podem ser ativados ou desativados em Cores."],
["A cor de destaque pode aparecer nas barras de título e bordas das janelas.",1,"Basta marcar a opção correspondente."],
["O painel Temas também permite alterar os sons do sistema.",1,"Temas altera fundo, cor, sons e cursor."],
["Na janela de cursor, a lista Personalizar mostra estados do ponteiro como Ocupado e Seleção de precisão.",1,"Cada estado representa uma ação ou momento do sistema."],
["Para ativar a sombra do ponteiro basta marcar a opção, sem confirmar.",0,"É preciso clicar em Aplicar ou OK."],
["Os ícones da barra de tarefas podem ser alinhados à esquerda.",1,"Em Comportamentos da barra de tarefas."],
["Ocultar automaticamente a barra de tarefas a remove do sistema.",0,"Ela só some da tela até o mouse chegar à borda."],
["O canto da barra de tarefas excedente controla ícones que aparecem no canto da barra.",1,"Permite ativar ou desativar esses ícones."]],
p:[["Notebook do professor substituto","Um professor substituto usa o notebook da sala em aulas de manhã e à noite. Reclama do brilho branco à noite e de não achar o ponteiro no projetor.",["Proponha configurações de Cores para os dois turnos.","Escolha um esquema de ponteiro e justifique.","Liste o caminho de cada configuração."],"Configuração proposta com caminhos.","Cores: modo Escuro (ou Personalizado com apps escuros) à noite. Ponteiro: esquema grande/preto ou ativar sombra do ponteiro para destacar no projetor. Caminhos: Configurações > Personalização > Cores; Personalização > Temas > Cursor do mouse > Ponteiros."],
["Identidade visual do laboratório","A escola quer que todos os computadores do laboratório tenham a mesma ‘cara’ com as cores da instituição.",["Defina tela de fundo, cor de destaque e modo de cor.","Decida sobre transparência e mostre o motivo.","Crie uma ficha de padronização para o técnico."],"Ficha de padronização no caderno.","Ficha: tela de fundo (imagem institucional, ajuste Preencher), cor de destaque com a cor da escola, exibida em barras de título, modo Claro, transparência desativada se as máquinas forem modestas (economiza recursos e melhora a leitura). Incluir caminho de cada item."],
["Fotos da formatura","Os formandos querem que o computador da secretaria mostre as fotos da turma na Área de Trabalho, trocando de tempos em tempos.",["Configure a apresentação de slides passo a passo.","Escolha o tempo de troca e a ordem.","Escolha o ajuste de imagem para fotos de tamanhos variados."],"Passo a passo + escolhas justificadas.","Configurações > Personalização > Tela de fundo > Apresentação de slides > Procurar a pasta das fotos. Tempo: 10 a 30 minutos. Ordem embaralhada para variar. Ajuste Preencher evita barras pretas sem distorcer muito."],
["Barra de tarefas enxuta","Um usuário reclama que a barra está cheia de ícones que ele nunca usa (Widgets, Chat, Visão de tarefas) e prefere o menu à esquerda, como no Windows 10.",["Liste o que desativar em Itens da barra de tarefas.","Indique o alinhamento a escolher.","Explique como reverter se ele se arrepender."],"Lista de ajustes + reversão.","Desativar Widgets, Chat/Teams e Visão de tarefas; manter Pesquisar se ele usa. Alinhamento: Esquerda. Para reverter, voltar aos mesmos interruptores em Personalização > Barra de tarefas — nada é desinstalado."]]},

{t:"Acessibilidade Parte I",
r:["Acessibilidade são medidas que garantem acesso seguro e sem barreiras a pessoas com necessidades específicas.","No Windows, Configurações > Acessibilidade divide-se em Visão, Audição e Interação.","Tamanho do texto altera todo texto do Windows e dos apps com um controle deslizante e o botão Aplicar.","Efeitos visuais: sempre mostrar barras de rolagem, transparência, animação e tempo das notificações.","Ponteiro do mouse: estilos Branco, Preto, Invertido e Personalizado; tamanho de 1 a 15.","Cursor de texto: indicador (tamanho 1 a 5, cor) e espessura da barra (1 a 20).","Lupa: Encaixado, Tela inteira ou Lente. Filtros de cor ajudam pessoas com daltonismo (deuteranopia, protanopia, tritanopia) e oferecem escalas de cinza e invertido."],
k:[["[[Win]] + [[+]]","Ativa a Lupa e aumenta o zoom"],["[[Win]] + [[Esc]]","Desativa a Lupa"],["[[Win]] + [[Ctrl]] + [[C]]","Liga/desliga filtros de cor (se o atalho estiver ativado)"],["[[Win]] + [[U]]","Abre Acessibilidade"]],
n:"",
c:[["O que é acessibilidade?","Conjunto de medidas que garantem que pessoas com necessidades especiais acessem lugares, serviços, produtos e informações de forma segura e sem barreiras."],
["Em quais três painéis está dividida a categoria Acessibilidade?","Visão, Audição e Interação."],
["Como funciona a opção Tamanho do texto?","Um controle deslizante aumenta o texto do Windows e dos aplicativos; as mudanças valem após clicar em Aplicar."],
["Cite três opções de Efeitos visuais.","Sempre mostrar as barras de rolagem, efeitos de transparência, efeitos de animação e tempo limite das notificações."],
["Quais estilos de ponteiro existem e qual a faixa de tamanho?","Branco, Preto, Invertido e Personalizado; tamanho de 1 a 15."],
["O que se ajusta no recurso Cursor de texto?","O indicador (tamanho de 1 a 5 e cor) e a espessura da barra do cursor (de 1 a 20)."],
["Quais os atalhos para ativar e desativar a Lupa?","Ativar: [[Win]] + [[+]]. Desativar: [[Win]] + [[Esc]]."],
["Diferencie os modos Encaixado, Tela inteira e Lente da Lupa.","Encaixado: área fixa no topo mostrando o conteúdo ampliado. Tela inteira: zoom na tela toda. Lente: retângulo ampliado que acompanha o ponteiro."],
["Diferencie deuteranopia, protanopia e tritanopia.","Deuteranopia: verde fraco. Protanopia: vermelho fraco (vê em bege, marrom, verde ou cinza). Tritanopia: dificuldade com azul e amarelo, tipo raro."],
["Para que servem os filtros de cor?","Mudam a paleta da tela para destacar itens que diferem só pela cor, ajudando pessoas com daltonismo ou baixa visão."]],
f:[["Acessibilidade","Medidas que garantem acesso sem barreiras."],["Visão · Audição · Interação","Os três painéis da Acessibilidade no Windows."],["Tamanho do texto","Aumenta todo texto do sistema e apps."],["Efeitos de animação","Transições suaves ao abrir, minimizar e maximizar janelas."],["Ponteiro Invertido","Muda a cor do ponteiro conforme o fundo."],["Tamanho do ponteiro","Escala de 1 a 15."],["Indicador do cursor de texto","Marcador colorido nas pontas do cursor (tamanho 1 a 5)."],["Lupa · Lente","Retângulo ampliado que acompanha o mouse."],["[[Win]] + [[Esc]]","Desativa a Lupa."],["Deuteranopia","Daltonismo com verde fraco."],["Protanopia","Daltonismo com vermelho fraco."],["Tritanopia","Daltonismo azul-amarelo, mais raro."]],
v:[["A Acessibilidade no Windows se divide em Visão, Audição e Interação.",1,"São os três painéis da categoria."],
["Tamanho do texto altera apenas o texto do Bloco de notas.",0,"Altera todo o texto do Windows e de seus aplicativos."],
["É possível manter as barras de rolagem sempre visíveis.",1,"É uma opção de Efeitos visuais."],
["Os efeitos de animação deixam suaves a abertura e o fechamento de janelas.",1,"Aplicam transições ao abrir, restaurar, maximizar e minimizar."],
["O ponteiro do mouse tem quatro estilos: Branco, Preto, Invertido e Personalizado.",1,"São os estilos disponíveis."],
["O tamanho do ponteiro vai de 1 a 50.",0,"Vai de 1 a 15."],
["O indicador do cursor de texto pode ter sua cor alterada.",1,"A apostila mostra o indicador em amarelo, por exemplo."],
["A espessura máxima do cursor de texto é 20.",1,"O valor máximo é 20."],
["[[Win]] + [[Esc]] ativa a Lupa.",0,"[[Win]] + [[Esc]] desativa; [[Win]] + [[+]] ativa."],
["No modo Lente, a área ampliada acompanha o ponteiro do mouse.",1,"O retângulo se move com o ponteiro."],
["No modo Encaixado, a Lupa aplica zoom à tela toda.",0,"Isso é o modo Tela inteira; Encaixado fixa uma área no topo."],
["A protanopia está ligada ao vermelho fraco.",1,"A pessoa tem redução ou ausência do pigmento vermelho."],
["A tritanopia é o tipo mais comum de daltonismo.",0,"É um tipo raro, ligado ao azul e amarelo."],
["Escala de cinza invertida aplica fundo preto e elementos em cinza.",1,"É a descrição do filtro."]],
p:[["Colega com baixa visão","Um novo colega de turma tem baixa visão e precisa usar o mesmo computador do laboratório que os outros.",["Liste os recursos de Visão que você ativaria.","Defina valores (tamanho do texto, ponteiro, cursor).","Explique como desfazer ao fim da aula para os próximos usuários."],"Configuração recomendada com valores.","Ex.: Tamanho do texto 150%+; ponteiro Invertido ou Personalizado amarelo, tamanho 5–8; indicador do cursor ativado, tamanho 3, cor forte; Lupa com [[Win]] + [[+]] quando necessário. Desfazer: voltar os valores padrão ou usar uma conta de usuário própria para ele, que guarda as preferências."],
["Gráfico que ninguém lê","A professora projetou um gráfico em que verde significa ‘aprovado’ e vermelho ‘reprovado’. Dois alunos com daltonismo não conseguem distinguir.",["Identifique quais tipos de daltonismo dificultam essa leitura.","Indique qual filtro de cor cada um poderia usar.","Proponha como refazer o gráfico para todos lerem."],"Análise + gráfico redesenhado no caderno.","Deuteranopia e protanopia (vermelho-verde). Usar filtros Vermelho-esverdeado correspondentes. Melhor ainda: refazer o gráfico com cores que não dependem só de verde/vermelho (azul e laranja) e acrescentar rótulos, padrões ou ícones, para que a informação não dependa só da cor."],
["Animação que dá enjoo","Um usuário relata tontura com as animações e a transparência da interface.",["Indique quais efeitos visuais desativar.","Explique o caminho até eles.","Diga outro benefício de desativá-los em computadores antigos."],"Caminho + justificativa.","Desativar Efeitos de animação e Efeitos de transparência em Configurações > Acessibilidade > Efeitos visuais. Em computadores modestos, isso também reduz o uso de recursos e deixa a interface mais rápida."],
["Lupa para a prova","Um aluno precisa ampliar trechos de um PDF durante uma prova no computador, sem perder o restante da tela.",["Escolha o modo de Lupa e justifique.","Descreva como ativar, ajustar e desativar.","Compare com o modo Tela inteira para esse caso."],"Escolha justificada + passos.","Modo Lente: amplia só onde o ponteiro está, sem esconder o resto. Ativar com [[Win]] + [[+]], escolher Exibir > Lente, ajustar o zoom com [[Win]] + [[+]]/[[-]], desativar com [[Win]] + [[Esc]]. Tela inteira amplia tudo e obriga a ‘passear’ pela tela, o que confunde em leitura longa."]]},

{t:"Aplicativos Parte II",
r:["Paint: formas, Contorno e Preencher (sólido, giz de cera, marcador, óleo, lápis natural, aquarela), espessura 1, 3, 5 e 8 px.","Painel Cores: cor 1 (contorno) e cor 2 (preenchimento), paleta padrão e Editar cores (RGB).","Pincéis, Lápis, Borracha ([[Ctrl]] + [[+]]/[[-]] muda o tamanho), Preencher e Texto.","Imagem: Inverter (vertical/horizontal), Girar (90° e 180°) e Redimensionar/Inclinar em porcentagem ou pixels.","Outlook: webmail gratuito. Campos Para, Cc (com cópia), Cco (cópia oculta), Assunto e mensagem; Caixa de Entrada e Itens Enviados.","Microsoft To Do (todo.microsoft.com): tarefas com etapas, Meu Dia, Lembrar-me, data de conclusão e Repetir.","Categorias Importante (tarefas marcadas) e Planejado (tarefas com data)."],
k:[["[[Ctrl]] + [[+]] / [[-]]","Aumenta/diminui a borracha no Paint"],["[[Ctrl]] + [[W]]","Redimensionar e inclinar no Paint"],["[[Ctrl]] + [[Enter]]","Enviar e-mail no Outlook"]],
n:"Ao criar contas (Outlook), use senha forte e única e ative a verificação em duas etapas. Nunca compartilhe a senha com colegas.",
c:[["Qual a diferença entre Contorno e Preencher no Paint?","Contorno define o estilo da linha da borda da forma; Preencher define o estilo do interior."],
["Cite quatro estilos de contorno do Paint.","Sólido, Giz de cera, Marcador, Pincel para óleo, Lápis natural e Pincel para aquarela."],
["Explique as três colunas do painel Cores.","Coluna 1: cor do contorno e cor do preenchimento. Coluna 2: tabela de cores padrão. Coluna 3: botão para editar cores."],
["Como aumentar e diminuir a borracha pelo teclado?","[[Ctrl]] + [[+]] aumenta e [[Ctrl]] + [[-]] diminui."],
["Diferencie Inverter e Girar no painel Imagem.","Inverter espelha o objeto (vertical ou horizontal). Girar rotaciona 90° para a direita, para a esquerda ou 180°."],
["Em que unidades se redimensiona uma imagem no Paint e o que mais pode ser alterado nessa janela?","Em porcentagem ou pixels, horizontal e vertical; também é possível inclinar em graus."],
["Diferencie Para, Cc e Cco.","Para: destinatário principal. Cc: recebe cópia e aparece para todos. Cco: recebe cópia oculta; os outros não sabem que ele recebeu."],
["Por que o campo Assunto é importante?","Ele estimula o destinatário a abrir o e-mail e identifica o conteúdo da mensagem."],
["O que são etapas no Microsoft To Do? Dê um exemplo.","São subdivisões de uma tarefa. Tarefa: criar logotipo; etapas: pesquisar sobre a empresa, escolher cores, desenhar e enviar para aprovação."],
["Quando uma tarefa aparece em Importante e quando aparece em Planejado?","Importante: quando é marcada com a estrela de importante. Planejado: quando tem data de conclusão definida."]],
f:[["Contorno","Estilo da borda de uma forma no Paint."],["Preencher (forma)","Estilo do interior de uma forma."],["Editar cores","Escolhe tom exato por RGB ou hexadecimal."],["Ferramenta Preencher","Balde que colore uma área fechada."],["Inverter","Espelha o objeto na vertical ou horizontal."],["Inclinar","Distorce o objeto em graus."],["Cc","Com cópia: destinatário visível para todos."],["Cco","Com cópia oculta: destinatário invisível aos demais."],["Itens Enviados","Lista os e-mails que você enviou."],["Meu Dia","Lista das tarefas escolhidas para hoje no To Do."],["Lembrar-me","Notificação da tarefa em data e hora escolhidas."],["Repetir","Tarefa recorrente: diária, semanal, anual."]],
v:[["No Paint, Contorno e Preencher podem ter estilos diferentes na mesma forma.",1,"São configurações independentes."],
["A espessura de linha no Paint é medida em centímetros.",0,"É medida em pixels (1, 3, 5 e 8 px)."],
["No painel Cores, uma cor é para o contorno e outra para o preenchimento.",1,"É a função da coluna 1."],
["A borracha do Paint não pode mudar de tamanho.",0,"Muda com [[Ctrl]] + [[+]] e [[Ctrl]] + [[-]]."],
["A ferramenta Texto permite escolher fonte, tamanho e alinhamento.",1,"Ao clicar na área, surgem as opções de formatação."],
["Girar no Paint permite rotacionar 90° ou 180°.",1,"São as opções do painel Imagem > Girar."],
["Redimensionar no Paint aceita apenas porcentagem.",0,"Aceita porcentagem ou pixels."],
["O Outlook é um serviço de webmail da Microsoft.",1,"É gratuito e permite gerenciar e-mails e contatos."],
["Quem recebe em Cco vê todos os outros destinatários ocultos.",0,"Cco oculta os destinatários; ninguém vê quem mais recebeu em cópia oculta."],
["Vários destinatários no campo Para podem ser separados por ponto e vírgula.",1,"É o separador indicado na aula."],
["Itens Enviados permite verificar se um e-mail realmente foi enviado.",1,"Lista todos os e-mails enviados."],
["No To Do, uma tarefa não pode ter subdivisões.",0,"É possível adicionar etapas."],
["Tarefas com data de conclusão aparecem na categoria Planejado.",1,"Isso facilita a visualização e o controle."],
["O Pincel de formatação do Outlook copia a formatação de um texto para outro.",1,"Seleciona-se o texto formatado e aplica-se a outro trecho."]],
p:[["Logotipo da cantina","A cantina da escola quer um logotipo simples feito no Paint, com forma, texto e cores da escola.",["Planeje o logo: formas, cores (com código) e texto.","Liste as ferramentas do Paint para cada parte.","Defina o tamanho final em pixels e justifique."],"Esboço no caderno + lista de ferramentas.","Ex.: círculo com contorno sólido 8 px e preenchimento na cor da escola (Editar cores > hex), ícone de talher com formas/curvas, texto com ferramenta Texto. Tamanho 500 × 500 px, bom para impressão pequena e redes sociais; usar Redimensionar se preciso."],
["E-mail para a coordenação","Você precisa enviar o trabalho em grupo ao professor, mantendo a coordenação informada e o colega que faltou em cópia sem expor o e-mail dele a todos.",["Defina quem vai em Para, Cc e Cco.","Escreva um assunto claro.","Escreva o corpo do e-mail (5 a 7 linhas)."],"Rascunho completo do e-mail.","Para: professor. Cc: coordenação. Cco: colega. Assunto: ‘Trabalho em grupo – Turma X – Tema Y’. Corpo: saudação, o que está sendo enviado, integrantes, observação breve, agradecimento e assinatura com nome e turma."],
["Semana de provas no To Do","A semana de provas tem 5 avaliações, 2 trabalhos e o treino de futebol às terças e quintas.",["Crie as tarefas com datas e lembretes.","Divida um trabalho em etapas.","Diga quais vão para Importante e quais repetem."],"Lista de tarefas como ficaria no app.","Cada prova: tarefa com data de conclusão e Lembrar-me na véspera. Trabalho dividido em etapas (pesquisar, escrever, revisar, entregar). Importante: provas e entregas. Repetir: treino semanal às terças e quintas. Meu Dia: o que fazer hoje."],
["Conta segura","Você vai criar sua conta Outlook para usar o To Do. Um colega sugere usar a mesma senha do Instagram para não esquecer.",["Explique o risco de reutilizar senhas.","Crie uma regra para montar uma senha forte (sem revelar a sua).","Cite uma camada extra de proteção."],"Regras de senha + explicação.","Se um serviço vazar, todos com a mesma senha ficam expostos. Regra: frase longa com 12+ caracteres, misturando palavras, números e símbolos, única por serviço; gerenciador de senhas ajuda. Camada extra: verificação em duas etapas (app autenticador ou SMS)."]]},

{t:"Aplicativos Parte III · Paint 3D",
r:["O Paint 3D traz ferramentas 2D e 3D fáceis de usar, sem exigir conhecimento de design 3D.","Pincéis (10): marcador, caneta de caligrafia, pincel para óleo, aquarela, caneta de pixel, lápis, borracha, giz de cera, tubo de spray e preenchimento; todos com espessura e opacidade.","Materiais: fosco, brilho, metal opaco e metal polido.","Formas 2D: linha, curvas de 3, 4 e 5 pontos e formas prontas; Selo replica, Confirmar aplica, alças redimensionam, Girar e inverter.","Formas 3D: esboço 3D (borda suave/aguda), pincel tubular (forma de tubo, espessura, cônico), modelos 3D (homem, mulher, cão, gato, peixe).","Adesivos, Texto 2D/3D, Efeitos de iluminação, Tela (mostrar, transparente, redimensionar) e Biblioteca 3D.","Exibição 3D: com [[Alt]] e o botão do mouse pressionados, gira-se a cena e muda-se a perspectiva."],
k:[["[[Alt]] + arrastar","Gira a visão 3D da cena"],["[[Ctrl]] + [[Z]]","Desfazer"],["[[Ctrl]] + [[S]]","Salvar projeto"]],
n:"O Paint 3D foi descontinuado e retirado da Microsoft Store em novembro de 2024. Quem já o tem instalado pode continuar usando. Para praticar modelagem 3D hoje: Tinkercad (online, gratuito) ou Blender.",
c:[["Qual a principal vantagem do Paint 3D em relação ao Paint para quem não sabe desenhar?","Oferece ferramentas básicas e avançadas fáceis de usar, sem exigir saber desenhar ou ter conhecimento de design 3D."],
["Cite os 10 pincéis do Paint 3D.","Marcador, caneta de caligrafia, pincel para óleo, aquarela, caneta de pixel, lápis, borracha, giz de cera, tubo de spray e preenchimento."],
["Diferencie marcador e caneta de caligrafia.","O marcador tem traço uniforme e limpo. A caneta de caligrafia varia a espessura conforme a velocidade do movimento."],
["Para que servem a tolerância e a opacidade no preenchimento?","Tolerância define quanto da imagem será colorida; opacidade define a transparência do objeto."],
["O que fazem o Selo, o Confirmar e as alças de uma forma?","Selo replica a forma; Confirmar (o V) aplica as modificações; alças redimensionam."],
["Quais tipos de curva o Paint 3D oferece e para que servem os pontos?","Curvas de 3, 4 e 5 pontos; os pontos permitem arrastar e alterar o formato da curva."],
["Diferencie borda suave e borda aguda no esboço 3D.","Borda suave arredonda os cantos do desenho; borda aguda cria um desenho plano, sem suavizar cantos."],
["O que indica o timer laranja no pincel tubular?","Que o objeto está chegando ao limite de tamanho; todo laranja significa que não dá para continuar desenhando, só editar pelos pontos."],
["Descreva as quatro opções de Cônico.","Não cônico (mesma espessura); Grande para pequeno; Pequeno para grande; Pequeno-grande-pequeno; e Grande-pequeno-grande."],
["Para que serve a opção Tela transparente?","Para salvar o desenho sem o fundo branco padrão."]],
f:[["Paint 3D","Editor 2D/3D do Windows, descontinuado em 2024."],["Caneta de caligrafia","Espessura varia com a velocidade do traço."],["Caneta de pixel","Colore totalmente cada pixel por onde passa."],["Tubo de spray","Acumula cor quando mantido pressionado."],["Material metal polido","Visual metálico, como cobre."],["Selo","Replica a forma selecionada."],["Curva de 5 pontos","Curva com cinco pontos editáveis."],["Borda suave","Esboço 3D com cantos arredondados."],["Pincel tubular","Cria volumes 3D em forma de tubo."],["Cônico","Define como a espessura do tubo varia."],["Adesivos","Figuras ou texturas aplicadas sobre formas 3D."],["Biblioteca 3D","Galeria de objetos 3D por categoria (Animais, Espaço...)."]],
