<title>Método Office Visual</title>
<meta name="description" content="Disciplina interativa de Word, Excel e PowerPoint">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: console de estudo — trilho lateral com módulos + área de trabalho; cada programa tem sua cor (Word azul, Excel verde, PowerPoint laranja). */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunken:#E9EDF2; --ink:#18202C; --muted:#5A6577; --line:#D6DCE4;
  --word:#2556B0; --word-soft:#E4ECFA; --excel:#17724A; --excel-soft:#E1F2E9; --ppt:#C2461D; --ppt-soft:#FBE8E0; --all:#5A47B0; --all-soft:#ECE9FA;
  --ok:#17724A; --ok-soft:#DFF3E7; --bad:#B42318; --bad-soft:#FDE6E3; --warn:#9A6400; --warn-soft:#FFF3D6;
  --accent:var(--word); --accent-soft:var(--word-soft);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:10px; --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151B; --surface:#1A2029; --sunken:#232B36; --ink:#E8EDF4; --muted:#9AA6B6; --line:#2E3845;
  --word:#7EA6F0; --word-soft:#1E2A42; --excel:#5CC892; --excel-soft:#16302A; --ppt:#F08A63; --ppt-soft:#3A2219; --all:#A898F0; --all-soft:#272240;
  --ok:#5CC892; --ok-soft:#16302A; --bad:#F28B82; --bad-soft:#3A1D1B; --warn:#F2C060; --warn-soft:#3A2F14;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151B; --surface:#1A2029; --sunken:#232B36; --ink:#E8EDF4; --muted:#9AA6B6; --line:#2E3845;
  --word:#7EA6F0; --word-soft:#1E2A42; --excel:#5CC892; --excel-soft:#16302A; --ppt:#F08A63; --ppt-soft:#3A2219; --all:#A898F0; --all-soft:#272240;
  --ok:#5CC892; --ok-soft:#16302A; --bad:#F28B82; --bad-soft:#3A1D1B; --warn:#F2C060; --warn-soft:#3A2F14;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100%}
/* ---------- sidebar ---------- */
.side{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{display:flex;gap:12px;align-items:center;padding:20px 18px;border-bottom:1px solid var(--line)}
.logo{width:42px;height:42px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;flex:none}
.logo i{border-radius:4px}.logo i:nth-child(1){background:var(--word)}.logo i:nth-child(2){background:var(--excel)}.logo i:nth-child(3){background:var(--ppt)}.logo i:nth-child(4){background:var(--all)}
.brand b{font-family:var(--f-display);font-size:18px;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:13px}
.nav{padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:15px}
.nav a:hover{background:var(--sunken)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav .lab{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px;display:flex;justify-content:space-between}
.nav .num{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:700;flex:none;color:#fff}
.nav .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .pc{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.side-foot{margin-top:auto;padding:14px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.toggle[hidden]{display:none}
.switch{width:40px;height:22px;border-radius:20px;background:var(--line);border:0;position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch[aria-pressed="true"]{background:var(--accent)}.switch[aria-pressed="true"]::after{left:21px}
.bg-word{background:var(--word)}.bg-excel{background:var(--excel)}.bg-ppt{background:var(--ppt)}.bg-all{background:var(--all)}
:root[data-theme="dark"] .nav .num, .dk .nav .num{color:#11151B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .nav .num{color:#11151B}}
/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 28px}
.crumb{font-family:var(--f-mono);font-size:13px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--ink)}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px}
.mini{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.bar{height:8px;background:var(--sunken);border-radius:10px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:10px;transition:width .3s}
.mini .bar{width:110px}
main{min-width:0}
.wrap{max-width:1080px;margin:0 auto;padding-inline:28px;padding-block:28px 64px;display:flex;flex-direction:column;gap:28px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted);font-size:18px;max-width:64ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.btn{text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.meta{font-family:var(--f-mono);font-size:12px;color:var(--accent);display:flex;gap:10px;flex-wrap:wrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}
/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:end}
.hero h1{font-size:clamp(34px,5vw,54px);font-weight:800}
.hero h1 span{color:var(--accent)}
.prog{padding:20px;display:flex;flex-direction:column;gap:12px}
.prog .big{font-family:var(--f-display);font-size:40px;font-weight:800;line-height:1}
.prog .big small{font-size:18px;color:var(--muted);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{padding:16px 18px}
.stat b{font-family:var(--f-display);font-size:30px;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:14px}
.route{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.route span{padding:5px 10px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.route em{color:var(--muted);font-style:normal}
.matrix{display:grid;grid-template-columns:110px repeat(3,minmax(0,1fr));gap:12px}
.mx-h{font-family:var(--f-display);font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
.mx-h i{width:12px;height:12px;border-radius:3px}
.mx-l{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;flex-direction:column;justify-content:center;text-transform:uppercase;letter-spacing:.06em}
.mx-l b{font-family:var(--f-display);text-transform:none;letter-spacing:0;color:var(--ink);font-size:16px}
.mcard{padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer;color:var(--ink);text-decoration:none;transition:transform .12s,border-color .12s}
.mcard:hover{transform:translateY(-2px);border-color:var(--c)}
.mcard .tag{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12px;color:var(--c)}
.mcard h3{font-size:18px}
.mcard p{color:var(--muted);font-size:14px}
.mcard .bar>i{background:var(--c)}
.mcard.wide{flex-direction:row;align-items:center;gap:20px;flex-wrap:wrap}
.mcard.wide>div{flex:1;min-width:220px;display:flex;flex-direction:column;gap:6px}
/* ---------- module ---------- */
.mhead{display:flex;flex-direction:column;gap:10px}
.mhead h1{font-size:clamp(30px,4vw,44px);font-weight:800}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-family:var(--f-mono);font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:0}
.tab{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;font-weight:600;color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:-1px}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:11px;background:var(--sunken);padding:1px 7px;border-radius:10px;color:var(--muted)}
.tab.on .n{background:var(--accent-soft);color:var(--accent)}
.tab .n.full{background:var(--ok-soft);color:var(--ok)}
.sec-intro{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap}
.sec-intro p{color:var(--muted);max-width:62ch}
.list{display:flex;flex-direction:column;gap:14px}
.item{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.item .meta{font-family:var(--f-mono);font-size:12px;color:var(--accent);display:flex;gap:10px;flex-wrap:wrap}
.item .q{font-weight:700;font-size:17px}
.lessons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.lesson{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.lesson .pg{font-family:var(--f-mono);font-size:12px;color:var(--accent);display:flex;justify-content:space-between;align-items:center}
.lesson h3{font-size:19px}
.box{border-radius:8px;padding:10px 12px;font-size:14.5px;display:flex;gap:10px}
.box b{flex:none;font-family:var(--f-display)}
.box.tip{background:var(--warn-soft)}.box.tip b{color:var(--warn)}
.box.do{background:var(--accent-soft)}.box.do b{color:var(--accent)}
.read{border:1px solid var(--line);background:none;border-radius:20px;padding:3px 10px;font-size:12px;font-family:var(--f-mono)}
.read[aria-pressed="true"]{background:var(--ok-soft);color:var(--ok);border-color:transparent}
/* answers */
.ans{border-radius:8px;padding:12px 14px;background:var(--sunken);font-size:15px;display:flex;flex-direction:column;gap:4px}
.ans.ok{background:var(--ok-soft)}.ans.bad{background:var(--bad-soft)}
.ans h4{font-size:15px}.ans.ok h4{color:var(--ok)}.ans.bad h4{color:var(--bad)}
.check{display:flex;gap:8px;align-items:center;font-size:14.5px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;display:flex;gap:12px;align-items:baseline}
.opt b{font-family:var(--f-mono);color:var(--accent)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.vf{display:flex;gap:8px}
.vf button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 18px;font-weight:700}
.vf button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
textarea{width:100%;min-height:70px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;resize:vertical}
.hint{font-size:13px;color:var(--muted)}
/* flashcards */
.deck{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;justify-items:center}
.flip{width:min(640px,100%);aspect-ratio:16/9;perspective:1200px;border:0;background:none;padding:0}
.flip .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.show .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;text-align:center;border:1px solid var(--line);box-shadow:var(--shadow)}
.face.f{background:var(--surface)}
.face.b{background:var(--accent);color:var(--surface);transform:rotateY(180deg);border-color:transparent}
.face small{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.face p{font-family:var(--f-display);font-size:clamp(19px,3vw,27px);font-weight:700;line-height:1.25}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dots button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:11px}
.dots button.cur{border-color:var(--accent);color:var(--accent);font-weight:700}
.dots button.k-ok{background:var(--ok-soft);border-color:var(--ok)}
.dots button.k-rev{background:var(--warn-soft);border-color:var(--warn)}
/* pbl */
.pbl{padding:22px;display:flex;flex-direction:column;gap:16px}
.pbl h3{font-size:22px}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.cols h4{font-size:15px;margin-bottom:8px;color:var(--accent)}
.cols ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.tasks{display:flex;flex-direction:column;gap:6px}
.score{font-family:var(--f-display);font-size:22px;font-weight:800;color:var(--accent)}
/* shortcuts */
kbd{font-family:var(--f-mono);font-size:12.5px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--surface);border:1px solid var(--line);border-bottom-width:3px;white-space:nowrap}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.kitem{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.kitem span{font-size:14.5px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 14px;font-weight:600;font-size:14px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.teacher-flag{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:14px;font-weight:600}
.code{font-family:var(--f-mono);font-size:.92em;background:var(--sunken);padding:1px 5px;border-radius:4px}
.danger{color:var(--bad)}
.scrim{display:none}
/* ---------- responsive ---------- */
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:290px;max-width:86vw;z-index:20;transform:translateX(-102%);transition:transform .2s;height:100%;padding-top:env(safe-area-inset-top,0px)}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15}
  .menu-btn{display:inline-flex}
  .hero,.cols,.lessons{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .matrix{grid-template-columns:minmax(0,1fr)}
  .mx-head{display:none}.mx-l{flex-direction:row;gap:8px;align-items:baseline;padding-top:8px}
  .top{padding:10px 16px}.wrap{padding-inline:16px}
  .mini .bar{width:60px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.tab{white-space:nowrap;flex:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app">
  <aside class="side" id="side">
    <div class="brand"><div class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div><b>Método Office Visual</b><small>Word · Excel · PowerPoint</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="toggle" id="tModeRow" hidden><span>Modo professor<br><small class="hint">mostra todas as respostas</small></span><button class="switch" id="tMode" aria-pressed="false" aria-label="Modo professor"></button></div>
      <div class="toggle"><span>Tema escuro</span><button class="switch" id="tTheme" aria-pressed="false" aria-label="Tema escuro"></button></div>
      <button class="btn sm" id="reset">Zerar meu progresso</button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main>
    <div class="top"><button class="menu-btn" id="menuBtn" aria-label="Abrir menu">☰ Menu</button><div class="crumb" id="crumb"></div><div class="mini"><div class="bar"><i id="topBar"></i></div><span id="topPct"></span></div></div>
    <div class="wrap" id="view"></div>
  </main>
</div>

<script>
const MODS = [];
const M = m => MODS.push(m);

/* ============ MÓDULO 1 — WORD ESSENCIAL ============ */
M({id:1, app:'word', title:'Word Essencial', sub:'Do primeiro documento ao aviso pronto para imprimir', pages:'01–10',
L:[
['Conheça a tela inicial do Word','Barra de acesso rápido (salvar, desfazer, refazer), Faixa de Opções com as guias, Página do documento onde você digita, Barra de status (páginas e palavras) e Zoom.','Não precisa decorar tudo agora: você aprende cada área enquanto pratica.','Abra o Word, crie um documento em branco e localize as cinco áreas.'],
['Digite, selecione e corrija textos','Clique para posicionar o cursor e digite. Arraste do início ao fim para selecionar. Backspace apaga à esquerda do cursor; Delete apaga à direita.','Dois cliques selecionam uma palavra; três cliques selecionam o parágrafo.','Digite três frases, selecione a segunda e apague uma palavra.'],
['Deixe o texto claro e organizado','Na guia Página Inicial: fonte muda o estilo das letras, tamanho aumenta ou reduz, negrito destaca termos importantes e cor ajuda a criar hierarquia visual.','Use os mesmos botões de fonte em todo o documento para manter o padrão.','Digite “Meu Plano de Estudos”, aplique Arial 24 e negrito.'],
['Organize os parágrafos','Alinhamentos: à esquerda (leitura de textos longos), centralizado (títulos e convites), à direita (datas e assinaturas) e justificado (alinha as duas margens). O espaçamento entre linhas de 1,15 ou 1,5 deixa o texto respirar.','Não use a barra de espaço para alinhar texto: use os botões de alinhamento.','Escreva um parágrafo curto e teste os quatro alinhamentos.'],
['Crie listas que facilitam a leitura','Marcadores organizam itens quando a ordem não importa. Numeração organiza etapas ou instruções em sequência.','Pressione Enter para criar o próximo item; Enter duas vezes encerra a lista.','Crie uma lista de compras com cinco itens e uma lista numerada com três tarefas.'],
['Insira imagens no Word','Inserir > Imagens > Este Dispositivo. Use as alças dos cantos para redimensionar sem deformar. Opções de Layout > Quadrado permite mover a imagem ao lado do texto.','Redimensione pelos cantos, nunca pelas laterais, para manter a proporção.','Insira uma imagem, diminua o tamanho e posicione-a ao lado de um parágrafo.'],
['Organize informações com tabelas','Inserir > Tabela, passe o mouse pela grade e clique (ex.: 3x4). Tab avança para a próxima célula. Títulos em negrito em cada coluna facilitam a leitura.','Tab na última célula cria uma nova linha automaticamente.','Crie uma tabela com três colunas para registrar seus gastos do dia.'],
['Prepare a página antes de imprimir','Guia Layout: Margens (Normal na maioria dos casos), Orientação (Retrato para textos, Paisagem para tabelas largas) e Tamanho (A4 no Brasil).','Configure a página antes de terminar o documento para evitar retrabalho.','Configure um documento com margens Normais, papel A4 e orientação Retrato.'],
['Salve sem perder seu trabalho','Salvar (Ctrl+B) atualiza o arquivo atual. Salvar Como cria uma cópia com novo nome ou local. Exportar em PDF mantém o visual para enviar ou imprimir.','Use nomes claros e inclua a data quando houver várias versões.','Salve um documento em DOCX e depois crie uma cópia em PDF.'],
['Projeto prático: crie um aviso','Junte tudo: título centralizado, negrito nas informações principais, marcadores, imagem ou ícone, alinhamento e espaçamento revisados, salvar em DOCX e exportar em PDF.','Confira antes de finalizar: título destacado, informações fáceis de localizar, texto sem erros, arquivo salvo.','Crie um aviso de reunião de equipe com data, horário, local e assuntos.']],
C:[
['Desenhe no caderno a tela do Word e identifique com setas: Barra de acesso rápido, Faixa de Opções, Página, Barra de status e Zoom. Escreva para que serve cada uma.','Acesso rápido: salvar/desfazer/refazer. Faixa de Opções: guias com ferramentas. Página: área de digitação. Barra de status: nº de páginas e palavras. Zoom: aproxima ou afasta a visualização (não muda o tamanho real do texto).'],
['Explique com suas palavras a diferença entre as teclas Backspace e Delete. Dê um exemplo de quando usar cada uma.','Backspace apaga o caractere à esquerda do cursor (corrigir o que acabou de digitar). Delete apaga o caractere à direita (remover algo que está à frente do cursor sem reposicioná-lo).'],
['Monte uma tabela no caderno com os 4 tipos de alinhamento e indique um uso real de cada.','Esquerda: textos longos, cartas. Centralizado: títulos, convites. Direita: datas, assinaturas, valores. Justificado: textos acadêmicos e jornais, com as duas margens retas.'],
['Quando usar marcadores e quando usar numeração? Escreva dois exemplos de cada.','Marcadores quando a ordem não importa (lista de compras, materiais). Numeração quando a ordem importa (passo a passo de instalação, etapas de uma receita).'],
['Diferencie Salvar, Salvar Como e Exportar em PDF. Em qual situação cada um é a melhor escolha?','Salvar: atualiza o arquivo atual. Salvar Como: cria nova cópia com outro nome/local (versões). PDF: arquivo final para enviar ou imprimir, que mantém o visual e não é feito para edição.'],
['Faça um rascunho (esboço) de um aviso de reunião indicando onde ficarão título, data, horário, local, assuntos e imagem.','Resposta esperada: título no topo, centralizado e em destaque; bloco com data/horário/local em negrito; lista com marcadores para os assuntos; imagem/ícone próximo ao título; mensagem de fechamento ao final.']],
F:[

['Quantos cliques selecionam uma palavra?','Dois cliques. Três cliques selecionam o parágrafo inteiro.'],
['Qual alinhamento deixa as duas margens retas?','Justificado.'],
['Como encerrar uma lista com marcadores?','Pressionando Enter duas vezes.'],
['Por que redimensionar a imagem pelos cantos?','Para manter a proporção e não deformar a imagem.'],
['Qual tecla leva à próxima célula em uma tabela?','Tab.'],
['Qual tamanho de papel é o padrão no Brasil?','A4.'],
['Orientação ideal para uma tabela muito larga?','Paisagem.'],
['Formato ideal para enviar um documento sem que o visual mude?','PDF.'],
['Espaçamento entre linhas recomendado para textos agradáveis?','1,15 ou 1,5.']],

/* ============ MÓDULO 2 — EXCEL ESSENCIAL ============ */
M({id:2, app:'excel', title:'Excel Essencial', sub:'Células, fórmulas, gráficos e o controle dos seus gastos', pages:'11–20',
L:[
['Conheça a tela inicial do Excel','Colunas são identificadas por letras, linhas por números. A célula é o encontro de linha e coluna (B3 = coluna B + linha 3). A Barra de fórmulas mostra ou edita o conteúdo. As abas da planilha organizam páginas diferentes.','A borda verde mostra qual célula está selecionada.','Abra o Excel, clique nas células A1, B3 e D5 e observe o endereço de cada uma.'],
['Preencha a planilha com rapidez','Digite e pressione Enter para descer ou Tab para ir à direita. Arraste a alça de preenchimento (quadradinho no canto) para completar sequências como datas e meses.','Digite os dois primeiros itens da sequência antes de arrastar.','Digite Janeiro e Fevereiro, selecione os dois e arraste até Junho.'],
['Mostre cada número do jeito certo','O formato muda a aparência do valor sem alterar o que foi digitado: Geral, Moeda (R$ 1.500,00), Porcentagem (25%), Data (15/09/2026). Aumentar/diminuir casas decimais ajusta a exibição.','Digite 0,25 e aplique Porcentagem para ver 25%.','Digite 1500, 0,25 e 15/09/2026 e aplique o formato correto em cada célula.'],
['Faça cálculos direto nas células','Toda conta começa com o sinal de igual. Operadores: + soma, - subtração, * multiplicação, / divisão. Use endereços: =A1+B1. Se A1 ou B1 mudar, o resultado se atualiza.','Use o endereço da célula em vez de digitar o número novamente.','Digite 20 em A1 e 4 em B1 e faça as quatro operações.'],
['Quatro fórmulas que resolvem o básico','=SOMA(B2:B5), =MÉDIA(B2:B5), =MÍNIMO(B2:B5), =MÁXIMO(B2:B5). B2:B5 significa todas as células de B2 até B5.','Fórmulas usam parênteses para indicar quais células serão calculadas.','Digite cinco valores e descubra soma, média, menor e maior.'],
['Faça o Excel responder por você','=SE(B2>=7;"APROVADO";"REPROVADO"): teste lógico; resultado se verdadeiro; resultado se falso.','Textos dentro de fórmulas precisam ficar entre aspas.','Digite três notas e use SE para mostrar APROVADO ou REPROVADO.'],
['Encontre qualquer informação em segundos','Classificar organiza do menor para o maior ou em ordem alfabética. Filtrar mostra apenas os dados que atendem ao critério escolhido. Ambos ficam na guia Dados.','Filtrar não exclui dados: os demais apenas ficam ocultos.','Crie uma lista com cinco produtos e filtre apenas uma categoria.'],
['Transforme dados em uma tabela inteligente','Selecione os dados e use Formatar como Tabela. A tabela ganha filtros nos títulos, linhas alternadas e se expande automaticamente quando você adiciona novas linhas.','Use nomes únicos e claros em cada cabeçalho.','Transforme uma lista de gastos em tabela e escolha um estilo.'],
['Transforme números em um gráfico','Selecione os dados, Inserir > Gráfico de Colunas. Colunas comparam categorias, Linhas mostram mudança no tempo, Pizza mostra partes de um total.','Um gráfico simples costuma comunicar melhor do que um gráfico cheio de efeitos.','Crie um gráfico com seus gastos de quatro semanas.'],
['Projeto prático: controle seus gastos','Monte uma planilha com Data, Descrição, Categoria, Entrada e Saída. Use =SOMA para totais e =Entradas−Saídas para o saldo. Formate como moeda e crie um gráfico comparando entradas e saídas.','Destaque o saldo para encontrá-lo rápido.','Monte o controle do mês de setembro e crie o gráfico.']],
C:[
['Desenhe uma grade de 4 colunas (A–D) e 5 linhas. Marque com X as células B3 e D5. Explique como se forma o endereço de uma célula.','Endereço = letra da coluna + número da linha. B3 fica na coluna B, linha 3; D5 na coluna D, linha 5.'],
['Escreva as fórmulas para: somar A1 e B1; subtrair B1 de A1; multiplicar; dividir A1 por B1. Calcule os resultados com A1=20 e B1=4.','=A1+B1 → 24; =A1-B1 → 16; =A1*B1 → 80; =A1/B1 → 5.'],
['Com as notas 6, 8, 5, 9 em B2:B5, calcule à mão SOMA, MÉDIA, MÍNIMO e MÁXIMO e escreva a fórmula de cada uma.','=SOMA(B2:B5)=28; =MÉDIA(B2:B5)=7; =MÍNIMO(B2:B5)=5; =MÁXIMO(B2:B5)=9.'],
['Escreva a fórmula SE que mostra "APROVADO" para nota maior ou igual a 7 em B2. Separe e nomeie as três partes da fórmula.','=SE(B2>=7;"APROVADO";"REPROVADO"). Parte 1: teste lógico B2>=7. Parte 2: valor se verdadeiro. Parte 3: valor se falso.'],
['Explique a diferença entre Classificar e Filtrar com um exemplo de uma lista de alunos.','Classificar reordena todos (ex.: alunos em ordem alfabética). Filtrar exibe só quem atende ao critério (ex.: só a turma A), ocultando os demais sem excluí-los.'],
['Para cada situação, indique o gráfico ideal: (a) vendas por produto; (b) temperatura ao longo do mês; (c) divisão do orçamento familiar.','(a) Colunas – comparar categorias; (b) Linhas – mudança no tempo; (c) Pizza – partes de um total.']],
F:[
['O que é uma célula?','O encontro de uma coluna com uma linha, ex.: B3.'],
['Com que sinal toda fórmula começa?','Com o sinal de igual (=).'],
['O que significa B2:B5?','Todas as células de B2 até B5.'],
['Operador de multiplicação no Excel?','Asterisco (*).'],
['Para que serve a alça de preenchimento?','Para arrastar e completar sequências ou copiar fórmulas.'],
['Formatar 0,25 como Porcentagem mostra…','25%.'],
['Filtrar exclui os dados que não aparecem?','Não. Eles apenas ficam ocultos.'],
['Gráfico ideal para partes de um total?','Pizza.'],
['Na fórmula SE, onde vão os textos?','Entre aspas: "APROVADO".'],
['Vantagem de Formatar como Tabela?','Filtros automáticos, linhas alternadas e expansão automática.']],
V:[
['No Excel, as linhas são identificadas por letras.',false,'Colunas usam letras; linhas usam números.'],
['Tab leva para a célula à direita e Enter para a célula abaixo.',true,'É o fluxo padrão de digitação.'],

['Na fórmula SE, os textos podem ser escritos sem aspas.',false,'Sem aspas, o Excel interpreta o texto como nome e mostra erro #NOME?.'],
['Classificar pode colocar uma lista em ordem alfabética.',true,'Classificar de A a Z ordena textos alfabeticamente.'],
['Ao usar filtro, os dados ocultos são apagados da planilha.',false,'O filtro só oculta; ao limpar o filtro, tudo volta.'],
['Gráfico de linhas é indicado para mostrar evolução ao longo do tempo.',true,'Linhas destacam tendências entre períodos.'],
['Uma tabela formatada se expande ao digitar logo abaixo dela.',true,'É uma das vantagens da tabela inteligente.'],
['Digitar 10+5 numa célula, sem o sinal de igual, mostra 15.',false,'Sem =, o Excel trata como texto e mostra “10+5”.'],
['No controle de gastos, o saldo é calculado por Entradas − Saídas.',true,'É a diferença entre o que entrou e o que saiu.']],
Q:[

['Qual fórmula soma de A1 até A10?',['=SOMA(A1;A10)','=SOMA(A1:A10)','SOMA A1-A10','=A1+A10'],1,'Os dois-pontos indicam o intervalo inteiro; o ponto e vírgula somaria só as duas células.'],

['Você quer ver apenas os gastos da categoria Transporte. Use:',['Classificar','Filtrar','Mesclar','Congelar'],1,'Filtrar exibe só as linhas que atendem ao critério.'],
['Qual formato mostra 15/09/2026 corretamente?',['Moeda','Data','Porcentagem','Texto científico'],1,'O formato Data exibe dia/mês/ano.'],
['Para comparar vendas de 4 produtos, o gráfico mais indicado é:',['Pizza','Colunas','Dispersão','Nenhum'],1,'Colunas comparam categorias lado a lado.'],
['O que faz a alça de preenchimento com “Jan” e “Fev” selecionados?',['Apaga','Continua Mar, Abr...','Copia Jan sempre','Cria gráfico'],1,'O Excel reconhece o padrão e continua a sequência.'],
['Qual operador faz divisão?',['\\','÷','/','%'],2,'A barra / é o operador de divisão.'],
['No controle de gastos, a célula mais importante a destacar é:',['A data','O saldo','A categoria','O título da aba'],1,'O saldo mostra a situação final do mês.']],
P:[

/* ============ MÓDULO 3 — POWERPOINT ESSENCIAL ============ */
M({id:3, app:'ppt', title:'PowerPoint Essencial', sub:'Slides claros, bem alinhados e prontos para apresentar', pages:'21–30',
L:[
['Conheça a tela inicial do PowerPoint','Miniaturas mostram todos os slides; a área do slide é onde você monta o conteúdo; Faixa de Opções reúne as ferramentas; Painel de anotações guarda lembretes do apresentador; Barra de status controla visualização e zoom.','Use as miniaturas para mudar a ordem dos slides arrastando.','Abra o PowerPoint, crie uma apresentação em branco e localize as cinco áreas.'],
['Escolha o layout certo para cada slide','Página Inicial > Novo Slide > escolha o layout: Título, Título e Conteúdo, Duas Partes, Somente Título, Em branco. O layout organiza espaços prontos para título, texto e imagens.','Escolha o layout antes de preencher o slide.','Crie quatro slides, cada um com um layout diferente.'],
['Faça o texto ser entendido de longe','Título de 28 a 36 pt, texto com pelo menos 20 pt, contraste entre texto e fundo e no máximo poucos tópicos por slide.','Se você precisa se aproximar da tela para ler, o texto está pequeno demais.','Resuma um parágrafo em três tópicos de no máximo seis palavras.'],
['Insira imagens sem deformar','Inserir > Imagens > Este Dispositivo. Arraste pelos cantos. Use Cortar (Formato da Imagem) para remover partes sem deformar.','Prefira uma imagem forte a várias imagens pequenas competindo.','Insira uma foto, corte parte da imagem e redimensione pelos cantos.'],
['Use formas e ícones para explicar ideias','Inserir > Formas ou Ícones. Use o Formato da Forma para mudar cor e contorno. Processos em etapas ficam mais claros com formas e setas.','Use o mesmo estilo de ícones em toda a apresentação.','Crie um processo de três etapas usando formas e setas.'],
['Alinhe tudo com aparência profissional','Selecione vários objetos (Shift + clique), Formato > Alinhar: alinhar ao meio, distribuir horizontalmente. Ctrl+G agrupa e Ctrl+Shift+G desagrupa.','Ative Exibir > Guias para posicionar elementos com mais precisão.','Crie três caixas, alinhe ao meio e distribua horizontalmente.'],
['Mude de slide com suavidade','Guia Transições: escolha um efeito (Esmaecer é uma escolha segura), defina a duração e use Aplicar a Todos. Transição acontece entre slides.','Esmaecer com cerca de 1 segundo é uma escolha segura para apresentações profissionais.','Aplique Esmaecer em três slides e use Aplicar a Todos.'],
['Faça os elementos aparecerem na hora certa','Guia Animações: Entrada (faz o objeto aparecer), Ênfase (chama atenção) e Saída (remove do slide). O Painel de Animação mostra e organiza a ordem. Início: Ao clicar, Com o anterior, Após o anterior.','Anime apenas o que ajuda a conduzir a atenção.','Faça três tópicos aparecerem um por vez, na ordem correta.'],
['Apresente e compartilhe com segurança','F5 inicia do primeiro slide; Shift+F5 do slide atual; Esc encerra. Modo de Apresentador mostra anotações e próximo slide. Salve em PPTX e uma cópia em PDF.','Leve o arquivo PPTX e uma cópia em PDF para evitar imprevistos.','Inicie com F5, avance dois slides e encerre com Esc.'],
['Projeto prático: crie uma apresentação','Cinco slides: Capa, Sobre, Produtos, Diferenciais e Contato. Use layouts, imagens, ícones, alinhamento, transição suave e salve PPTX e PDF.','Confira antes de finalizar: todos os slides seguem o mesmo estilo? Textos podem ser lidos de longe?','Apresente cinco slides em menos de dois minutos.']],

['Reescreva este slide em no máximo 3 tópicos: “Neste mês, o nosso time conseguiu aumentar as vendas em 32% graças às novas estratégias de divulgação nas redes sociais e ao atendimento mais rápido.”','Exemplo: “Vendas +32% no mês” / “Divulgação nas redes” / “Atendimento mais rápido”. O título pode ser “Resultados do mês”.'],

L:[

['Encontre e troque palavras em segundos','Localizar (Ctrl+L) encontra palavras ou frases. Substituir (Ctrl+U) troca um termo por outro, um por um ou com Substituir Tudo.','Revise antes de usar Substituir Tudo: ele altera todas as ocorrências.','Escreva um parágrafo e substitua uma palavra repetida.'],
['Revise o texto antes de entregar','Guia Revisão > Editor: Ortografia (palavras escritas incorretamente), Gramática (concordância e construção de frases) e Clareza (sugestões de formas mais simples). Aceite, ignore ou corrija.','O corretor ajuda, mas não entende todo o contexto. Leia o documento novamente.','Escreva um parágrafo com erros e analise as sugestões.'],

['Destaque informações com bordas e cores','Selecione o texto, use Sombreamento e Bordas > Bordas Externas. Bom para títulos, avisos e resumos.','Evite combinar muitas cores e bordas grossas na mesma página.','Crie uma caixa de aviso com fundo claro e borda azul.'],

['Organize títulos com Estilos','Selecione o título > Página Inicial > Estilos > Título 1 ou Título 2. Estilos mantêm o padrão e permitem criar sumário automático.','Use Título 1 nas seções principais e Título 2 nas subseções.','Crie um título principal, duas subseções e aplique os estilos.'],

['Atalhos essenciais do Word','Edição: Ctrl+C, Ctrl+X, Ctrl+V, Ctrl+Z. Formatação: Ctrl+N (negrito), Ctrl+I (itálico), Ctrl+S (sublinhado). Documento: Ctrl+B (salvar), Ctrl+P (imprimir), Ctrl+L (localizar), Ctrl+U (substituir), Ctrl+T (selecionar tudo).','Não tente decorar todos de uma vez. Comece pelos quatro que mais usa.','Realize uma tarefa usando o teclado sem clicar nos comandos da Faixa de Opções.']],

['Descreva um caso em que “Substituir Tudo” pode causar um erro. Como evitar?','Ex.: trocar “ano” por “período” também altera “Mariano” e “humano”. Evite revisando ocorrência por ocorrência ou marcando “Palavras inteiras”.'],

['Explique o que são Estilos de Título e duas vantagens de usá-los.','Formatações padronizadas para títulos (Título 1, Título 2). Vantagens: padrão visual em todo o documento e geração de sumário automático/navegação.'],
['Liste 5 itens que devem estar num currículo de uma página e 2 que devem ficar de fora.','Dentro: nome/contato, objetivo, formação, experiência, habilidades. Fora: informações irrelevantes para a vaga, excesso de detalhes pessoais, fotos inadequadas.'],

/* ============ MÓDULO 5 — EXCEL PRODUTIVO ============ */
M({id:5, app:'excel', title:'Excel Produtivo', sub:'Listas, validação, porcentagens e funções condicionais', pages:'41–50',
L:[
['Mantenha os títulos sempre visíveis','Exibir > Congelar Painéis: Congelar Linha Superior (títulos), Congelar Primeira Coluna (nomes) ou Congelar Painéis (linhas e colunas escolhidas).','Para voltar ao normal, use Exibir > Congelar Painéis > Descongelar Painéis.','Crie uma lista com 20 linhas e mantenha o cabeçalho visível durante a rolagem.'],
['Crie uma lista de opções na célula','Selecione as células, Dados > Validação de Dados > Permitir: Lista, e digite as opções separadas por ponto e vírgula (Pendente;Em andamento;Concluído).','Use opções curtas e fáceis de identificar.','Crie uma coluna Situação com as opções Pago e Pendente.'],
['Remova dados repetidos com segurança','Faça uma cópia da planilha, selecione a tabela, Dados > Remover Duplicatas, marque as colunas que devem ser comparadas e confirme.','Se marcar apenas Nome, pessoas diferentes com o mesmo nome podem ser removidas.','Digite uma lista com dois nomes repetidos e remova as duplicatas.'],
['Calcule porcentagens sem complicação','10% de 200: =200*10%. Preço com desconto de 10%: =200*(1-10%). Aumento de 15%: =100*(1+15%). 10% também pode ser representado por 0,10.','Formate a célula da taxa como Porcentagem.','Calcule 20% de R$ 150,00 e depois o preço com desconto.'],
['Conte quantas vezes uma condição aparece','=CONT.SE(B2:B6;"Pago"): o intervalo analisado e a condição procurada. Retorna a quantidade encontrada.','Quando a condição é texto, use aspas.','Crie uma lista com Presente e Ausente e conte quantos estão presentes.'],
['Some apenas os valores de uma categoria','=SOMASE(A2:A6;"Alimentação";B2:B6): onde procurar a categoria, a condição e os valores a somar.','Os dois intervalos precisam ter o mesmo número de linhas.','Crie uma lista de despesas e some somente os valores de Transporte.'],
['Fixe uma célula com o sinal de dólar','Referência relativa muda quando você arrasta (A2, A3, A4...). Referência absoluta ($F$2) permanece igual. F4 alterna entre os tipos.','Pressione F4 após clicar na referência dentro da fórmula.','Calcule a comissão de 5% para vários valores usando uma taxa fixa.'],
['Imprima a planilha em uma página','Layout da Página: Orientação, Área de Impressão, Dimensionar para Ajustar (Largura e Altura em 1 página). Retrato para tabelas com poucas colunas; Paisagem para muitas colunas.','Se o texto ficar pequeno demais, use 1 página de largura e deixe a altura automática.','Configure uma tabela com 8 colunas para caber em uma página no modo Paisagem.'],
['Atividade guiada: controle de estoque','Colunas Produto, Entrada, Saída, Estoque atual (=B2-C2) e Status. Use formatação condicional para destacar estoques menores que o mínimo (ex.: REPOR).','Use uma coluna para alertas e observe o resultado na tela.','Monte o estoque com 5 produtos e destaque os itens a repor.'],
['Guia rápido de fórmulas do Excel','=A1+B1, =A1-B1, =A1*B1, =A1/B1, =SOMA(A1:A10), =MÉDIA(A1:A10), =MÍNIMO, =MÁXIMO, =CONT.SE(A1:A10;"Pago"). Símbolos: = inicia, : intervalo, ; separa argumentos, $ fixa, " " indica texto.','Clique em uma célula e observe a fórmula na barra de fórmulas.','Em uma coluna com 10 despesas, calcule soma, média, menor e maior valor.']],
C:[
['Explique quando usar Congelar Linha Superior, Congelar Primeira Coluna e Congelar Painéis.','Linha Superior: manter cabeçalho visível ao rolar para baixo. Primeira Coluna: manter nomes visíveis ao rolar para a direita. Painéis: ambos, a partir da célula selecionada.'],
['Calcule à mão e escreva a fórmula: (a) 15% de R$ 300; (b) R$ 300 com 15% de desconto; (c) R$ 300 com aumento de 15%.','(a) =300*15% = 45; (b) =300*(1-15%) = 255; (c) =300*(1+15%) = 345.'],

{t:'Estoque da cantina escolar',cen:'A cantina perde vendas porque produtos acabam sem aviso. A responsável anota entradas e saídas em um caderno.',perg:['Que informação dispara o pedido de reposição?','Como impedir que alguém escreva “refri”, “Refrigerante” e “REFRI” para o mesmo produto?','Como contar quantos itens precisam ser repostos?'],tarefas:['Defina no caderno as colunas e o estoque mínimo de cada produto','Monte a planilha com 8 produtos','Use lista suspensa para Categoria','Calcule Estoque = Entrada − Saída','Use SE e formatação condicional para REPOR','Use CONT.SE para contar itens a repor','Congele o cabeçalho e configure impressão em 1 página'],entrega:'Estoque_Cantina.xlsx + relatório curto no caderno',rub:['Estrutura e validação (2 pts)','Fórmulas corretas (3 pts)','Alerta visual (2 pts)','CONT.SE correto (1 pt)','Pronta para impressão (2 pts)']},

/* ============ MÓDULO 6 — POWERPOINT PRODUTIVO ============ */
M({id:6, app:'ppt', title:'PowerPoint Produtivo', sub:'Slide Mestre, diagramas, contraste e gráficos', pages:'51–60',
L:[
['Escolha o layout certo para cada slide','Slide de Título para abertura; Título e Conteúdo para explicação; Duas Partes para comparação; Em Branco para criação livre. Página Inicial > Layout troca o layout de um slide existente.','Escolha o layout antes de inserir os elementos para economizar tempo.','Crie quatro slides usando um layout diferente em cada um.'],
['Use o Slide Mestre para manter o padrão','Exibir > Slide Mestre. Altere fontes, cores, rodapé e posição do logotipo no slide mestre e o ajuste vale para todos os slides. Feche com Fechar Modo de Exibição Mestre.','Faça ajustes globais antes de começar os slides.','Crie um padrão com título azul, fonte única e logotipo no canto.'],
['Alinhe e distribua os elementos','Selecione os objetos (Shift ou Ctrl + clique), Formato da Forma > Alinhar. ALINHAR = mesma linha; DISTRIBUIR = mesmo espaço entre objetos.','Use Exibir > Guias para posicionar elementos com mais precisão.','Alinhe três imagens e distribua igualmente.'],
['Recorte imagens no formato que quiser','Formato da Imagem > Cortar remove excessos. Cortar para Demarcar Forma transforma a foto em círculo, quadrado e outras formas. Proporção 1:1 mantém o quadrado perfeito.','Não estique a imagem pelas laterais; use as alças dos cantos.','Transforme uma foto retangular em um círculo.'],
['Crie diagramas com formas e ícones','Inserir > Formas e Inserir > Ícones. Exemplo: processo em 3 etapas (Planejar → Criar → Apresentar). Agrupe para mover tudo junto.','Use no máximo 3 cores para manter o diagrama claro.','Crie um processo de 4 etapas com formas e ícones.'],
['Melhore a leitura com contraste','Fundo branco + texto azul escuro: ótimo. Fundo azul escuro + texto branco: ótimo. Amarelo sobre branco ou vermelho sobre vermelho: ruim. Título 32 pt ou mais; corpo 20 pt ou mais.','Negrito ajuda nos destaques, mas não em todo o texto.','Corrija um slide de baixo contraste.'],
['Transforme números em gráficos','Inserir > Gráfico > Colunas. Substitua os dados na planilha que abre. Colunas comparam valores; Linhas mostram evolução; Pizza mostra partes de um total.','Destaque apenas o dado mais importante com cor diferente.','Crie um gráfico de colunas com vendas de jan a jun.'],
['Use anotações sem lotar o slide','O texto detalhado vai no painel de anotações; o slide fica com a mensagem visual. Use o Modo de Exibição do Apresentador para ler as anotações durante a fala.','As anotações ajudam a lembrar, mas não substituem o ensaio.','Escreva 3 lembretes nas anotações de um slide.'],
['Atividade guiada: apresentação em 5 slides','Capa, Problema, Solução, Resultados, Encerramento. Um tema, uma ideia principal por slide, imagens e ícones coerentes e ensaio cronometrado.','Faça um ensaio com cronômetro antes de apresentar.','Apresente em até 5 minutos.'],
['Checklist final antes de apresentar','Conteúdo (objetivo claro, textos curtos, ortografia), Design (fontes legíveis, contraste, alinhamento), Mídia (imagens nítidas, vídeos e áudios testados), Apresentação (ordem, anotações, tempo) e Arquivo (PPTX, PDF, cópia em pendrive ou nuvem).','Teste a apresentação no computador e no projetor que serão usados.','Marque cada item do checklist e faça um ensaio completo.']],
C:[
['Explique o que é o Slide Mestre e cite 3 elementos que você colocaria nele.','É o modelo que controla o visual de todos os slides. Elementos: fonte/cores dos títulos, logotipo, rodapé com data ou nome do evento.'],
['Desenhe dois slides: um com baixo contraste e outro corrigido. Indique as cores usadas.','Ruim: texto amarelo sobre fundo branco. Corrigido: texto azul escuro sobre fundo branco (ou branco sobre azul escuro).'],
['Qual a diferença entre Alinhar e Distribuir? Faça um esquema com 3 retângulos.','Alinhar coloca os objetos na mesma linha/borda; Distribuir iguala os espaços entre eles.'],
['Para cada conjunto de dados, indique o gráfico: (a) vendas por mês no semestre; (b) votos por candidato da chapa; (c) percentual de cada despesa.','(a) Linhas ou colunas para evolução; (b) Colunas para comparar; (c) Pizza para partes do todo.'],
['Escreva o roteiro (1 frase por slide) de uma apresentação Problema-Solução em 5 slides.','Capa: nome do projeto. Problema: o que precisa melhorar. Solução: a proposta. Resultados: impacto esperado com números. Encerramento: próximos passos e agradecimento.'],
['Transforme seu checklist final em 5 perguntas que você faria a si mesmo antes de apresentar.','Ex.: A mensagem está clara? Dá para ler do fundo da sala? As mídias funcionam no computador do evento? Cabe no tempo? Tenho cópia em PDF/pendrive?']],
F:[

['Alinhar x Distribuir?','Alinhar = mesma linha; Distribuir = mesmo espaço entre objetos.'],
['Como transformar foto em círculo?','Cortar > Cortar para Demarcar Forma > Elipse (proporção 1:1).'],

{t:'Proposta para a direção',cen:'Sua equipe quer convencer a direção a criar um laboratório maker. Vocês terão 5 minutos na reunião e a direção recebe muitos pedidos.',perg:['Qual problema concreto o laboratório resolve?','Que número convence mais?','Que estrutura de slides conduz à decisão?'],tarefas:['Escreva no caderno o problema, a solução e 2 dados','Crie o Slide Mestre com fonte, cores e logotipo','Monte os 5 slides (Capa, Problema, Solução, Resultados, Encerramento)','Crie um diagrama em 3 etapas e um gráfico','Coloque a fala nas anotações','Passe pelo checklist final e cronometre'],entrega:'Proposta_Maker.pptx + PDF',rub:['Narrativa problema→solução (2 pts)','Slide Mestre aplicado (2 pts)','Contraste e legibilidade (2 pts)','Gráfico/diagrama claros (2 pts)','Tempo e anotações (2 pts)']},

M({id:7, app:'word', title:'Word Profissional', sub:'Sumário, revisão colaborativa, mala direta e relatórios', pages:'61–70',
L:[
['Adicione cabeçalho e rodapé','Inserir > Cabeçalho ou Rodapé > escolha um modelo > digite > Fechar. Marque Primeira Página Diferente para que a capa não tenha cabeçalho.','Cabeçalho e rodapé ajudam a manter o documento organizado e padronizado.','Insira o nome do curso no cabeçalho e a data no rodapé.'],
['Numere as páginas automaticamente','Inserir > Número de Página > escolha a posição (Início, Fim, Margens) e o estilo. Formatar Números de Página define o formato e o número inicial.','Para ocultar o número da capa, ative Primeira Página Diferente.','Numere um documento de quatro páginas no rodapé central.'],
['Crie um sumário automático','1) Aplique Título 1, Título 2 e Título 3. 2) Referências > Sumário > Sumário Automático. 3) Após mudanças, Atualizar Sumário.','O Word só reconhece títulos formatados com estilos.','Crie três títulos e duas subseções e insira o sumário.'],
['Divida o texto em colunas','Layout > Mais Colunas permite definir quantidade, largura e espaçamento e linha entre colunas. Use Quebra de Coluna para controlar onde o texto continua.','Colunas funcionam melhor com fonte legível e parágrafos curtos.','Transforme um texto de duas páginas em duas colunas.'],
['Revise ortografia e gramática','Revisão > Editor: ortografia (sublinhado vermelho), gramática (azul duplo), clareza. Confirme o idioma Português (Brasil) em Revisão > Idioma.','Leia a frase completa antes de aceitar uma sugestão.','Corrija um texto com 3 erros intencionais.'],
['Faça revisões com comentários','Revisão > Novo Comentário marca trechos sem alterar o texto. Controlar Alterações registra cada edição para aceitar ou rejeitar depois. Responder e Resolver encerram a conversa.','Remova os comentários e aceite ou rejeite as alterações antes da versão final.','Adicione dois comentários em um texto.'],
['Crie documentos personalizados com Mala Direta','Prepare uma lista no Excel (Nome, Curso, Data). No Word: Correspondências > Iniciar Mala Direta > Selecionar Destinatários > Inserir Campo de Mesclagem > Visualizar > Concluir e Mesclar.','Revise a lista no Excel antes de mesclar: erros nos dados se repetem em todos os documentos.','Crie três certificados com nomes diferentes.'],
['Monte um currículo claro e profissional','Nome e contato, resumo profissional curto, experiências (mais recentes primeiro), formação e cursos, habilidades. Evite foto sem solicitação, informações falsas, excesso de cores e erros de português.','Use no máximo duas fontes e salve uma cópia em PDF antes de enviar.','Crie seu currículo em uma página usando títulos e listas.'],
['Atividade guiada: relatório de uma página','Configure margens, título e subtítulo, introdução, tabela de atividades, imagem com legenda, conclusão e revisão final (checklist: alinhamento, fonte, espaçamento, tabela, ortografia).','Salve em DOCX para continuar editando e exporte em PDF para enviar.','Escreva um relatório de atividades de uma página.'],
['Guia rápido de atalhos do Word','Ctrl+N negrito, Ctrl+I itálico, Ctrl+S sublinhado, Ctrl+C copiar, Ctrl+V colar, Ctrl+X recortar, Ctrl+Z desfazer, Ctrl+Y refazer, Ctrl+T selecionar tudo, Ctrl+L localizar, Ctrl+P imprimir, Ctrl+B salvar, Ctrl+Enter quebra de página, F7 verificar ortografia, Shift+F3 alternar maiúsculas e minúsculas.','Alguns atalhos podem variar conforme o idioma do Office.','Use cinco atalhos enquanto edita um texto.']],
C:[
['Explique por que o sumário automático não aparece quando os títulos foram formatados só com negrito e tamanho 16.','O sumário lê estilos de título (Título 1, 2, 3). Negrito manual não é reconhecido como título.'],
['Descreva o passo a passo para que a capa não tenha número de página, mas as demais páginas tenham.','Inserir número de página > ativar Primeira Página Diferente nas ferramentas de cabeçalho/rodapé (e ajustar Formatar Números para iniciar onde desejar).'],
['Qual a diferença entre um comentário e uma alteração controlada? Dê um exemplo de uso em um trabalho em grupo.','Comentário: observação sem mudar o texto (“falta fonte aqui”). Alteração controlada: edição registrada que pode ser aceita/rejeitada (troca de uma palavra).'],
['Liste as 5 etapas da Mala Direta para gerar certificados.','1) Lista no Excel; 2) Iniciar Mala Direta; 3) Selecionar Destinatários; 4) Inserir Campos de Mesclagem; 5) Visualizar Resultados e Concluir e Mesclar.'],
['Monte o esqueleto de um relatório de uma página com as seções e o que vai em cada uma.','Título/subtítulo; introdução (objetivo); tabela de atividades (atividade, responsável, status); imagem com legenda; conclusão com próximos passos.'],
['Escreva 6 atalhos que você mais usaria e por quê.','Resposta pessoal. Ex.: Ctrl+B (salvar sempre), Ctrl+Z (corrigir), Ctrl+C/V (reaproveitar), Ctrl+Enter (nova página limpa), F7 (revisão), Ctrl+L (achar trechos).']],
F:[

['O que fazer após mudar títulos?','Atualizar Sumário.'],

/* ============ MÓDULO 8 — EXCEL PROFISSIONAL ============ */
M({id:8, app:'excel', title:'Excel Profissional', sub:'Decisões, datas, textos, proteção e diagnóstico de erros', pages:'71–80',
L:[
['Tome decisões com a função SE','=SE(B2>=7;"APROVADO";"REPROVADO"). Teste lógico, valor se verdadeiro, valor se falso. Arraste a fórmula para aplicar nas demais células.','Textos dentro da fórmula precisam estar entre aspas.','Crie uma coluna Status que mostre "Meta atingida" quando as vendas forem maiores ou iguais a 1000.'],
['Encontre o menor e o maior valor','=MÍNIMO(B2:B6) encontra o menor número; =MÁXIMO(B2:B6) o maior. Células vazias e textos são ignorados nessas funções.','Combine com formatação condicional para destacar os extremos.','Encontre o menor e o maior valor de despesa de uma lista com 8 valores.'],
['Trabalhe com datas no Excel','Digite a data com barras, formate como Data. Datas são números, então =A2+B2 soma dias a uma data. =HOJE() retorna a data atual automaticamente.','Se a data aparecer como número, aplique o formato Data.','Calcule os vencimentos de três contas somando prazos em dias.'],
['Junte textos de várias células','=A2&" "&B2 junta nome e sobrenome com espaço. =A5&"-"&B5 cria códigos (PED-105). Alternativa: =CONCAT(A2;" ";B2).','Qualquer separador digitado entre aspas aparece no resultado.','Una Cidade e Estado no formato "Barreiras - BA".'],
['Classifique dados por mais de um critério','Dados > Classificar > Adicionar Nível. Ex.: primeiro por Categoria (A a Z), depois por Vendas (maior para o menor). Marque “Meus dados contêm cabeçalhos”.','Selecione toda a tabela para não separar linhas.','Organize alunos por Turma e depois por Nota.'],
['Proteja fórmulas contra alterações','Todas as células começam Bloqueadas. Selecione as células de preenchimento, Ctrl+1 > Proteção > desmarque Bloqueadas. Depois Revisão > Proteger Planilha (senha opcional).','A opção Bloqueada só tem efeito quando a planilha está protegida.','Libere B2:C5 para preenchimento e proteja D2:D5 com fórmulas.'],
['Mostre tendências com minigráficos','Inserir > Minigráficos > Linha, Coluna ou Ganhos/Perdas. Escolha o intervalo de dados e o local. São pequenos gráficos dentro de uma célula.','Use marcadores para destacar o maior e o menor ponto.','Crie minigráficos de linha para as vendas de quatro produtos.'],
['Entenda os erros mais comuns','#DIV/0! divisão por zero ou célula vazia; #NOME? nome de função errado; #VALOR! tipo de dado incompatível; #REF! referência excluída ou inválida; ##### coluna estreita demais.','Clique na célula com erro e confira a fórmula na barra de fórmulas.','Identifique e corrija três erros em uma planilha fictícia.'],
['Atividade guiada: orçamento mensal','Tabela de receitas e despesas, =SOMA para totais, saldo = receitas − despesas, formatação moeda, cores para alertas e gráfico de pizza das despesas.','Atualize a planilha toda semana para acompanhar o mês.','Crie seu orçamento mensal e um gráfico das despesas.'],
['Guia rápido de atalhos do Excel','Ctrl+C/X/V/Z, Ctrl+Y refazer, Ctrl+B salvar, Ctrl+P imprimir, Ctrl+1 formatar células, F2 editar célula, F4 repetir ação ou alternar $, Ctrl+Setas ir ao limite, Ctrl+Shift+Setas selecionar até o limite, Ctrl+Espaço seleciona coluna, Shift+Espaço seleciona linha, Alt+= AutoSoma.','Alguns atalhos podem variar conforme o idioma e a versão do Excel.','Use cinco atalhos para organizar uma tabela.']],
C:[
['Escreva a fórmula SE que mostra "Meta atingida" quando C2 ≥ 1000 e "Abaixo da meta" caso contrário. Teste com 950 e 1200.','=SE(C2>=1000;"Meta atingida";"Abaixo da meta"). 950 → Abaixo da meta; 1200 → Meta atingida.'],
['Uma conta foi emitida em 01/09/2026 com prazo de 30 dias. Escreva a fórmula do vencimento e o resultado.','=A2+B2 → 01/10/2026 (setembro tem 30 dias).'],
['Escreva a fórmula que gera o código “PED-105” a partir de A5 = PED e B5 = 105, de duas formas.','=A5&"-"&B5 e =CONCAT(A5;"-";B5).'],
['Explique, em ordem, como proteger as fórmulas e deixar só as células de entrada liberadas.','1) Selecionar células de entrada; 2) Ctrl+1 > Proteção > desmarcar Bloqueadas; 3) Revisão > Proteger Planilha; 4) senha opcional.'],
['Para cada erro, escreva uma causa e a correção: #DIV/0!, #NOME?, #VALOR!, #REF!, #####.','#DIV/0!: divisor zero/vazio → preencher ou usar SE. #NOME?: função digitada errada → corrigir nome. #VALOR!: texto em conta → corrigir dado. #REF!: célula referenciada apagada → refazer referência. #####: coluna estreita → alargar.'],
['Planeje no caderno seu orçamento mensal: liste 3 receitas, 6 despesas e escreva as fórmulas de total e saldo.','Ex.: =SOMA(B3:B5) receitas; =SOMA(E3:E8) despesas; saldo =B6-E9. Resposta pessoal nos valores.']],
F:[

['Operador para juntar textos?','& (e comercial).'],

/* ============ MÓDULO 9 — POWERPOINT PROFISSIONAL ============ */
M({id:9, app:'ppt', title:'PowerPoint Profissional', sub:'Seções, mídia, navegação, vídeo e apresentação de impacto', pages:'81–90',
L:[
['Organize os slides em seções','Selecione o primeiro slide do grupo, Página Inicial > Seção > Adicionar Seção, renomeie. Recolha e expanda seções para navegar e mover grupos inteiros.','Use nomes curtos que representem cada etapa da apresentação.','Divida uma apresentação de nove slides em três seções.'],
['Reutilize slides de outra apresentação','Novo Slide > Reutilizar Slides, procure o arquivo e clique na miniatura. Marque “Manter formatação original” para preservar o visual antigo; desmarcado, o slide adota o tema atual.','Revise fontes, cores e imagens depois de importar.','Importe dois slides de outro arquivo e adapte ao tema atual.'],
['Crie links e botões de navegação','Selecione o texto ou forma, Inserir > Link (Ctrl+K) > Colocar neste Documento > escolha o slide. Botões de ação navegam entre slides; hiperlinks podem abrir sites, arquivos ou slides.','Teste todos os links no modo apresentação.','Crie um menu com três botões que levem a slides diferentes.'],
['Insira áudio e vídeo nos slides','Inserir > Vídeo/Áudio > Este Dispositivo. Guia Reprodução: Iniciar automaticamente ou ao clicar, cortar, volume. Mídia incorporada fica no arquivo; vinculada depende do arquivo externo.','Mantenha os arquivos de mídia na mesma pasta da apresentação.','Insira um vídeo curto e configure para tocar ao clicar.'],
['Remova o fundo de uma imagem','Formato da Imagem > Remover Plano de Fundo. Ajuste com Marcar Áreas para Manter e Marcar Áreas para Remover, depois Manter Alterações.','Funciona melhor com fundo simples e contraste entre objeto e fundo.','Remova o fundo de uma imagem e posicione-a sobre uma cor.'],
['Reduza o tamanho da apresentação','Compactar Imagens (Formato da Imagem) reduz resolução e exclui áreas cortadas. Arquivo > Informações > Compactar Mídia reduz vídeos e áudios.','Salve uma cópia antes de compactar para não perder a qualidade original.','Compare o tamanho do arquivo antes e depois da compactação.'],
['Ensaie e controle o tempo da apresentação','Apresentação de Slides > Testar Intervalos. Fale normalmente, avance como faria ao vivo e salve os intervalos. Use Intervalos para avanço automático.','Faça o ensaio em voz alta e registre os tempos para acompanhar.','Ensaie cinco slides em até 3 minutos.'],
['Transforme a apresentação em vídeo','Arquivo > Exportar > Criar um Vídeo. Escolha a qualidade (Full HD é adequada), use ou não intervalos e narrações gravados e clique em Criar Vídeo (MP4).','Aguarde a barra de progresso terminar antes de fechar o PowerPoint.','Exporte três slides em MP4 e confira som, imagem e tempo.'],
['Atividade guiada: apresente uma ideia','Seis slides: Capa, Problema, Solução, Benefícios, Plano de ação, Encerramento. Checklist: mesmo padrão visual, bom contraste, fontes legíveis, elementos alinhados, transições discretas e duração até cinco minutos.','Comece pelo problema e termine com uma ação clara.','Apresente sua ideia em até seis slides.'],
['Guia rápido de atalhos do PowerPoint','Ctrl+M novo slide, Ctrl+D duplicar, Ctrl+G agrupar, Ctrl+Shift+G desagrupar, Ctrl+K inserir link, Ctrl+Z/Y, Ctrl+B salvar, F5 iniciar do começo, Shift+F5 slide atual, Esc encerrar, B tela preta, W tela branca, Ctrl+Enter avançar para próximo espaço reservado.','Alguns atalhos variam conforme versão, idioma e sistema.','Duplique um slide, agrupe objetos e inicie pelo slide atual usando atalhos.']],
C:[
['Uma apresentação tem 15 slides. Proponha 4 seções com nomes curtos e quantos slides cada uma teria.','Ex.: Abertura (2), Problema (4), Solução (6), Conclusão (3). Resposta pessoal coerente.'],
['Explique a diferença entre mídia incorporada e vinculada e o risco de cada uma.','Incorporada: fica dentro do arquivo (mais segura, arquivo maior). Vinculada: depende do arquivo externo (arquivo menor, mas quebra se mudar de pasta/computador).'],
['Descreva como criar um menu interativo com 3 botões e um botão “Voltar ao menu”.','Criar formas, Ctrl+K > Colocar neste Documento > slide destino; em cada slide, uma forma com link para o slide do menu. Testar em modo apresentação.'],
['Em quais situações Remover Plano de Fundo funciona melhor? E quando falha?','Melhor: fundo liso e contraste alto. Falha: fundo cheio de detalhes, cores parecidas com o objeto, cabelos/bordas finas.'],
['Por que exportar a apresentação em vídeo? Cite 2 usos.','Para quem não tem PowerPoint ou para aulas assíncronas: postar em plataforma de ensino, redes sociais, enviar por mensagem.'],
['Escreva o roteiro dos 6 slides da atividade “Apresente uma ideia” com uma frase por slide.','Capa (nome da ideia); Problema; Solução; Benefícios (2–3 com ícones); Plano de ação (etapas e prazos); Encerramento (chamada para ação).']],
F:[

['Guia com opções de início e corte do vídeo?','Reprodução.'],
['Ferramenta para tirar o fundo da foto?','Remover Plano de Fundo.'],
['Como reduzir o tamanho do arquivo por causa das fotos?','Compactar Imagens.'],

function modCounts(m){
  const id = m.id, c = {caderno:0, flash:0, vf:0, quiz:0, pbl:0, licoes:0, okq:0, okv:0};
  m.C.forEach((_,i)=>{ if(get(`${id}:c:${i}`)) c.caderno++; });
  m.F.forEach((_,i)=>{ if(get(`${id}:f:${i}`)) c.flash++; });
  m.V.forEach((_,i)=>{ const v=get(`${id}:v:${i}`); if(v&&v.done){c.vf++; if(v.ok)c.okv++;} });
  m.Q.forEach((_,i)=>{ const v=get(`${id}:q:${i}`); if(v!=null){c.quiz++; if(v===m.Q[i][2])c.okq++;} });
  m.P.forEach((_,i)=>{ const v=get(`${id}:p:${i}`); if(v&&v.done) c.pbl++; });
  m.L.forEach((_,i)=>{ if(get(`${id}:l:${i}`)) c.licoes++; });
  c.total = m.C.length+m.F.length+m.V.length+m.Q.length+m.P.length;
  c.done = c.caderno+c.flash+c.vf+c.quiz+c.pbl;
  return c;
}
const totals = () => MODS.reduce((a,m)=>{const c=modCounts(m); a.d+=c.done; a.t+=c.total; return a;},{d:0,t:0});
const pct = (a,b) => b? Math.round(a*100/b):0;

function route(){
  const h = location.hash.slice(1) || 'inicio';
  const m = h.match(/^m(\d+)(?:-(\w+))?$/);
  if(m){ const mod = MODS.find(x=>x.id==+m[1]); if(mod) return {v:'mod', mod, tab: TABS.some(t=>t[0]===m[2])? m[2] : 'licoes'}; }
  if(h==='atalhos') return {v:'atalhos'};
  return {v:'inicio'};
}
const go = h => { if(location.hash === '#'+h) render(); else location.hash = h; };
addEventListener('hashchange', ()=>{ render(); window.scrollTo(0,0); closeMenu(); });

function setAccent(app){
  const r = document.documentElement.style;
  r.setProperty('--accent', `var(--${app})`); r.setProperty('--accent-soft', `var(--${app}-soft)`);
}

function nav(r){
  let h = `<a href="#inicio" class="${r.v==='inicio'?'on':''}"><span class="num bg-all">◎</span><span class="t">Painel da disciplina</span></a>
  <a href="#atalhos" class="${r.v==='atalhos'?'on':''}"><span class="num bg-all">⌘</span><span class="t">Guia de atalhos</span></a>`;
  const t = totals();
  h += `<div class="lab"><span>Módulos</span><span>${t.d}/${t.t}</span></div>`;
  MODS.forEach(m=>{ const c = modCounts(m);
    h += `<a href="#m${m.id}" class="${r.mod&&r.mod.id===m.id?'on':''}"><span class="num bg-${APP[m.app].c}">${m.id}</span><span class="t">${esc(m.title)}</span><span class="pc">${pct(c.done,c.total)}%</span></a>`; });
  $('#nav').innerHTML = h;
}
function refreshProgress(){
  const t = totals(); $('#topBar').style.width = pct(t.d,t.t)+'%'; $('#topPct').textContent = `${t.d}/${t.t}`;
  const r = route(); nav(r);
  if(r.v==='mod') updateTabCounts(r.mod);
}
