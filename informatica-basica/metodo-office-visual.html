  return `
  <section class="mhead">
    <div class="row"><span class="chip">${a.n} · ${LEVEL[m.id]}</span><span class="eyebrow">Módulo ${String(m.id).padStart(2,'0')} · lições ${m.pages}</span></div>
    <h1>${esc(m.title)}</h1>
    <p class="lead">${esc(m.sub)}</p>
    <div class="bar" style="max-width:520px"><i id="modPct"></i></div><div class="hint" id="modTxt"></div>
  </section>
  ${S.teacher?'<div class="teacher-flag">Modo professor ativo: todas as respostas estão visíveis e nada conta no progresso.</div>':''}
  <nav class="tabs" role="tablist">${TABS.map(([k,l])=>`<button class="tab ${k===tab?'on':''}" data-t="${k}" role="tab" aria-selected="${k===tab}" onclick="go('m${m.id}-${k}')">${l} <span class="n"></span></button>`).join('')}</nav>
  ${body}
  <div class="row" style="justify-content:space-between">
    ${navBtn(m,tab,-1)}${navBtn(m,tab,1)}
  </div>`;
}
function navBtn(m,tab,d){
  const i = TABS.findIndex(t=>t[0]===tab)+d;
  if(i<0){ return m.id>1? `<a class="btn" href="#m${m.id-1}-pbl">← Módulo ${m.id-1}</a>`:'<span></span>'; }
  if(i>=TABS.length){ return m.id<10? `<a class="btn pri" href="#m${m.id+1}">Módulo ${m.id+1} →</a>`:`<a class="btn pri" href="#inicio">Voltar ao painel</a>`; }
  return `<a class="btn ${d>0?'pri':''}" href="#m${m.id}-${TABS[i][0]}">${d<0?'← ':''}${TABS[i][1]}${d>0?' →':''}</a>`;
}

/* Lições */
function tLicoes(m){
  const start = parseInt(m.pages);
  return `<div class="sec-intro"><p>Resumo das 10 lições do PDF. Leia, faça o “Pratique” no computador e marque como estudada.</p></div>
  <div class="lessons">${m.L.map((l,i)=>{ const on=!!get(`${m.id}:l:${i}`);
    return `<article class="card lesson"><div class="pg"><span>Lição ${String(start+i).padStart(2,'0')}</span><button class="read" aria-pressed="${on}" onclick="toggleRead(${m.id},${i},this)">${on?'✓ estudada':'marcar estudada'}</button></div>
    <h3>${esc(l[0])}</h3><p>${fmt(l[1])}</p>
    <div class="box tip"><b>Dica</b><span>${fmt(l[2])}</span></div>
    <div class="box do"><b>Pratique</b><span>${fmt(l[3])}</span></div></article>`;}).join('')}</div>`;
}
function toggleRead(id,i,b){ const on=!get(`${id}:l:${i}`); put(`${id}:l:${i}`, on||undefined); b.setAttribute('aria-pressed',on); b.textContent = on?'✓ estudada':'marcar estudada'; }
/* realça atalhos e fórmulas */
function fmt(s){
  let t = esc(s);
  t = t.replace(/\b((?:Ctrl|Shift|Alt)(?:\+(?:Shift|Alt|Enter|Espaço|Setas|[A-Z]|F\d+|=))+)/g, m=>m.split('+').map(k=>`<kbd>${k}</kbd>`).join('+'));
  t = t.replace(/(^|[\s(:])(=[^\s,]+(?:\([^)]*\))?)/g, (m,p,f)=>`${p}<span class="code">${f}</span>`);
  return t;
}

/* Caderno */
function tCaderno(m){
  return `<div class="sec-intro"><p>Responda no seu caderno. Marque que respondeu para liberar a resposta modelo e compare com o que você escreveu.</p></div>
  <div class="list">${m.C.map((c,i)=>{ const k=`${m.id}:c:${i}`, seen=!!get(k)||S.teacher;
    return `<article class="card item"><div class="meta"><span>Atividade ${i+1} de ${m.C.length}</span><span>✎ caderno</span></div>
    <div class="q">${fmt(c[0])}</div>
    ${seen?`<div class="ans ok"><h4>Resposta modelo</h4><div>${fmt(c[1])}</div></div>`:
    `<div class="row"><label class="check"><input type="checkbox" id="cb${m.id}_${i}" onchange="document.getElementById('cbtn${m.id}_${i}').disabled=!this.checked"> Já respondi no meu caderno</label>
    <button class="btn sm pri" id="cbtn${m.id}_${i}" disabled onclick="put('${k}',1);render()">Ver resposta modelo</button></div>`}
    </article>`;}).join('')}</div>`;
}

/* Flashcards */
let fcShow = false;
function tFlash(m){
  const order = S.fc[m.id] && S.fc[m.id].length===m.F.length ? S.fc[m.id] : m.F.map((_,i)=>i);
  const pos = Math.min(S['fcpos'+m.id]||0, m.F.length-1);
  const idx = order[pos], f = m.F[idx], st = get(`${m.id}:f:${idx}`);
  const show = fcShow || S.teacher;
  return `<div class="sec-intro"><p>Tente lembrar a resposta antes de virar o cartão. Depois diga se acertou ou se precisa revisar.</p>
  <div class="row"><button class="btn sm" onclick="shuffleFc(${m.id})">Embaralhar</button><button class="btn sm" onclick="onlyRev(${m.id})">Só os de revisar</button></div></div>
  <div class="deck">
    <div class="hint">Cartão ${pos+1} de ${m.F.length}${st?` · marcado como <b>${st==='ok'?'acertei':'revisar'}</b>`:''}</div>
    <button class="flip ${show?'show':''}" onclick="flipCard(this)" aria-label="Virar cartão">
      <div class="in"><div class="face f"><small>Pergunta · clique para virar</small><p>${esc(f[0])}</p></div><div class="face b"><small>Resposta</small><p>${esc(f[1])}</p></div></div>
    </button>
    <div class="row" style="justify-content:center" id="fcCtl">${fcControls(m.id,idx)}</div>
    <div class="dots">${order.map((o,p)=>{const s=get(`${m.id}:f:${o}`); return `<button class="${p===pos?'cur':''} ${s?'k-'+s:''}" onclick="S['fcpos${m.id}']=${p};fcShow=false;save();render()">${p+1}</button>`;}).join('')}</div>
  </div>`;
}
let curFc={};
function fcControls(id,idx){ curFc={id,idx}; const show=fcShow||S.teacher;
  return `<button class="btn" onclick="fcMove(${id},-1)">←</button>`+(show&&!S.teacher?`<button class="btn" onclick="fcRate(${id},${idx},'rev')">↻ Preciso revisar</button><button class="btn pri" onclick="fcRate(${id},${idx},'ok')">✓ Acertei</button>`:`<button class="btn pri" onclick="flipCard(document.querySelector('.flip'))">Virar cartão</button>`)+`<button class="btn" onclick="fcMove(${id},1)">→</button>`; }
function flipCard(el){ fcShow=!fcShow; el.classList.toggle('show',fcShow||S.teacher); document.getElementById('fcCtl').innerHTML=fcControls(curFc.id,curFc.idx); }
function fcMove(id,d){ const n=MODS[id-1].F.length; S['fcpos'+id]=((S['fcpos'+id]||0)+d+n)%n; fcShow=false; save(); render(); }
function fcRate(id,idx,v){ put(`${id}:f:${idx}`,v); fcMove(id,1); }
function shuffleFc(id){ const a=MODS[id-1].F.map((_,i)=>i); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} S.fc[id]=a; S['fcpos'+id]=0; fcShow=false; save(); render(); }
function onlyRev(id){ const m=MODS[id-1]; const r=m.F.map((_,i)=>i).filter(i=>get(`${id}:f:${i}`)!=='ok'); if(!r.length){ alertMsg('Você marcou todos como acertados. Ótimo!'); return; } const rest=m.F.map((_,i)=>i).filter(i=>!r.includes(i)); S.fc[id]=r.concat(rest); S['fcpos'+id]=0; fcShow=false; save(); render(); }
function alertMsg(t){ const d=$('.deck .hint'); if(d) d.textContent=t; }

/* Verdadeiro ou Falso */
function tVF(m){
  return `<div class="sec-intro"><p>Escolha V ou F e escreva sua justificativa (pelo menos uma frase). Só então confira o gabarito. Copie as afirmações falsas corrigidas no caderno.</p>
  <button class="btn sm" onclick="resetPart(${m.id},'v')">Refazer V ou F</button></div>
  <div class="list">${m.V.map((v,i)=>{ const k=`${m.id}:v:${i}`, st=get(k)||{}, done=st.done||S.teacher;
    const right = st.pick===(v[1]?'V':'F');
    return `<article class="card item"><div class="meta"><span>Afirmação ${i+1} de ${m.V.length}</span></div>
    <div class="q">${fmt(v[0])}</div>
    ${done?`${S.teacher?'':`<div class="hint">Sua resposta: <b>${st.pick}</b> — “${esc(st.why||'')}”</div>`}
      <div class="ans ${S.teacher||right?'ok':'bad'}"><h4>${S.teacher?'':right?'Você acertou! ':'Não foi dessa vez. '}Gabarito: ${v[1]?'VERDADEIRO':'FALSO'}</h4><div>${fmt(v[2])}</div></div>`:
    `<div class="vf"><button aria-pressed="${st.pick==='V'}" onclick="vfPick('${k}','V')">V</button><button aria-pressed="${st.pick==='F'}" onclick="vfPick('${k}','F')">F</button></div>
     <textarea id="vt${m.id}_${i}" placeholder="Justifique: por que é verdadeira ou falsa?" oninput="vfWhy('${k}',this.value,${m.id},${i})">${esc(st.why||'')}</textarea>
     <div class="row"><button class="btn sm pri" id="vb${m.id}_${i}" ${st.pick&&(st.why||'').trim().length>=12?'':'disabled'} onclick="vfCheck('${k}',${m.id},${i})">Conferir</button><span class="hint">Escolha V ou F e escreva a justificativa para liberar.</span></div>`}
    </article>`;}).join('')}</div>`;
}
function vfPick(k,p){ const s=Object.assign({},get(k)||{}); s.pick=p; S.p[k]=s; save(); render(); }
function vfWhy(k,t,id,i){ const s=Object.assign({},get(k)||{}); s.why=t; S.p[k]=s; save(); const b=document.getElementById(`vb${id}_${i}`); if(b) b.disabled=!(s.pick&&t.trim().length>=12); }
function vfCheck(k,id,i){ const s=Object.assign({},get(k)); s.done=true; s.ok = s.pick===(MODS[id-1].V[i][1]?'V':'F'); put(k,s); render(); }

/* Quiz */
function tQuiz(m){
  const c = modCounts(m);
  return `<div class="sec-intro"><p>Clique em uma alternativa: a correção e a explicação aparecem na hora.</p>
  <div class="row"><span class="chip">Acertos ${c.okq}/${m.Q.length}</span><button class="btn sm" onclick="resetPart(${m.id},'q')">Refazer quiz</button></div></div>
  <div class="list">${m.Q.map((q,i)=>{ const k=`${m.id}:q:${i}`, p=get(k), done=p!=null||S.teacher;
    return `<article class="card item"><div class="meta"><span>Questão ${i+1} de ${m.Q.length}</span></div>
    <div class="q">${fmt(q[0])}</div>
    <div class="opts">${perm(m.id*100+i,q[1].length).map((j,pos)=>{ let cl=''; if(done){ if(j===q[2]) cl='right'; else if(j===p) cl='wrong'; }
      return `<button class="opt ${cl}" ${done?'disabled':''} onclick="put('${k}',${j});render()"><b>${L5[pos]}</b><span>${fmt(q[1][j])}</span></button>`;}).join('')}</div>
    ${done?(()=>{const L=L5[perm(m.id*100+i,q[1].length).indexOf(q[2])]; return `<div class="ans ${S.teacher||p===q[2]?'ok':'bad'}"><h4>${S.teacher?'Resposta: '+L:p===q[2]?'Correto — '+L:'Resposta correta: '+L}</h4><div>${fmt(q[3])}</div></div>`;})():''}
    </article>`;}).join('')}</div>`;
}
function perm(seed,n){ let x=seed*9301+49297; const a=[...Array(n).keys()]; for(let i=n-1;i>0;i--){ x=(x*9301+49297)%233280; const j=Math.floor(x/233280*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function resetPart(id,t){ Object.keys(S.p).forEach(k=>{ if(k.startsWith(`${id}:${t}:`)) delete S.p[k]; }); save(); refreshProgress(); render(); }

/* PBL */
function tPBL(m){
  return `<div class="sec-intro"><p>Aprendizagem Baseada em Problemas: leia o cenário, discuta as perguntas norteadoras com a equipe, cumpra as tarefas e, ao final, faça a autoavaliação pela rubrica.</p></div>
  <div class="list">${m.P.map((p,i)=>{ const k=`${m.id}:p:${i}`, st=get(k)||{t:[],r:[]}; const tdone=(st.t||[]).filter(Boolean).length; const allT = tdone===p.tarefas.length;
    const pts = p.rub.map(r=>+((r.match(/\((\d+)\s*pts?\)/)||[])[1]||0)); const got=(st.r||[]).reduce((a,v,j)=>a+(v?pts[j]:0),0); const max=pts.reduce((a,b)=>a+b,0);
    return `<article class="card pbl"><div class="meta"><span>Problema ${i+1} de ${m.P.length}</span><span>PBL</span></div>
    <h3>${esc(p.t)}</h3><p>${fmt(p.cen)}</p>
    <div class="cols"><div><h4>Perguntas norteadoras</h4><ul>${p.perg.map(x=>`<li>${fmt(x)}</li>`).join('')}</ul></div>
    <div><h4>Tarefas (${tdone}/${p.tarefas.length})</h4><div class="tasks">${p.tarefas.map((x,j)=>`<label class="check"><input type="checkbox" ${(st.t||[])[j]||S.teacher?'checked':''} onchange="pblT('${k}',${j},this.checked)"> ${fmt(x)}</label>`).join('')}</div></div></div>
    <div class="box do"><b>Entrega</b><span>${fmt(p.entrega)}</span></div>
    ${allT||S.teacher?`<div><h4 style="margin-bottom:8px">Autoavaliação pela rubrica</h4><div class="tasks">${p.rub.map((x,j)=>`<label class="check"><input type="checkbox" ${(st.r||[])[j]?'checked':''} onchange="pblR('${k}',${j},this.checked)"> ${fmt(x)}</label>`).join('')}</div></div>
      <div class="row"><span class="score">${got}/${max} pts</span>${st.done?'<span class="chip">✓ PBL concluído</span>':`<button class="btn pri sm" onclick="pblDone('${k}')">Concluir PBL</button>`}</div>`
    :`<div class="hint">Marque todas as tarefas para liberar a rubrica de autoavaliação.</div>`}
    </article>`;}).join('')}</div>`;
}
function pblT(k,j,v){ const s=JSON.parse(JSON.stringify(get(k)||{t:[],r:[]})); s.t=s.t||[]; s.t[j]=v; S.p[k]=s; save(); render(); }
function pblR(k,j,v){ const s=JSON.parse(JSON.stringify(get(k)||{t:[],r:[]})); s.r=s.r||[]; s.r[j]=v; S.p[k]=s; save(); render(); }
function pblDone(k){ const s=JSON.parse(JSON.stringify(get(k))); s.done=true; put(k,s); render(); }

/* ---------- ATALHOS ---------- */
const KEYS = [
 ['word','Negrito','Ctrl+N'],['word','Itálico','Ctrl+I'],['word','Sublinhado','Ctrl+S'],['word','Salvar','Ctrl+B'],['word','Imprimir','Ctrl+P'],['word','Localizar','Ctrl+L'],['word','Substituir','Ctrl+U'],['word','Selecionar tudo','Ctrl+T'],['word','Quebra de página','Ctrl+Enter'],['word','Verificar ortografia','F7'],['word','Alternar maiúsculas','Shift+F3'],
 ['all','Copiar','Ctrl+C'],['all','Recortar','Ctrl+X'],['all','Colar','Ctrl+V'],['all','Desfazer','Ctrl+Z'],['all','Refazer','Ctrl+Y'],
 ['excel','Formatar células','Ctrl+1'],['excel','Editar célula','F2'],['excel','Fixar referência ($)','F4'],['excel','AutoSoma','Alt+='],['excel','Ir ao limite dos dados','Ctrl+Setas'],['excel','Selecionar até o limite','Ctrl+Shift+Setas'],['excel','Selecionar coluna','Ctrl+Espaço'],['excel','Selecionar linha','Shift+Espaço'],['excel','Próxima célula à direita','Tab'],['excel','Célula abaixo','Enter'],
 ['ppt','Novo slide','Ctrl+M'],['ppt','Duplicar','Ctrl+D'],['ppt','Agrupar','Ctrl+G'],['ppt','Desagrupar','Ctrl+Shift+G'],['ppt','Inserir link','Ctrl+K'],['ppt','Apresentar do início','F5'],['ppt','Apresentar do slide atual','Shift+F5'],['ppt','Encerrar apresentação','Esc'],['ppt','Tela preta','B'],['ppt','Tela branca','W']];
let kf = 'todos';
function viewKeys(){
  setAccent('all');
  const list = KEYS.filter(k=>kf==='todos'||k[0]===kf||k[0]==='all');
  return `<section class="mhead"><span class="eyebrow">Referência rápida</span><h1>Guia de atalhos</h1><p class="lead">Atalhos do Office em português usados nas lições. Alguns podem variar conforme a versão e o idioma instalado.</p></section>
  <div class="filters">${[['todos','Todos'],['word','Word'],['excel','Excel'],['ppt','PowerPoint']].map(([k,l])=>`<button aria-pressed="${kf===k}" onclick="kf='${k}';render()">${l}</button>`).join('')}</div>
  <div class="kgrid">${list.map(k=>`<div class="card kitem"><span><span class="num bg-${APP[k[0]].c}" style="display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:8px"></span>${k[1]}</span><span>${k[2].split('+').map(x=>`<kbd>${x}</kbd>`).join('+')}</span></div>`).join('')}</div>
  <div class="card item"><div class="q">Desafio do teclado</div><p>Escolha uma tarefa (formatar um parágrafo, montar uma tabela ou duplicar slides) e realize-a sem clicar na Faixa de Opções. Anote no caderno quais atalhos usou.</p></div>`;
}

/* ---------- render ---------- */
function render(){
  const r = route();
  $('#tMode').setAttribute('aria-pressed', S.teacher);
  let h, crumb;
  if(r.v==='mod'){ h = viewMod(r.mod, r.tab); crumb = `módulo ${r.mod.id} / <b>${esc(r.mod.title)}</b> / ${TABS.find(t=>t[0]===r.tab)[1]}`; }
  else if(r.v==='atalhos'){ h = viewKeys(); crumb = `disciplina / <b>Guia de atalhos</b>`; }
  else { h = viewHome(); crumb = `disciplina / <b>Painel</b>`; }
  const y = window.scrollY;
  $('#view').innerHTML = h; $('#crumb').innerHTML = crumb;
  refreshProgress();
  window.scrollTo(0,y);
}
applyTheme(); render();

</script>
