<script>
const COURSE = {"id": "redes-comp-v1", "eyebrow": "Curso técnico · Informática", "titulo": "Redes de Computadores", "autor": "Prof. Eber Santana", "curso": "Técnico de Nível Médio em Informática", "apresentacao": "Da ARPANET ao cabo crimpado: seis módulos que seguem as camadas do modelo TCP/IP, de cima para baixo, acompanhando a viagem de **Paco**, um pacote de dados que sai de Coari rumo a Manaus.", "referencias": ["KUROSE, J. F.; ROSS, K. W. *Redes de Computadores e a Internet: uma abordagem top-down*. 8. ed. Pearson, 2021.", "TANENBAUM, A. S.; FEAMSTER, N.; WETHERALL, D. J. *Redes de Computadores*. 6. ed. Pearson, 2021.", "FOROUZAN, B. A. *Comunicação de Dados e Redes de Computadores*. 5. ed. AMGH, 2013.", "COMER, D. E. *Redes de Computadores e Internet*. 6. ed. Bookman, 2016.", "SANTANA, E. *A Incrível Jornada de um Pacote de Dados* (material complementar)."], "modulos": [{"id": "m1", "titulo": "Introdução às Redes", "subtitulo": "Unidade I · história, borda, núcleo e camadas", "objetivo": "Compreender a evolução das redes e da internet, distinguir borda e núcleo, explicar a comutação de pacotes e identificar as camadas dos modelos OSI e TCP/IP.", "resumo": [["ARPANET (1969)", "Rede descentralizada criada pela DARPA para resistir a falhas. Começou com 4 nós: UCLA, Stanford, UC Santa Barbara e Utah."], ["TCP/IP", "Protocolos de Vint Cerf e Bob Kahn (1974). Em 1983 a ARPANET adota o TCP/IP: muitos consideram esse o nascimento da internet."], ["Web (1989)", "Tim Berners-Lee, no CERN, cria a WWW: hiperlinks, HTTP e navegadores. No Brasil, a internet comercial chega em 1995; antes, o acesso era pela RNP."], ["Borda e núcleo", "Borda: hosts (computadores, celulares, servidores) onde rodam as aplicações. Núcleo: malha de roteadores e switches que só transporta os dados."], ["Comutação de pacotes", "O arquivo é dividido em pacotes com endereço. Cada pacote pode seguir rota diferente e é remontado no destino. Compartilha a rede e resiste a falhas."], ["Modelos em camadas", "OSI (ISO) tem 7 camadas e é referência teórica. O TCP/IP é o modelo prático da internet, com 4 ou 5 camadas: Aplicação, Transporte, Rede, Enlace e Física."]], "historia": "Ana, estudante em Coari, envia uma mensagem para Beto, em Manaus. No computador dela nasce **Paco**, um pacote de dados. Ele mora num edifício de 5 andares, o modelo TCP/IP, e precisa descer todos eles antes de viajar: Aplicação, Transporte, Rede, Enlace e Física.", "historiaTitulo": "A jornada de Paco", "caderno": [{"q": "Por que a DARPA quis criar uma rede **descentralizada** nos anos 1960?", "a": "Durante a Guerra Fria havia o medo de que um ataque destruísse os meios de comunicação centralizados. Numa rede descentralizada a informação pode achar outros caminhos até o destino mesmo que parte da rede seja destruída.", "t": "Discursiva"}, {"q": "Quais foram as quatro instituições conectadas na primeira ARPANET, em 1969?", "a": "UCLA, Stanford, UC Santa Barbara e Universidade de Utah.", "t": "Discursiva"}, {"q": "Qual foi a importância do TCP/IP para o surgimento da internet?", "a": "Criado por Vint Cerf e Bob Kahn (publicado em 1974), o TCP/IP padronizou a forma como os computadores conversam, permitindo interligar redes diferentes. Quando a ARPANET o adotou oficialmente, em 1983, nasceu a internet como a conhecemos.", "t": "Discursiva"}, {"q": "Quem criou a World Wide Web, onde e em que ano? Quais três elementos ela trouxe?", "a": "Tim Berners-Lee, no CERN, em 1989. Trouxe as páginas com hiperlinks, o protocolo HTTP e os navegadores.", "t": "Discursiva"}, {"q": "Como era o acesso à internet no Brasil antes de 1995 e o que mudou nesse ano?", "a": "O acesso era restrito a universidades e centros de pesquisa, ligados pela Rede Nacional de Pesquisa (RNP). Em 1995 o governo autorizou a exploração comercial e a internet chegou às pessoas e empresas.", "t": "Discursiva"}, {"q": "Monte uma linha do tempo com 6 marcos da história das redes, de 1969 a 2007.", "a": "1969 ARPANET com 4 nós; 1972 primeira demonstração pública; 1974 publicação do TCP/IP; 1983 ARPANET adota TCP/IP; 1989 proposta da WWW; 1991 Web pública; 1995 internet comercial no Brasil; 2007 iPhone e era da internet móvel.", "t": "Linha do tempo"}, {"q": "Diferencie **borda** e **núcleo** da rede e dê três exemplos de dispositivos em cada parte.", "a": "Borda: dispositivos nas pontas, chamados hosts ou sistemas finais, onde rodam as aplicações. Ex.: notebook, smartphone, servidor web, câmera IP. Núcleo: infraestrutura que interliga a borda e encaminha os dados sem se preocupar com o conteúdo. Ex.: roteadores, switches, enlaces de backbone.", "t": "Discursiva"}, {"q": "Explique a analogia das rodovias usada para borda e núcleo.", "a": "A borda são as casas, lojas e escritórios das cidades, onde as pessoas vivem. O núcleo são as estradas e cruzamentos que ligam as cidades. Os roteadores são os trevos que direcionam o tráfego para o caminho certo.", "t": "Discursiva"}, {"q": "Descreva como um arquivo viaja usando comutação de pacotes.", "a": "O arquivo é quebrado em pacotes; cada um leva parte dos dados e os endereços de origem e destino. Os pacotes viajam de forma independente, podem seguir rotas diferentes e chegar fora de ordem. No destino são reorganizados para montar o arquivo original.", "t": "Discursiva"}, {"q": "Compare comutação de pacotes e comutação de circuitos. Cite uma vantagem de cada.", "a": "Na comutação de circuitos (telefonia tradicional) um caminho é reservado durante toda a comunicação: vantagem, recursos garantidos. Na de pacotes, os dados são divididos e compartilham os enlaces: vantagem, muitos usuários ao mesmo tempo e resiliência, pois os pacotes contornam falhas.", "t": "Comparação"}, {"q": "Por que as redes são organizadas em **camadas**?", "a": "Para dividir a complexidade da comunicação: cada camada tem uma função específica e presta serviço à camada de cima. Assim é possível mudar a tecnologia de uma camada sem refazer as outras.", "t": "Discursiva"}, {"q": "Liste as 7 camadas do modelo OSI e diga a função de cada uma.", "a": "7 Aplicação: interface com o usuário (HTTP, SMTP, DNS). 6 Apresentação: formatação, criptografia e compressão. 5 Sessão: controle do diálogo entre hosts. 4 Transporte: entrega fim a fim (TCP/UDP). 3 Rede: endereço lógico e roteamento (IP). 2 Enlace: endereço físico (MAC) e acesso ao meio. 1 Física: transmissão de bits no meio.", "t": "Tabela"}, {"q": "Onde ficam as funções das camadas de Sessão e Apresentação no modelo TCP/IP?", "a": "Elas não existem como camadas separadas: suas funções ficam incluídas na camada de Aplicação do TCP/IP.", "t": "Discursiva"}, {"q": "Associe cada etapa do envio de uma encomenda pelo correio a uma camada.", "a": "Embalar o produto: Aplicação. Colocar na caixa com número de rastreio: Transporte. Centro de triagem que escolhe a rota: Rede. Carteiro que leva até o endereço: Enlace. Estrada ou avião por onde a encomenda viaja: Física.", "t": "Analogia"}], "flash": [{"f": "ARPANET", "b": "Rede precursora da internet, criada em 1969 pela DARPA, com 4 nós iniciais."}, {"f": "DARPA", "b": "Defense Advanced Research Projects Agency, agência do Departamento de Defesa dos EUA que financiou a ARPANET."}, {"f": "Vint Cerf e Bob Kahn", "b": "Criadores dos protocolos TCP/IP, publicados em 1974."}, {"f": "Tim Berners-Lee", "b": "Criou a World Wide Web em 1989, no CERN."}, {"f": "RNP", "b": "Rede Nacional de Pesquisa. Ligava universidades e centros de pesquisa brasileiros antes da internet comercial (1995)."}, {"f": "Host ou sistema final", "b": "Qualquer dispositivo na borda da rede: computador, smartphone, servidor, câmera."}, {"f": "Núcleo da rede", "b": "Malha de roteadores e switches que encaminha os dados da origem ao destino."}, {"f": "Pacote", "b": "Pedaço de dados com informações de endereço de origem e destino."}, {"f": "Comutação de circuitos", "b": "Reserva um caminho exclusivo durante toda a comunicação, como na telefonia tradicional."}, {"f": "Modelo OSI", "b": "Modelo de referência da ISO com 7 camadas, usado para estudar os conceitos."}, {"f": "Modelo TCP/IP", "b": "Modelo prático usado na internet, com 4 ou 5 camadas."}, {"f": "Camada Física", "b": "Transmite os bits brutos pelo meio: cabo, fibra ou ondas de rádio."}], "vf": [{"s": "A ARPANET foi criada para ser uma rede centralizada, com um único computador controlando toda a comunicação.", "v": false, "j": "Falso. Ela foi pensada para ser **descentralizada**, para que a informação encontrasse caminhos alternativos mesmo se parte da rede fosse destruída."}, {"s": "A ARPANET adotou oficialmente o TCP/IP em 1983.", "v": true, "j": "Verdadeiro. Esse marco é considerado por muitos o nascimento da internet."}, {"s": "A World Wide Web e a internet são a mesma coisa.", "v": false, "j": "Falso. A internet é a infraestrutura de redes interligadas (existe desde a ARPANET). A Web, de 1989, é um serviço que roda sobre a internet, com páginas, hiperlinks e HTTP."}, {"s": "A internet comercial chegou ao Brasil em 1995.", "v": true, "j": "Verdadeiro. Antes disso o acesso era restrito a universidades e centros de pesquisa pela RNP."}, {"s": "Os roteadores fazem parte da borda da rede.", "v": false, "j": "Falso. Roteadores e switches formam o **núcleo**. A borda é formada pelos hosts, como computadores, smartphones e servidores."}, {"s": "Um servidor web é um host da borda da rede.", "v": true, "j": "Verdadeiro. Servidores também são sistemas finais: ficam nas pontas e fornecem serviços."}, {"s": "Na comutação de pacotes, todos os pacotes de um arquivo precisam seguir exatamente o mesmo caminho.", "v": false, "j": "Falso. Cada pacote viaja de forma independente, pode seguir rotas diferentes e chegar fora de ordem. O destino reorganiza os pacotes."}, {"s": "A comutação de pacotes é mais resiliente a falhas porque os pacotes podem contornar um caminho que caiu.", "v": true, "j": "Verdadeiro. Se um enlace falha, os pacotes seguintes encontram outra rota."}, {"s": "O modelo OSI tem 7 camadas e o TCP/IP tem 4 ou 5 camadas.", "v": true, "j": "Verdadeiro. O OSI é a referência teórica; o TCP/IP é o modelo usado na internet real."}, {"s": "A camada de Rede é responsável pelo endereçamento físico (MAC).", "v": false, "j": "Falso. O endereço MAC é da camada de **Enlace**. A camada de Rede cuida do endereço lógico (IP) e do roteamento."}, {"s": "A criptografia e a compressão de dados são funções da camada de Apresentação no modelo OSI.", "v": true, "j": "Verdadeiro. No TCP/IP essas funções ficam dentro da camada de Aplicação."}, {"s": "TCP e UDP são protocolos da camada de Rede.", "v": false, "j": "Falso. TCP e UDP são protocolos da camada de **Transporte**. O protocolo principal da camada de Rede é o IP."}], "pbl": [{"titulo": "Museu digital da internet", "duracao": "2 aulas", "cenario": "A coordenação do campus vai montar uma exposição na semana de tecnologia e pediu à turma um painel que conte a história das redes para alunos que nunca estudaram o assunto. O painel precisa ligar a história mundial à chegada da internet no Brasil e na nossa região.", "problema": "Como explicar, em um único painel, de onde veio a internet e por que ela funciona com pacotes e camadas?", "perguntas": ["Quais marcos entre 1969 e 2007 não podem faltar?", "Por que o medo de um ataque nuclear levou a uma rede descentralizada?", "Como a comutação de pacotes se relaciona com essa ideia de descentralização?", "Quando e como a internet chegou à sua cidade ou ao seu campus?"], "entregaveis": ["Linha do tempo ilustrada com pelo menos 8 marcos", "Um esquema da borda e do núcleo com dispositivos reais do campus", "Uma analogia criada pela equipe para explicar a comutação de pacotes", "Roteiro de 3 minutos para apresentar o painel"], "solucao": ["Linha do tempo: 1969 ARPANET, 1972 demonstração pública, 1974 TCP/IP, 1983 adoção do TCP/IP, 1989 WWW, 1991 Web pública, 1995 internet comercial no Brasil, 2007 internet móvel; mais um marco local pesquisado pela equipe.", "Ligação central: a rede foi feita descentralizada para sobreviver a falhas; a comutação de pacotes é o que torna isso possível, porque cada pacote pode seguir outra rota.", "Esquema: na borda, computadores do laboratório, celulares, servidor do sistema acadêmico; no núcleo, switch do laboratório, roteador do campus, enlace do provedor.", "Analogia de exemplo: o quebra-cabeça enviado peça por peça em envelopes pelo correio, cada um por um caminho."]}, {"titulo": "O edifício de Paco", "duracao": "1 a 2 aulas", "cenario": "Paco, o pacote de dados de Ana, precisa descer os 5 andares do edifício TCP/IP antes de viajar de Coari a Manaus. Os alunos do 1º ano confundem o que acontece em cada andar e misturam OSI com TCP/IP.", "problema": "Como criar um material que mostre, andar por andar, o que acontece com a mensagem e compare os dois modelos de camadas?", "perguntas": ["O que Paco recebe em cada andar (segmento, datagrama, quadro, bits)?", "Qual camada do OSI corresponde a cada andar do TCP/IP?", "Onde foram parar as camadas de Sessão e Apresentação?", "O que acontece quando Paco chega ao destino: ele desce ou sobe os andares?"], "entregaveis": ["Tabela comparativa OSI × TCP/IP com funções", "Desenho do edifício com a “roupa” que Paco veste em cada andar", "Uma encenação curta (2 minutos) com um aluno para cada camada"], "solucao": ["Aplicação: a mensagem é criada pelo programa. Transporte: vira **segmento** com portas de origem e destino. Rede: vira **datagrama** com IPs. Enlace: vira **quadro** com MACs e CRC. Física: vira sinais elétricos, de luz ou de rádio.", "Correspondência: Aplicação do TCP/IP = Aplicação, Apresentação e Sessão do OSI; as demais são iguais (Transporte, Rede, Enlace, Física).", "No destino o caminho é o inverso: Paco **sobe** os andares e em cada um retira uma camada de cabeçalho (desencapsulamento)."]}], "lab": ["timeline", "layers"]}, {"id": "m2", "titulo": "Camada de Aplicação", "subtitulo": "Unidade II · HTTP, FTP, e-mail e DNS", "objetivo": "Compreender os princípios da camada de aplicação, explicar HTTP, FTP, SMTP e DNS e reconhecer onde esses protocolos aparecem no dia a dia.", "resumo": [["Cliente-servidor", "Um servidor sempre ligado, com IP fixo e conhecido, atende requisições de clientes. É o modelo da Web, do e-mail e dos bancos de dados."], ["P2P", "Não há servidor central: cada computador é cliente e servidor ao mesmo tempo. Ex.: BitTorrent e chamadas de vídeo."], ["HTTP", "Protocolo da Web. Métodos GET, POST, PUT, DELETE. Códigos 200 OK, 301 Moved, 404 Not Found, 500 Internal Server Error."], ["FTP", "Transfere arquivos com duas conexões TCP: controle (porta 21) e dados (porta 20). Hoje é substituído por SFTP e FTPS, que criptografam."], ["E-mail", "SMTP envia (cliente → servidor → servidor). POP3 baixa as mensagens e costuma apagá-las do servidor; IMAP gerencia no servidor, bom para vários dispositivos."], ["DNS", "Traduz nomes em IPs. É distribuído e hierárquico: servidor local → raiz → domínio de topo (.br, .com) → autoritativo. Usa cache."]], "historia": "No 5º andar, a Camada de Aplicação, o programa de mensagens de Ana cria Paco. Antes de qualquer envio, o computador precisa descobrir **onde** fica o destino: é o DNS, a lista de contatos da internet, que transforma um nome em um endereço IP.", "historiaTitulo": "A jornada de Paco", "caderno": [{"q": "Diferencie a arquitetura cliente-servidor da arquitetura P2P e dê um exemplo de cada.", "a": "Cliente-servidor: um servidor sempre ligado, com IP fixo e conhecido, espera requisições de clientes (ex.: acessar o Google, e-mail). P2P: não há servidor central, os computadores se comunicam diretamente e cada um é cliente e servidor (ex.: BitTorrent, chamadas de vídeo).", "t": "Comparação"}, {"q": "Descreva os três passos que acontecem quando você acessa uma página web.", "a": "1) O navegador (cliente) envia uma requisição HTTP ao servidor web. 2) O servidor processa e responde com o conteúdo (HTML, imagens, CSS, JavaScript). 3) O navegador renderiza o conteúdo e exibe a página.", "t": "Discursiva"}, {"q": "Para que serve cada método HTTP: GET, POST, PUT e DELETE?", "a": "GET solicita um recurso (carregar página). POST envia dados (formulário). PUT atualiza um recurso existente. DELETE remove um recurso.", "t": "Tabela"}, {"q": "O que significam os códigos 200, 301, 404 e 500?", "a": "200 OK: sucesso. 301 Moved: o recurso mudou de endereço permanentemente. 404 Not Found: o recurso não existe no servidor. 500 Internal Server Error: erro interno no servidor.", "t": "Discursiva"}, {"q": "Explique a analogia do garçom para o HTTP, incluindo o erro 404.", "a": "Você (cliente) faz o pedido (GET) ao garçom, que leva à cozinha (servidor web). A cozinha prepara o prato (página) e o garçom traz à mesa (200 OK). Se o prato não existe no cardápio, o garçom avisa: é o 404.", "t": "Discursiva"}, {"q": "Por que se diz que o FTP usa duas conexões? Quais portas e para quê?", "a": "Porque abre uma conexão de controle na porta 21, ativa a sessão inteira, para comandos (usuário, senha, listar, pedir arquivos), e uma conexão de dados na porta 20, aberta para cada arquivo e fechada ao fim da transferência.", "t": "Discursiva"}, {"q": "Por que o FTP está sendo substituído? Cite as alternativas.", "a": "Porque o FTP não criptografa os dados, inclusive usuário e senha. As alternativas SFTP (sobre SSH) e FTPS (FTP sobre SSL/TLS) criptografam a transferência.", "t": "Discursiva"}, {"q": "Quais são os três componentes do sistema de e-mail?", "a": "Agentes de usuário (Outlook, Thunderbird, Gmail), servidores de correio e protocolos de comunicação (SMTP, POP3, IMAP).", "t": "Discursiva"}, {"q": "Descreva o caminho de um e-mail do remetente até a caixa do destinatário.", "a": "O cliente do remetente envia ao seu servidor por SMTP. Esse servidor se conecta ao servidor do destinatário, também por SMTP, e entrega a mensagem. Ela fica guardada até o destinatário acessá-la por POP3 ou IMAP.", "t": "Discursiva"}, {"q": "Qual a diferença entre POP3 e IMAP? Qual você recomendaria para quem lê e-mail no celular e no notebook?", "a": "POP3 baixa as mensagens para o computador e geralmente as remove do servidor. IMAP permite ler e organizar direto no servidor, sem baixar. Para vários dispositivos, IMAP, porque todos veem a mesma caixa.", "t": "Aplicação"}, {"q": "Por que o DNS é chamado de “lista telefônica da internet”?", "a": "Porque traduz nomes fáceis de lembrar (www.google.com.br) nos endereços IP numéricos que os computadores usam, assim como a agenda do celular liga um nome a um número.", "t": "Discursiva"}, {"q": "Descreva as quatro etapas de uma consulta DNS.", "a": "1) O computador pergunta ao servidor DNS local (do provedor). 2) Se ele não sabe, consulta um servidor raiz. 3) A raiz indica o servidor do domínio de topo (.br, .com). 4) Esse indica o servidor autoritativo do domínio, que devolve o IP. O resultado fica em cache.", "t": "Discursiva"}, {"q": "Para que serve o cache no DNS?", "a": "Guarda as respostas de consultas já feitas para que as próximas sejam respondidas mais rápido, sem repetir todo o caminho até o servidor autoritativo.", "t": "Discursiva"}, {"q": "Explique o que acontece quando você digita `www.ifs.edu.br` e pressiona Enter, citando DNS e HTTP.", "a": "O navegador precisa do IP: consulta o DNS (cache, servidor local, raiz, .br, autoritativo) e recebe o endereço. Depois abre a conexão com o servidor e envia uma requisição HTTP GET. O servidor responde (200 OK) com HTML, CSS, imagens e scripts, e o navegador renderiza a página.", "t": "Estudo de caso"}], "flash": [{"f": "Camada de Aplicação", "b": "A camada mais próxima do usuário, onde rodam navegadores, e-mail, jogos e mensageiros."}, {"f": "HTTP", "b": "HyperText Transfer Protocol: protocolo que transfere páginas da Web. Porta 80."}, {"f": "HTTPS", "b": "HTTP seguro, com criptografia. Porta 443."}, {"f": "GET × POST", "b": "GET pede um recurso; POST envia dados ao servidor, como um formulário."}, {"f": "404 Not Found", "b": "O recurso pedido não existe no servidor."}, {"f": "FTP · portas", "b": "21 para controle (comandos) e 20 para dados (arquivos)."}, {"f": "SFTP e FTPS", "b": "Alternativas seguras ao FTP: sobre SSH e sobre SSL/TLS."}, {"f": "SMTP", "b": "Simple Mail Transfer Protocol: envia e-mails. Porta 25."}, {"f": "POP3", "b": "Baixa os e-mails para o computador e geralmente apaga do servidor."}, {"f": "IMAP", "b": "Acessa e organiza os e-mails no próprio servidor. Ideal para vários dispositivos."}, {"f": "DNS", "b": "Traduz nomes de domínio em endereços IP. Usa a porta 53."}, {"f": "Servidor autoritativo", "b": "Servidor DNS responsável por um domínio específico; é ele que dá a resposta final com o IP."}], "vf": [{"s": "No modelo cliente-servidor, o servidor precisa estar sempre ligado e ter um endereço conhecido.", "v": true, "j": "Verdadeiro. O servidor espera requisições de muitos clientes, então precisa estar disponível e com IP fixo e conhecido."}, {"s": "No P2P existe um servidor central que coordena toda a troca de arquivos.", "v": false, "j": "Falso. No P2P **não há servidor central**: os computadores falam diretamente e cada um é cliente e servidor."}, {"s": "O método POST é usado para enviar dados de um formulário ao servidor.", "v": true, "j": "Verdadeiro. GET pede um recurso; POST envia dados."}, {"s": "O código HTTP 500 indica que a página pedida não foi encontrada.", "v": false, "j": "Falso. Página não encontrada é o **404**. O 500 é um erro interno do servidor."}, {"s": "O FTP transfere arquivos pela porta 21.", "v": false, "j": "Falso. A porta 21 é a conexão de **controle** (comandos). Os arquivos passam pela conexão de dados, na porta **20**."}, {"s": "SFTP e FTPS criptografam os dados durante a transferência.", "v": true, "j": "Verdadeiro. Por isso estão substituindo o FTP tradicional."}, {"s": "O SMTP é usado tanto para enviar quanto para ler e-mails na caixa de entrada.", "v": false, "j": "Falso. O SMTP **envia** (cliente → servidor e servidor → servidor). Para ler, usam-se POP3 ou IMAP."}, {"s": "Com IMAP, as mensagens ficam no servidor e podem ser vistas de vários dispositivos.", "v": true, "j": "Verdadeiro. É a melhor opção para quem usa celular e computador."}, {"s": "O DNS é um banco de dados centralizado em um único servidor mundial.", "v": false, "j": "Falso. O DNS é **distribuído e hierárquico**: raiz, domínios de topo e servidores autoritativos."}, {"s": "Na consulta DNS, o servidor raiz devolve diretamente o IP do site pedido.", "v": false, "j": "Falso. A raiz apenas **indica** o servidor do domínio de topo (.br, .com), que indica o autoritativo. É o autoritativo que devolve o IP."}, {"s": "O cache do DNS acelera as próximas consultas ao mesmo nome.", "v": true, "j": "Verdadeiro. A resposta guardada evita repetir todo o caminho da consulta."}, {"s": "O HTTP funciona no modelo cliente-servidor.", "v": true, "j": "Verdadeiro. O navegador é o cliente; o servidor web responde às requisições."}], "pbl": [{"titulo": "Detetive das requisições", "duracao": "2 aulas", "cenario": "O site do grêmio estudantil está lento e algumas imagens não aparecem. O presidente do grêmio pediu à turma um diagnóstico usando só o navegador e o prompt de comando.", "problema": "Usando as ferramentas do navegador (F12 › Rede) e o `nslookup`, como descobrir o que acontece quando a página carrega e onde estão os erros?", "perguntas": ["Quantas requisições a página faz e quais métodos aparecem?", "Existem respostas 301, 404 ou 500? O que cada uma indica?", "Qual é o IP do servidor? O `nslookup` devolve o mesmo IP para outros sites do mesmo provedor?", "O site usa HTTP ou HTTPS? Por que isso importa?"], "entregaveis": ["Tabela com pelo menos 8 requisições: método, código, URL e tamanho", "Resultado do `nslookup` para o site e mais 4 domínios", "Relatório de 1 página com o diagnóstico e as recomendações"], "solucao": ["Tabela preenchida a partir da aba Rede: a maioria das requisições é GET com 200; imagens ausentes aparecem com **404** (arquivo com nome ou caminho errado); redirecionamentos de http para https aparecem como **301**.", "O `nslookup` mostra o servidor DNS consultado e o IP resolvido; é o passo que acontece antes do HTTP.", "Recomendações: corrigir os caminhos das imagens que dão 404, reduzir o tamanho das imagens grandes, usar HTTPS (porta 443) e verificar erros 500 com o responsável pelo servidor."]}, {"titulo": "E-mail da secretaria", "duracao": "1 a 2 aulas", "cenario": "A secretaria do campus usa uma conta de e-mail configurada com POP3 em um único computador. Agora as servidoras precisam ler e responder as mensagens também pelo celular, e reclamam que “os e-mails somem”.", "problema": "Por que os e-mails “somem” e como reconfigurar o acesso para funcionar em vários dispositivos com segurança?", "perguntas": ["O que o POP3 faz com as mensagens depois do download?", "Qual protocolo permite ver a mesma caixa em vários aparelhos?", "Quais servidores e portas precisam ser configurados para envio e recebimento?", "Como evitar que a senha trafegue sem proteção?"], "entregaveis": ["Diagrama do caminho de um e-mail do remetente até a secretaria", "Ficha de configuração (servidor de envio e de recebimento) para computador e celular", "Guia de uma página para as servidoras"], "solucao": ["Causa: o POP3 baixa as mensagens para o computador e geralmente as **apaga do servidor**, então o celular não as encontra.", "Solução: trocar para **IMAP** em todos os aparelhos; as mensagens ficam no servidor e aparecem iguais em todos.", "Envio continua por **SMTP**; configurar as versões com criptografia (SSL/TLS) oferecidas pelo provedor.", "Diagrama: cliente do remetente → SMTP → servidor do remetente → SMTP → servidor do campus → IMAP → computador e celular da secretaria."]}], "lab": ["dns", "http"]}, {"id": "m3", "titulo": "Camada de Transporte", "subtitulo": "Unidade III · portas, UDP e TCP", "objetivo": "Compreender o papel da camada de transporte, explicar multiplexação e demultiplexação com portas e comparar TCP e UDP.", "resumo": [["Comunicação fim a fim", "A camada de rede leva os dados de computador a computador; a de transporte entrega à **aplicação certa** dentro do computador."], ["Portas", "Números que identificam a aplicação: HTTP 80, HTTPS 443, FTP 21, SMTP 25, DNS 53, DHCP 67/68."], ["Multiplexação", "Na origem, junta dados de várias aplicações e põe portas de origem e destino em cada segmento. Demultiplexação: no destino, lê a porta e entrega ao socket certo."], ["UDP", "Sem conexão e sem garantia de entrega ou ordem. Rápido e leve: streaming, jogos, DNS, VoIP."], ["TCP", "Orientado à conexão e confiável: three-way handshake (SYN, SYN-ACK, ACK), números de sequência, ACKs e retransmissão."], ["Controles do TCP", "Controle de fluxo (janela de recepção) protege o receptor lento. Controle de congestionamento reduz a velocidade quando há perda na rede."]], "historia": "No 4º andar, Paco encontra dois balcões. O **Sr. TCP**, de uniforme impecável, garante que “nenhum pacote fica para trás”. O **Sr. UDP**, de pés na mesa, joga pacotes pela janela: “rápido e sem frescura”. Como Paco é texto e cada letra importa, ele vai com o TCP.", "historiaTitulo": "A jornada de Paco", "caderno": [{"q": "Qual é a diferença entre a tarefa da camada de rede e a da camada de transporte?", "a": "A camada de rede leva os pacotes de um computador a outro. A camada de transporte entrega os dados ao processo (aplicação) correto dentro do computador de destino, criando uma comunicação lógica entre processos.", "t": "Discursiva"}, {"q": "Explique a analogia da correspondência interna de uma empresa para a camada de transporte.", "a": "A empresa (computador) recebe muitas cartas do correio. O setor de correspondência (transporte) lê o nome do destinatário (a porta) e entrega na sala certa (a aplicação).", "t": "Discursiva"}, {"q": "O que é multiplexação e o que é demultiplexação?", "a": "Multiplexação, na origem: pegar dados de várias aplicações, acrescentar o cabeçalho com porta de origem e de destino e entregar à camada de rede. Demultiplexação, no destino: ler a porta de destino de cada segmento e entregar ao socket da aplicação correspondente.", "t": "Discursiva"}, {"q": "Complete a tabela: serviço, porta e protocolo de transporte para HTTP, HTTPS, FTP, SMTP, DNS e DHCP.", "a": "HTTP 80 TCP; HTTPS 443 TCP; FTP 21 TCP; SMTP 25 TCP; DNS 53 UDP (e TCP); DHCP 67/68 UDP.", "t": "Tabela"}, {"q": "Por que se diz que o UDP é “não orientado à conexão” e “não confiável”?", "a": "Não há aperto de mão antes de enviar os dados (sem conexão) e não há garantia de que os pacotes cheguem nem de que cheguem na ordem (não confiável).", "t": "Discursiva"}, {"q": "Se o UDP não garante a entrega, por que ele é usado? Cite quatro aplicações.", "a": "Porque é rápido e leve: não tem o custo de estabelecer conexão, confirmar e retransmitir. É usado em streaming de vídeo e áudio, jogos online, DNS e VoIP, onde atraso atrapalha mais que perder um pacote.", "t": "Discursiva"}, {"q": "Descreva as três etapas do three-way handshake.", "a": "1) SYN: o cliente pede para iniciar a conexão. 2) SYN-ACK: o servidor confirma e pede sincronização de volta. 3) ACK: o cliente confirma. A conexão está estabelecida.", "t": "Discursiva"}, {"q": "Como o TCP percebe que um segmento se perdeu e o que ele faz?", "a": "Cada byte enviado tem número de sequência e o receptor devolve confirmações (ACK). Se o remetente não recebe o ACK dentro do tempo limite, retransmite os dados.", "t": "Discursiva"}, {"q": "Qual a diferença entre controle de fluxo e controle de congestionamento?", "a": "Controle de fluxo protege o **receptor**: ele informa o tamanho da janela de recepção (espaço livre no buffer) e o remetente ajusta a velocidade. Controle de congestionamento protege a **rede**: ao detectar perda de pacotes, o TCP reduz a taxa de envio.", "t": "Comparação"}, {"q": "Monte uma tabela TCP × UDP com: conexão, confiabilidade, fluxo, congestionamento, velocidade, overhead e exemplos.", "a": "TCP: orientado à conexão, confiável, tem controle de fluxo e de congestionamento, mais lento, overhead maior, usado em Web, e-mail, download. UDP: sem conexão, não confiável, sem esses controles, mais rápido, overhead pequeno, usado em streaming, jogos, DNS, VoIP.", "t": "Tabela"}, {"q": "Indique TCP ou UDP e justifique: a) download de PDF de 50 MB; b) jogo de futebol ao vivo.", "a": "a) TCP: o arquivo precisa chegar completo e sem erros. b) UDP: na transmissão ao vivo é melhor perder um pedacinho do que pausar para retransmitir.", "t": "Cenários"}, {"q": "Indique TCP ou UDP e justifique: c) e-mail com anexo; d) jogo multiplayer; e) consulta DNS.", "a": "c) TCP: a mensagem e o anexo devem chegar inteiros. d) UDP: atraso (lag) é pior que perder uma posição. e) UDP: consultas pequenas e rápidas; se se perder, basta repetir.", "t": "Cenários"}, {"q": "Explique as analogias do cartão-postal e da ligação telefônica.", "a": "UDP é o cartão-postal: você envia e torce para chegar, sem confirmação, rápido e barato. TCP é a ligação: primeiro se estabelece a conexão (“Alô?”), a conversa tem confirmações (“Entendi”) e há despedida no fim.", "t": "Discursiva"}, {"q": "Na história, o Sr. TCP escreve duas informações no segmento de Paco. Quais são e para que servem?", "a": "A porta de origem (o “apartamento” do programa de mensagens no computador de Ana) e a porta de destino (o do programa no computador de Beto). Servem para que a demultiplexação entregue Paco à aplicação correta.", "t": "Na história"}], "flash": [{"f": "Segmento", "b": "Unidade de dados da camada de transporte: dados + cabeçalho com portas."}, {"f": "Porta", "b": "Número que identifica a aplicação dentro do computador."}, {"f": "Socket", "b": "Ponto de comunicação de uma aplicação, identificado por IP e porta."}, {"f": "Demultiplexação", "b": "Entregar cada segmento recebido ao socket certo, lendo a porta de destino."}, {"f": "UDP", "b": "User Datagram Protocol: sem conexão, não confiável, rápido e leve."}, {"f": "TCP", "b": "Transmission Control Protocol: orientado à conexão e confiável."}, {"f": "Three-way handshake", "b": "SYN → SYN-ACK → ACK: as três etapas para abrir uma conexão TCP."}, {"f": "ACK", "b": "Confirmação de recebimento enviada pelo receptor no TCP."}, {"f": "Número de sequência", "b": "Numeração dos bytes enviados, usada para ordenar e detectar perdas."}, {"f": "Janela de recepção", "b": "Espaço livre no buffer do receptor; base do controle de fluxo."}, {"f": "Controle de congestionamento", "b": "O TCP reduz a taxa de envio quando detecta perda de pacotes na rede."}, {"f": "Porta 443", "b": "HTTPS, a Web segura, sobre TCP."}], "vf": [{"s": "A camada de transporte entrega os dados para a aplicação correta dentro do computador de destino.", "v": true, "j": "Verdadeiro. Ela usa o número da porta para achar o processo certo."}, {"s": "Na multiplexação, o computador de destino lê a porta e entrega o dado ao socket.", "v": false, "j": "Falso. Isso é a **demultiplexação**, que acontece no destino. A multiplexação acontece na origem."}, {"s": "O DNS usa principalmente UDP na porta 53.", "v": true, "j": "Verdadeiro. Também pode usar TCP, mas as consultas comuns vão por UDP."}, {"s": "O UDP garante que os pacotes cheguem na ordem em que foram enviados.", "v": false, "j": "Falso. O UDP não garante entrega nem ordem. Quem numera e ordena os dados é o **TCP**."}, {"s": "O UDP é adequado para VoIP porque prioriza a fluidez da conversa.", "v": true, "j": "Verdadeiro. Esperar retransmissões causaria atrasos piores do que perder um pedaço mínimo de áudio."}, {"s": "O three-way handshake acontece depois que os dados começam a ser enviados.", "v": false, "j": "Falso. O handshake acontece **antes** de qualquer dado: SYN, SYN-ACK e ACK estabelecem a conexão."}, {"s": "A sequência correta do handshake é SYN, SYN-ACK, ACK.", "v": true, "j": "Verdadeiro."}, {"s": "Se o remetente TCP não recebe o ACK dentro do tempo limite, ele retransmite os dados.", "v": true, "j": "Verdadeiro. É assim que o TCP garante a entrega."}, {"s": "O controle de fluxo existe para evitar o congestionamento dos roteadores da internet.", "v": false, "j": "Falso. O controle de fluxo protege o **receptor** lento (janela de recepção). Quem trata a rede é o controle de **congestionamento**."}, {"s": "Para baixar um arquivo PDF sem erros, o UDP é a melhor escolha.", "v": false, "j": "Falso. Um arquivo precisa chegar completo e correto: o adequado é o **TCP**."}, {"s": "O TCP tem mais overhead que o UDP.", "v": true, "j": "Verdadeiro. Conexão, confirmações e retransmissões custam cabeçalhos e tempo."}, {"s": "HTTP e HTTPS usam UDP como protocolo de transporte.", "v": false, "j": "Falso. Na tabela da unidade, HTTP (80) e HTTPS (443) usam **TCP**."}], "pbl": [{"titulo": "Time TCP × Time UDP", "duracao": "2 aulas", "cenario": "Uma escola vai lançar uma rádio web e um sistema de envio de trabalhos pela internet no mesmo servidor. O técnico precisa justificar à direção qual protocolo de transporte cada serviço vai usar.", "problema": "Para cada serviço da escola, qual protocolo de transporte usar e como defender essa escolha diante de quem defende o outro?", "perguntas": ["O que acontece com a rádio se um pacote se perder? E com o trabalho enviado?", "Quais portas cada serviço vai usar?", "Qual o custo (overhead) de cada escolha?", "Existe algum serviço em que a escolha não é óbvia?"], "entregaveis": ["Tabela de serviços com protocolo, porta e justificativa", "Apresentação de 5 minutos de cada time (TCP e UDP)", "Votação da turma e síntese no caderno"], "solucao": ["Rádio web ao vivo: **UDP**, porque perder um pedaço mínimo de áudio é melhor do que pausar para retransmitir.", "Envio de trabalhos: **TCP**, porque o arquivo precisa chegar completo e sem erros; usa HTTPS na porta 443.", "Consulta de nomes do servidor: DNS, porta 53, UDP.", "A síntese deve reconhecer que não existe protocolo melhor em geral: cada um serve a uma necessidade (confiabilidade × velocidade)."]}, {"titulo": "Handshake em papel", "duracao": "1 aula", "cenario": "A turma do 1º ano não entende como o TCP “sabe” que um dado se perdeu. O professor quer uma simulação física com bilhetes para que todos vejam a conexão, o envio e a retransmissão.", "problema": "Como simular com bilhetes de papel o estabelecimento de uma conexão TCP, a troca de dados com números de sequência e uma perda com retransmissão?", "perguntas": ["Quais bilhetes precisam existir antes do primeiro dado?", "Como representar o número de sequência e o ACK?", "Como simular uma perda (um aluno “carteiro” que some com um bilhete)?", "Como representar a janela de recepção?"], "entregaveis": ["Roteiro da simulação com papéis: cliente, servidor, carteiro", "Conjunto de bilhetes (SYN, SYN-ACK, ACK, dados numerados, ACKs)", "Registro no caderno do que aconteceu em cada rodada"], "solucao": ["Rodada 1: cliente envia **SYN**, servidor responde **SYN-ACK**, cliente envia **ACK**; só então há conexão.", "Rodada 2: cliente envia bilhetes de dados numerados (1, 2, 3); o servidor devolve um ACK para cada um.", "Rodada 3: o carteiro “perde” o bilhete 2; o cliente espera, não recebe o ACK dentro do tempo combinado e **retransmite** o bilhete 2.", "Janela: o servidor diz quantos bilhetes cabem na sua mesa; o cliente não envia mais do que isso (controle de fluxo)."]}], "lab": ["handshake", "ports"]}, {"id": "m4", "titulo": "Camada de Rede", "subtitulo": "Unidade IV · IP, roteamento, DHCP e Windows", "objetivo": "Compreender o papel da camada de rede, explicar o endereçamento IP e o roteamento, descrever o DHCP e fazer configurações básicas de rede no Windows.", "resumo": [["Dois problemas", "**Endereçamento**: cada dispositivo precisa de um endereço único (IP). **Roteamento**: achar o melhor caminho entre redes, preenchendo as tabelas dos roteadores."], ["IPv4 × IPv6", "IPv4: 32 bits, notação decimal com pontos, cerca de 4,3 bilhões de endereços, praticamente esgotados. IPv6: 128 bits, notação hexadecimal."], ["Encaminhamento", "O roteador lê o IP de destino, consulta a tabela de encaminhamento e envia o pacote ao próximo salto."], ["Endereços especiais", "`127.0.0.1` loopback; `192.168.x.x` e `10.x.x.x` privados; `255.255.255.255` broadcast."], ["DHCP (DORA)", "Discover (broadcast) → Offer → Request → Ack. Entrega IP, máscara, gateway e DNS, com tempo de concessão (lease)."], ["Comandos", "`ipconfig`, `ipconfig /all`, `/release`, `/renew`, `ping` e `tracert`."]], "historia": "No 3º andar, a **Sra. IP** cola duas etiquetas no envelope de Paco: IP de origem `10.0.1.50` e IP de destino `189.12.34.56`. Ela não conhece o caminho inteiro até Manaus, mas sabe a quem entregar primeiro: o roteador, o guia que conhece as estradas.", "historiaTitulo": "A jornada de Paco", "caderno": [{"q": "Quais são os dois grandes problemas que a camada de rede resolve?", "a": "Endereçamento (dar a cada dispositivo um identificador lógico e global, o IP) e roteamento (determinar o melhor caminho para o pacote atravessar várias redes até o destino).", "t": "Discursiva"}, {"q": "Como se chama a unidade de dados da camada de rede?", "a": "Datagrama (ou pacote IP).", "t": "Discursiva"}, {"q": "Explique a analogia do sistema postal para a camada de rede.", "a": "O IP é o endereço completo e único da casa (rua, número, cidade, CEP). Os roteadores são agências e centros de triagem que olham o CEP de destino e decidem para qual próxima agência mandar a carta, até chegar à cidade certa.", "t": "Discursiva"}, {"q": "Compare IPv4 e IPv6 quanto ao tamanho, à notação e à quantidade de endereços.", "a": "IPv4: 32 bits, decimal com pontos (192.168.1.100), cerca de 4,3 bilhões de endereços, já praticamente esgotados. IPv6: 128 bits, hexadecimal (2001:0db8:...:7334), quantidade astronomicamente grande.", "t": "Comparação"}, {"q": "Qual a diferença entre roteamento e encaminhamento?", "a": "Roteamento é o cálculo das rotas feito pelos algoritmos, que preenchem as tabelas. Encaminhamento é a ação do roteador de mover cada pacote da interface de entrada para a de saída correta, consultando a tabela e escolhendo o próximo salto.", "t": "Discursiva"}, {"q": "O que significa cada endereço: `127.0.0.1`, `192.168.x.x`, `10.x.x.x` e `255.255.255.255`?", "a": "127.0.0.1: loopback, o próprio computador. 192.168.x.x e 10.x.x.x: endereços privados, usados em redes locais. 255.255.255.255: broadcast, mensagem para todos na rede local.", "t": "Tabela"}, {"q": "Por que configurar IPs manualmente em um laboratório de 200 computadores é um problema?", "a": "É um trabalho enorme e sujeito a erros: IPs repetidos, máscara ou gateway digitados errados. O DHCP automatiza essa configuração.", "t": "Discursiva"}, {"q": "Descreva as quatro mensagens do DHCP.", "a": "1) Discover: o computador envia em broadcast “alguém me dá um IP?”. 2) Offer: o servidor oferece um IP livre e outras configurações. 3) Request: o computador aceita e pede formalmente. 4) Ack: o servidor confirma a atribuição.", "t": "Discursiva"}, {"q": "Além do endereço IP, que outras informações o DHCP entrega?", "a": "Máscara de sub-rede, gateway padrão e servidor DNS.", "t": "Discursiva"}, {"q": "O que é o tempo de concessão (lease time)?", "a": "O período durante o qual o computador pode usar o IP recebido do DHCP. Depois dele, precisa renovar a concessão com o servidor.", "t": "Discursiva"}, {"q": "Descreva o caminho na interface gráfica do Windows para configurar o IP manualmente.", "a": "Painel de Controle › Rede e Internet › Central de Rede e Compartilhamento › Alterar as configurações do adaptador › botão direito na conexão › Propriedades › Protocolo IP Versão 4 (TCP/IPv4) › Propriedades › “Usar o seguinte endereço IP”.", "t": "Procedimento"}, {"q": "Para que servem `ipconfig`, `ipconfig /all`, `ipconfig /release` e `ipconfig /renew`?", "a": "ipconfig: mostra IP, máscara e gateway. /all: mostra tudo, inclusive MAC, servidor DHCP e DNS. /release: libera o IP obtido por DHCP. /renew: pede um novo IP ao servidor DHCP.", "t": "Comandos"}, {"q": "Qual a diferença entre `ping` e `tracert`?", "a": "O ping testa se há comunicação com outro dispositivo e mostra o tempo de resposta. O tracert mostra a rota até o destino, listando cada roteador (salto) do caminho.", "t": "Discursiva"}, {"q": "Por que a transição de IPv4 para IPv6 é necessária e qual um desafio dela?", "a": "Porque os cerca de 4,3 bilhões de endereços IPv4 estão praticamente esgotados. Um desafio é que os dois protocolos precisam conviver por muito tempo, exigindo equipamentos, sistemas e profissionais preparados para ambos.", "t": "Reflexão"}], "flash": [{"f": "Datagrama", "b": "Unidade de dados da camada de rede, com IP de origem e de destino."}, {"f": "Endereço IP", "b": "Identificador lógico e global de um dispositivo na rede."}, {"f": "IPv4", "b": "Endereço de 32 bits em decimal com pontos. Ex.: `192.168.1.100`."}, {"f": "IPv6", "b": "Endereço de 128 bits em hexadecimal. Criado pelo esgotamento do IPv4."}, {"f": "Tabela de encaminhamento", "b": "Lista do roteador que indica, para cada destino, o próximo salto."}, {"f": "Próximo salto", "b": "O próximo roteador para onde o pacote será enviado."}, {"f": "Loopback", "b": "`127.0.0.1`: o próprio computador."}, {"f": "Endereço privado", "b": "`192.168.x.x` ou `10.x.x.x`: usados dentro de redes locais."}, {"f": "DHCP", "b": "Atribui automaticamente IP, máscara, gateway e DNS. Portas 67/68, UDP."}, {"f": "DORA", "b": "Discover, Offer, Request, Ack: as 4 mensagens do DHCP."}, {"f": "Gateway padrão", "b": "Roteador que liga a rede local a outras redes."}, {"f": "tracert", "b": "Comando do Windows que mostra os saltos até o destino."}], "vf": [{"s": "O endereço IP é um identificador físico gravado na placa de rede.", "v": false, "j": "Falso. O IP é um endereço **lógico**, que pode mudar. O endereço físico gravado de fábrica é o **MAC**."}, {"s": "O IPv4 usa endereços de 32 bits.", "v": true, "j": "Verdadeiro. Isso dá cerca de 4,3 bilhões de endereços."}, {"s": "O IPv6 foi criado para resolver o esgotamento dos endereços IPv4.", "v": true, "j": "Verdadeiro. Com 128 bits, oferece uma quantidade enorme de endereços."}, {"s": "O endereço `127.0.0.1` identifica o roteador da rede local.", "v": false, "j": "Falso. `127.0.0.1` é o **loopback**, o próprio computador."}, {"s": "Endereços como `10.0.1.50` são privados e usados em redes locais.", "v": true, "j": "Verdadeiro. A faixa `10.x.x.x`, assim como `192.168.x.x`, é privada."}, {"s": "Cada roteador conhece o caminho completo da origem até o destino final.", "v": false, "j": "Falso. Cada roteador decide só o **próximo salto**, consultando sua tabela."}, {"s": "A primeira mensagem do DHCP é enviada em broadcast porque o computador ainda não sabe quem é o servidor.", "v": true, "j": "Verdadeiro. O DHCP Discover vai para toda a rede local."}, {"s": "A ordem das mensagens do DHCP é Offer, Discover, Ack, Request.", "v": false, "j": "Falso. A ordem é **Discover, Offer, Request, Ack** (DORA)."}, {"s": "O IP recebido pelo DHCP vale para sempre, sem precisar de renovação.", "v": false, "j": "Falso. Ele tem um **tempo de concessão** (lease) e precisa ser renovado."}, {"s": "O comando `ipconfig /all` mostra também o endereço MAC e o servidor DNS.", "v": true, "j": "Verdadeiro. O `/all` mostra as informações detalhadas."}, {"s": "O comando `ipconfig /renew` libera o IP obtido por DHCP.", "v": false, "j": "Falso. Quem libera é o `/release`. O `/renew` **pede um novo** IP."}, {"s": "O `tracert` mostra cada roteador por onde os pacotes passam até o destino.", "v": true, "j": "Verdadeiro. Cada linha do resultado é um salto."}], "pbl": [{"titulo": "Raio-x da rede do laboratório", "duracao": "2 aulas", "cenario": "O laboratório de informática tem máquinas que às vezes “ficam sem internet”. Ninguém sabe dizer qual é o gateway, qual servidor DHCP entrega os IPs nem por quantos roteadores os pacotes passam até a internet.", "problema": "Usando só o prompt de comando, como documentar a configuração de rede do laboratório e localizar onde a comunicação falha?", "perguntas": ["Qual IP, máscara, gateway, servidor DHCP e DNS cada máquina recebe?", "O `ping` responde para o gateway, para `8.8.8.8` e para um nome de site? O que muda entre os três testes?", "Quantos saltos o `tracert` mostra até o Google?", "O que acontece depois de `ipconfig /release` e `ipconfig /renew`?"], "entregaveis": ["Ficha de rede de 3 máquinas (saída do `ipconfig /all` interpretada)", "Tabela dos testes de `ping` com os tempos", "Mapa dos saltos do `tracert`", "Fluxograma de diagnóstico para o monitor do laboratório"], "solucao": ["Ordem de diagnóstico: `ipconfig` (tem IP válido?) → `ping` ao gateway (a rede local funciona?) → `ping 8.8.8.8` (sai para a internet?) → `ping` a um nome (o DNS resolve?).", "Se o IP começa com 169.254, o computador não recebeu resposta do DHCP: testar `ipconfig /release` e `/renew`, cabo e switch.", "Se o `ping 8.8.8.8` funciona mas o nome não, o problema é DNS.", "O `tracert` mostra onde a rota para de responder: dentro do campus ou já no provedor."]}, {"titulo": "Planejando IPs para o novo laboratório", "duracao": "2 aulas", "cenario": "O campus vai abrir um laboratório com 30 computadores, 1 impressora de rede e 1 servidor local. A equipe de TI quer usar DHCP para os computadores, mas a impressora e o servidor precisam de endereço fixo.", "problema": "Como organizar o endereçamento do novo laboratório combinando DHCP e IPs fixos sem conflitos?", "perguntas": ["Qual faixa privada usar?", "Quais endereços reservar para gateway, servidor e impressora?", "Qual faixa o DHCP vai distribuir e qual tempo de concessão faz sentido?", "Como configurar manualmente a impressora e o servidor no Windows?"], "entregaveis": ["Planilha de endereçamento do laboratório", "Configuração proposta para o servidor DHCP (faixa, gateway, DNS, lease)", "Passo a passo da configuração manual de IP"], "solucao": ["Exemplo: rede `192.168.10.0` com máscara `255.255.255.0`; gateway `192.168.10.1`.", "Fixos fora da faixa do DHCP: servidor `192.168.10.10`, impressora `192.168.10.20`.", "DHCP distribui de `192.168.10.100` a `192.168.10.150`, com gateway e DNS configurados e lease de algumas horas (um turno de aula).", "Configuração manual pelo TCP/IPv4 › “Usar o seguinte endereço IP”, conferindo depois com `ipconfig` e `ping` ao gateway."]}], "lab": ["dhcp", "route"]}, {"id": "m5", "titulo": "Camada de Enlace", "subtitulo": "Unidade V · quadros, MAC, ARP, Ethernet e switches", "objetivo": "Compreender o papel da camada de enlace, explicar as LANs comutadas, diferenciar MAC e IP, descrever o ARP e comparar switches e roteadores.", "resumo": [["Salto a salto", "A camada de rede vê a rota inteira; a de enlace cuida de cada salto entre dois dispositivos diretamente conectados."], ["Serviços", "Enquadramento (cabeçalho com MACs e trailer), acesso ao meio (evitar colisões) e detecção de erros com CRC."], ["Switch × hub", "O switch aprende em que porta está cada MAC e envia o quadro só para a porta certa. O hub repete para todas, causando colisões."], ["MAC", "Endereço físico de 48 bits (6 bytes), em hexadecimal, gravado de fábrica na placa. Como um CPF; o IP é como o endereço da casa."], ["ARP", "Descobre o MAC a partir do IP: pergunta em broadcast, resposta direta, e guarda na tabela ARP (`arp -a`)."], ["Switch × roteador", "Switch: camada 2, quadros, MAC, dentro da LAN, repassa broadcast. Roteador: camada 3, pacotes, IP, liga redes, bloqueia broadcast."]], "historia": "No 2º andar, o **Sr. Enlace** precisa do MAC do roteador, mas só conhece o IP `10.0.1.1`. Ele pega seu megafone mágico, o **ARP**, e grita para toda a rede: “Quem tem o IP 10.0.1.1?”. O roteador responde, e Paco ganha sua última roupa: o quadro, com MACs e CRC.", "historiaTitulo": "A jornada de Paco", "caderno": [{"q": "Qual a diferença entre a visão da camada de rede e a da camada de enlace sobre o caminho?", "a": "A camada de rede tem a visão global da rota completa, da origem ao destino. A de enlace se preocupa com cada salto individual entre dois dispositivos diretamente conectados.", "t": "Discursiva"}, {"q": "Explique os três serviços principais da camada de enlace.", "a": "Enquadramento: encapsula o datagrama em um quadro com cabeçalho (MACs) e trailer (verificação de erros). Acesso ao meio: coordena as transmissões em meios compartilhados para evitar colisões. Detecção e correção de erros: bits de verificação como o CRC.", "t": "Discursiva"}, {"q": "O que é o CRC e o que acontece com um quadro cujo CRC não confere?", "a": "Cyclic Redundancy Check: código de verificação no trailer do quadro. Se o valor calculado no receptor não bate, o quadro está corrompido e é descartado (o TCP, se usado, retransmite depois).", "t": "Discursiva"}, {"q": "Por que o switch é mais eficiente que o hub?", "a": "O switch aprende os MACs ligados a cada porta e envia o quadro só para a porta do destinatário. O hub repete os dados para todas as portas, gerando colisões e desperdício de banda.", "t": "Discursiva"}, {"q": "Descreva o endereço MAC: tamanho, notação e origem.", "a": "48 bits (6 bytes), representado em hexadecimal (ex.: A4:5E:60:B2:3C:01), gravado de fábrica na placa de rede (NIC) e, em princípio, único no mundo.", "t": "Discursiva"}, {"q": "Use a analogia do CPF e do endereço da casa para diferenciar MAC e IP.", "a": "O IP é como o endereço da casa: lógico, pode mudar se você se mudar. O MAC é como o CPF: atribuído no “nascimento” (fabricação) e não muda.", "t": "Analogia"}, {"q": "Descreva os quatro passos do ARP quando A quer falar com B na mesma LAN.", "a": "1) A sabe o IP de B, mas não o MAC. 2) A envia em broadcast: “quem tem o IP 192.168.1.20? diga seu MAC”. 3) B reconhece seu IP e responde direto para A com o MAC. 4) A guarda o par IP-MAC na tabela ARP e monta o quadro.", "t": "Discursiva"}, {"q": "Liste os campos do quadro Ethernet com seus tamanhos.", "a": "Preâmbulo 8 bytes (sincronização); MAC destino 6; MAC origem 6; Tipo 2 (protocolo de cima, ex.: IPv4); Dados 46 a 1500 bytes (datagrama IP); CRC 4 bytes.", "t": "Tabela"}, {"q": "Como evoluíram as velocidades da Ethernet?", "a": "10 Mbps (original) → 100 Mbps (Fast Ethernet) → 1 Gbps (Gigabit Ethernet) → 10 Gbps ou mais (10 Gigabit Ethernet).", "t": "Discursiva"}, {"q": "Compare switch e roteador em: camada, unidade de dados, endereço, função, tabela e broadcast.", "a": "Switch: camada 2, quadro, MAC, liga dispositivos da mesma LAN, tabela MAC (MAC → porta), repassa broadcast. Roteador: camada 3, pacote, IP, liga redes diferentes, tabela de roteamento (rede → próximo salto), bloqueia broadcast entre redes.", "t": "Tabela"}, {"q": "Que quatro funções o aparelho do provedor de internet de casa costuma acumular?", "a": "Modem (converte o sinal da operadora), roteador (liga a rede local à internet), switch (várias portas Ethernet) e ponto de acesso Wi-Fi.", "t": "Discursiva"}, {"q": "Para que serve o comando `arp -a`?", "a": "Mostra a tabela ARP do computador: os pares de IP e MAC já descobertos, incluindo o do gateway padrão.", "t": "Discursiva"}, {"q": "O que é o OUI de um MAC e como descobrir o fabricante da placa?", "a": "Os 3 primeiros bytes do MAC identificam o fabricante (OUI). Basta pesquisá-los em um site como macvendors.com.", "t": "Discursiva"}, {"q": "Explique o que acontece na camada de enlace quando A (192.168.1.10, AA:AA…) envia para B (192.168.1.20, BB:BB…) na mesma LAN.", "a": "A verifica a tabela ARP; sem o MAC de B, envia ARP em broadcast. O switch repassa o broadcast a todas as portas. B responde com BB:BB:BB:BB:BB:BB. A monta o quadro (origem AA…, destino BB…, CRC). O switch consulta a tabela MAC e envia o quadro só pela porta de B.", "t": "Estudo de caso"}], "flash": [{"f": "Quadro (frame)", "b": "Unidade de dados da camada de enlace: cabeçalho com MACs + dados + CRC."}, {"f": "Endereço MAC", "b": "Endereço físico de 48 bits gravado de fábrica. Ex.: `A4:5E:60:B2:3C:01`."}, {"f": "ARP", "b": "Address Resolution Protocol: descobre o MAC a partir do IP."}, {"f": "Tabela ARP", "b": "Cache de pares IP-MAC. Veja com `arp -a`."}, {"f": "CRC", "b": "Cyclic Redundancy Check: 4 bytes no fim do quadro para detectar erros."}, {"f": "Switch", "b": "Dispositivo da camada 2 que encaminha quadros só para a porta do destino."}, {"f": "Hub", "b": "Dispositivo antigo que repete os dados para todas as portas, gerando colisões."}, {"f": "Tabela MAC", "b": "Lista do switch que liga cada MAC a uma porta."}, {"f": "Ethernet", "b": "Tecnologia de LAN com fio mais usada no mundo."}, {"f": "Payload Ethernet", "b": "De 46 a 1500 bytes: o datagrama IP encapsulado."}, {"f": "OUI", "b": "Os 3 primeiros bytes do MAC, que identificam o fabricante."}, {"f": "LAN", "b": "Rede local: sala, andar, prédio ou campus."}], "vf": [{"s": "A camada de enlace se preocupa com a rota completa entre origem e destino.", "v": false, "j": "Falso. A rota completa é assunto da camada de **rede**. O enlace cuida de cada salto entre vizinhos diretos."}, {"s": "O endereço MAC tem 48 bits e costuma ser escrito em hexadecimal.", "v": true, "j": "Verdadeiro. São 6 bytes, como `A4:5E:60:B2:3C:01`."}, {"s": "O endereço MAC muda sempre que o computador muda de rede.", "v": false, "j": "Falso. Quem pode mudar é o **IP**. O MAC é gravado de fábrica na placa."}, {"s": "A requisição ARP é enviada em broadcast para toda a LAN.", "v": true, "j": "Verdadeiro. A resposta, por outro lado, volta diretamente para quem perguntou."}, {"s": "O ARP traduz nomes de domínio em endereços IP.", "v": false, "j": "Falso. Quem traduz nomes em IPs é o **DNS**. O ARP traduz **IP em MAC**."}, {"s": "O hub envia os dados apenas para a porta do destinatário.", "v": false, "j": "Falso. Isso é o **switch**. O hub repete para todas as portas."}, {"s": "O switch aprende em qual porta está cada endereço MAC.", "v": true, "j": "Verdadeiro. Ele monta a tabela MAC observando os quadros que recebe."}, {"s": "O campo de dados de um quadro Ethernet vai de 46 a 1500 bytes.", "v": true, "j": "Verdadeiro. É ali que vai o datagrama IP."}, {"s": "O roteador repassa os broadcasts de uma rede para as outras.", "v": false, "j": "Falso. O roteador **bloqueia** broadcasts entre redes; o switch os repassa dentro da LAN."}, {"s": "O switch opera na camada 2 e o roteador na camada 3.", "v": true, "j": "Verdadeiro. Switch usa MAC; roteador usa IP."}, {"s": "A cada salto no caminho, o roteador cria um novo quadro com novos endereços MAC, mas mantém os IPs.", "v": true, "j": "Verdadeiro. Na história de Paco, é como trocar de ônibus em cada cidade mantendo o mesmo bilhete (o IP)."}, {"s": "O CRC serve para criptografar o conteúdo do quadro.", "v": false, "j": "Falso. O CRC **detecta erros**; não esconde o conteúdo."}], "pbl": [{"titulo": "Quem é quem na rede do escritório", "duracao": "2 aulas", "cenario": "Um escritório de contabilidade tem 1 roteador ligado à internet, 1 switch e 5 computadores. Um estagiário ligou um hub antigo no lugar do switch “porque tinha mais portas” e a rede ficou lenta.", "problema": "Como explicar ao dono do escritório, com um diagrama, por que o hub deixou a rede lenta e onde entram os endereços IP e MAC em cada trecho?", "perguntas": ["O que o hub faz com cada quadro? E o switch?", "Onde, no diagrama, são usados endereços MAC? E IP?", "O que muda nos endereços quando o pacote sai do roteador para a internet?", "Vale a pena um switch gerenciável aqui? Por quê?"], "entregaveis": ["Diagrama: roteador, switch e 5 computadores, com IP e MAC de cada um", "Explicação do trajeto de um quadro com hub e com switch", "Recomendação de equipamento com justificativa"], "solucao": ["Com hub, cada quadro é repetido para as 5 portas: há colisões e desperdício de banda. Com switch, o quadro vai só para a porta do destino, graças à tabela MAC.", "Dentro da LAN, o quadro leva MACs de origem e destino; o datagrama dentro dele leva os IPs.", "Ao sair para a internet, o roteador cria um novo quadro (novos MACs), mas o IP de destino continua o mesmo.", "Recomendação: trocar o hub por um switch; um gerenciável permite VLANs, monitoramento e controle das portas, útil se o escritório crescer."]}, {"titulo": "Caçada ao MAC", "duracao": "1 aula", "cenario": "A coordenação quer um inventário das placas de rede do laboratório para liberar o Wi-Fi só para máquinas conhecidas. Ninguém sabe o fabricante das placas nem o MAC do gateway.", "problema": "Como levantar o MAC de cada máquina, identificar o fabricante e mapear a tabela ARP do laboratório?", "perguntas": ["Onde aparece o “Endereço Físico” no `ipconfig /all`?", "O que o `arp -a` mostra e qual é o MAC do gateway?", "O que os 3 primeiros bytes (OUI) revelam?", "Filtrar por MAC é uma proteção suficiente?"], "entregaveis": ["Planilha: máquina, IP, MAC, fabricante (OUI)", "Print ou cópia da tabela ARP com o gateway destacado", "Parágrafo sobre os limites do controle por MAC"], "solucao": ["`ipconfig /all` mostra o MAC como “Endereço Físico” de cada adaptador (Ethernet e Wi-Fi).", "`arp -a` lista pares IP-MAC; a linha do IP do gateway mostra o MAC do roteador.", "O OUI pesquisado em macvendors.com revela o fabricante da placa.", "O controle por MAC ajuda a organizar, mas não basta como segurança: um MAC pode ser falsificado. Deve ser combinado com senha forte e criptografia (WPA2/WPA3)."]}], "lab": ["switch", "arp"]}, {"id": "m6", "titulo": "Meios Físicos e Cabeamento", "subtitulo": "Unidade VI · coaxial, par trançado, fibra e crimpagem", "objetivo": "Identificar e comparar coaxial, par trançado e fibra óptica, conhecer o padrão T568B e montar e testar um cabo de par trançado.", "resumo": [["Coaxial", "Condutor central de cobre, dielétrico, malha metálica e capa. Boa blindagem; usado em TV a cabo e internet banda larga, não em LANs modernas."], ["Par trançado", "4 pares de fios trançados para cancelar interferência e diafonia (crosstalk). UTP (sem blindagem), STP (blindado), FTP (folha metálica). Conector RJ-45."], ["Categorias", "CAT5e 1 Gbps/100 MHz; CAT6 10 Gbps até 55 m/250 MHz; CAT6a 10 Gbps até 100 m/500 MHz; CAT7 10 Gbps/600 MHz."], ["Fibra óptica", "Pulsos de luz num núcleo de vidro com cladding (reflexão interna total). Monomodo (9 µm, dezenas de km) e multimodo (50–62,5 µm, até 2 km). Imune a EMI."], ["T568B", "1 branco-laranja · 2 laranja · 3 branco-verde · 4 azul · 5 branco-azul · 6 verde · 7 branco-marrom · 8 marrom."], ["Direto × cruzado", "Direto: mesmo padrão nas duas pontas (PC–switch). Cruzado: T568A numa ponta e T568B na outra. Auto-MDIX torna o cruzado pouco necessário."]], "historia": "No térreo, a **Camada Física**, Paco vira sinais elétricos e viaja pelo par trançado, “como dentro de uma corda”, com os pares trançados protegendo-o das interferências. Mais adiante, na fibra óptica, ele vira um pulso de luz que ricocheteia no vidro, sem que nenhum raio ou motor o perturbe.", "historiaTitulo": "A jornada de Paco", "caderno": [{"q": "Qual é a função da camada física e o que a escolha do meio afeta?", "a": "Transmitir os bits brutos (zeros e uns) pelo meio físico. A escolha do meio afeta a velocidade, a distância máxima e a confiabilidade.", "t": "Discursiva"}, {"q": "Descreva as quatro partes do cabo coaxial, de dentro para fora.", "a": "Condutor central de cobre, isolamento dielétrico, malha metálica (blindagem contra interferência) e capa externa de plástico (jaqueta).", "t": "Discursiva"}, {"q": "Cite uma vantagem e uma desvantagem do coaxial e onde ele ainda é usado.", "a": "Vantagem: boa blindagem contra EMI, alcançando distâncias maiores que o UTP. Desvantagem: mais caro, grosso e pouco flexível. Ainda é usado em TV a cabo e internet banda larga da operadora.", "t": "Discursiva"}, {"q": "Por que os fios do par trançado são trançados?", "a": "Trançar os pares ajuda a cancelar a interferência eletromagnética externa e a diafonia (crosstalk) entre pares vizinhos.", "t": "Discursiva"}, {"q": "Diferencie UTP, STP e FTP e indique onde usar cada um.", "a": "UTP: sem blindagem, o mais comum, casas e escritórios. STP: blindagem metálica, ambientes com muito ruído elétrico, como fábricas. FTP: folha metálica geral, proteção intermediária.", "t": "Comparação"}, {"q": "Complete a tabela de categorias: velocidade, frequência e uso de CAT5e, CAT6, CAT6a e CAT7.", "a": "CAT5e: 1 Gbps, 100 MHz, casas e pequenos escritórios. CAT6: 10 Gbps até 55 m, 250 MHz, redes corporativas. CAT6a: 10 Gbps até 100 m, 500 MHz, data centers. CAT7: 10 Gbps, 600 MHz, ambientes industriais.", "t": "Tabela"}, {"q": "Explique como a luz se mantém dentro da fibra óptica.", "a": "O núcleo de vidro ou plástico é cercado pelo revestimento (cladding), que reflete a luz de volta para o núcleo: é a reflexão interna total.", "t": "Discursiva"}, {"q": "Compare fibra monomodo e multimodo.", "a": "Monomodo: núcleo muito fino (9 µm), dezenas de km, telecomunicações de longa distância. Multimodo: núcleo mais grosso (50 a 62,5 µm), até 2 km, redes locais de alta velocidade.", "t": "Comparação"}, {"q": "Cite três vantagens e duas desvantagens da fibra óptica.", "a": "Vantagens: largura de banda altíssima (Tbps), longas distâncias, imunidade total a EMI, alta segurança. Desvantagens: custo maior, mais frágil, exige equipamento e mão de obra especializados.", "t": "Discursiva"}, {"q": "Escreva de memória a sequência de cores do padrão T568B, do pino 1 ao 8.", "a": "1 branco-laranja, 2 laranja, 3 branco-verde, 4 azul, 5 branco-azul, 6 verde, 7 branco-marrom, 8 marrom.", "t": "Memorização"}, {"q": "Qual a diferença entre cabo direto e cabo cruzado? Por que o cruzado quase não é mais usado?", "a": "Direto: o mesmo padrão nas duas pontas, para ligar dispositivos diferentes (PC–switch, switch–roteador). Cruzado: T568A numa ponta e T568B na outra, para ligar iguais (PC–PC). A função Auto-MDIX dos equipamentos modernos detecta e ajusta automaticamente.", "t": "Discursiva"}, {"q": "Liste as ferramentas e materiais para montar um cabo de rede.", "a": "Cabo de par trançado (CAT5e ou CAT6), conectores RJ-45, alicate de crimpagem, decapador e testador de cabo.", "t": "Discursiva"}, {"q": "Descreva os 7 passos da crimpagem.", "a": "1) Decapar 2 a 3 cm da capa. 2) Destrançar e organizar no T568B. 3) Alinhar e cortar deixando cerca de 1,2 cm. 4) Inserir no RJ-45 com o clipe para baixo até o fim, com a capa entrando um pouco. 5) Crimpar com firmeza. 6) Repetir na outra ponta (mesmo padrão para cabo direto). 7) Testar: LEDs de 1 a 8 em sequência.", "t": "Procedimento"}, {"q": "Calcule: 20 computadores, 8 m em média até o rack, folga de 2 m por cabo e 2 conectores extras por cabo. Quantos metros e quantos RJ-45?", "a": "Cabo: 20 × (8 + 2) = **200 m**. Conectores: cada cabo usa 2 + 2 extras = 4; 20 × 4 = **80 RJ-45**.", "t": "Cálculo"}], "flash": [{"f": "Camada Física", "b": "Transmite bits brutos pelo meio: cobre, luz ou ondas."}, {"f": "Coaxial", "b": "Cobre central + dielétrico + malha + capa. TV a cabo e banda larga."}, {"f": "Crosstalk", "b": "Diafonia: interferência de um par de fios sobre o par vizinho."}, {"f": "UTP", "b": "Unshielded Twisted Pair: par trançado sem blindagem, o mais comum."}, {"f": "STP", "b": "Shielded Twisted Pair: com blindagem metálica, para ambientes ruidosos."}, {"f": "CAT6a", "b": "10 Gbps até 100 m, 500 MHz. Data centers e alta performance."}, {"f": "Distância máxima do UTP", "b": "Até 100 metros por segmento."}, {"f": "Cladding", "b": "Revestimento da fibra que reflete a luz de volta ao núcleo."}, {"f": "Monomodo", "b": "Fibra de núcleo 9 µm, para dezenas de km."}, {"f": "T568B · pinos 1 a 4", "b": "Branco-laranja, laranja, branco-verde, azul."}, {"f": "T568B · pinos 5 a 8", "b": "Branco-azul, verde, branco-marrom, marrom."}, {"f": "Auto-MDIX", "b": "Função que ajusta a porta automaticamente e dispensa o cabo cruzado."}], "vf": [{"s": "O cabo coaxial ainda é o padrão para redes locais Ethernet modernas.", "v": false, "j": "Falso. Hoje o padrão das LANs é o **par trançado**. O coaxial segue em TV a cabo e banda larga da operadora."}, {"s": "O trançado dos fios ajuda a cancelar interferências e a diafonia.", "v": true, "j": "Verdadeiro. É por isso que o cabo se chama par trançado."}, {"s": "O cabo STP é o mais indicado para ambientes com muito ruído elétrico, como fábricas.", "v": true, "j": "Verdadeiro. A blindagem metálica protege contra interferência."}, {"s": "O CAT6 alcança 10 Gbps em até 100 metros.", "v": false, "j": "Falso. O CAT6 alcança 10 Gbps só **até 55 m**. Para 10 Gbps em 100 m, usa-se **CAT6a**."}, {"s": "O conector RJ-45 tem 8 pinos, um para cada fio do cabo.", "v": true, "j": "Verdadeiro. São os 8 fios dos 4 pares."}, {"s": "A fibra óptica transmite sinais elétricos por um núcleo de cobre.", "v": false, "j": "Falso. A fibra transmite **pulsos de luz** por um núcleo de vidro ou plástico."}, {"s": "A fibra óptica é imune a interferências eletromagnéticas.", "v": true, "j": "Verdadeiro. Por transmitir luz, não sofre EMI."}, {"s": "A fibra multimodo é a mais indicada para dezenas de quilômetros.", "v": false, "j": "Falso. Para longas distâncias usa-se a **monomodo**. A multimodo vai até cerca de 2 km."}, {"s": "No padrão T568B, o pino 1 é branco-laranja e o pino 2 é laranja.", "v": true, "j": "Verdadeiro."}, {"s": "No padrão T568B, o pino 4 é verde.", "v": false, "j": "Falso. O pino 4 é **azul**. O verde fica no pino 6."}, {"s": "O cabo direto usa o mesmo padrão nas duas pontas e liga um computador a um switch.", "v": true, "j": "Verdadeiro."}, {"s": "Se o testador acender os LEDs fora de ordem, o cabo está bom, só mais lento.", "v": false, "j": "Falso. LED apagado ou fora de ordem indica erro de montagem: o cabo **precisa ser refeito**."}], "pbl": [{"titulo": "Cabeando o novo laboratório", "duracao": "3 aulas (inclui prática)", "cenario": "O campus recebeu 20 computadores para um novo laboratório. O switch ficará num rack no centro da sala e a distância média até cada mesa é de 8 m. A direção quer uma lista de compras e cabos montados pela própria turma.", "problema": "Que cabo comprar, quanto material pedir e como garantir que todos os cabos montados funcionem?", "perguntas": ["CAT5e, CAT6 ou CAT6a: qual atende hoje e daqui a alguns anos, dentro do orçamento?", "Quantos metros de cabo e quantos conectores comprar, com folga?", "Qual padrão de pinagem usar e por quê?", "Como registrar os testes de cada cabo?"], "entregaveis": ["Lista de compras com quantidades e justificativa da categoria", "Pelo menos 2 cabos montados por dupla, testados", "Ficha de teste: cabo, resultado dos LEDs 1 a 8, refeito (sim/não)"], "solucao": ["Categoria: **CAT6** atende bem estações a 1 Gbps e oferece margem; CAT6a se o orçamento permitir 10 Gbps a 100 m.", "Material: 20 × (8 + 2) = **200 m** de cabo; 20 × 4 = **80 conectores RJ-45**; ferramentas: alicate, decapador, testador.", "Pinagem: **T568B** nas duas pontas (cabo direto), padrão mais usado no Brasil.", "Teste: LEDs de 1 a 8 em sequência; qualquer falha, refazer a ponta e testar de novo."]}, {"titulo": "Qual cabo para cada lugar?", "duracao": "2 aulas", "cenario": "Uma escola rural tem três prédios. O prédio administrativo fica a 600 m da biblioteca, há uma oficina mecânica com motores elétricos ao lado do laboratório e a sala dos professores fica a 30 m do rack.", "problema": "Qual meio físico usar em cada trecho, considerando distância, interferência e custo?", "perguntas": ["Qual o limite de distância do par trançado?", "Qual meio resiste à interferência da oficina?", "Monomodo ou multimodo para 600 m?", "Onde o custo pesa mais que o desempenho?"], "entregaveis": ["Mapa dos prédios com o meio escolhido em cada trecho", "Tabela comparativa coaxial × par trançado × fibra", "Justificativa de cada escolha em até 5 linhas"], "solucao": ["Sala dos professores (30 m): **UTP CAT6**, barato e dentro dos 100 m.", "Laboratório ao lado da oficina: **STP** ou fibra, para resistir ao ruído elétrico dos motores.", "Prédio administrativo à biblioteca (600 m): **fibra óptica**; multimodo atende até cerca de 2 km, imune a EMI e com alta capacidade.", "O coaxial não entra nas escolhas para LAN; aparece só se a operadora entregar internet por cabo."]}], "lab": ["crimp", "cables"]}], "comoEstudar": "Escolha um módulo. Leia o **Resumo**, explore o **Laboratório visual**, responda o **Caderno** à mão, revise com os **Flashcards**, treine o **V ou F** escrevendo a justificativa e resolva o **PBL** em equipe. As respostas só aparecem depois que você tenta."};
