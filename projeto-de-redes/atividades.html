<script>
const COURSE = {"id": "projeto-redes-v1", "eyebrow": "Disciplina · Projeto de Redes", "titulo": "Projeto de Redes", "autor": "Prof. Eber Santana", "curso": "Projeto de Redes de Computadores", "apresentacao": "Cinco módulos que seguem a metodologia **Top-Down**: das metas do negócio ao teste e à documentação da rede, acompanhando **Leo**, um técnico recém-formado, e suas mentoras Clara e Ana em projetos reais.", "referencias": ["OPPENHEIMER, P. *Top-Down Network Design*. 3. ed. Cisco Press, 2011.", "ABNT NBR 14565 — Cabeamento estruturado para edifícios comerciais.", "ANSI/TIA-568 — Commercial Building Telecommunications Cabling Standard.", "SANTANA, E. *E-book: Projeto de Redes de Computadores* e *Storytelling de Projeto de Redes*."], "modulos": [{"id": "p1", "titulo": "Metodologia Top-Down", "subtitulo": "Capítulo 1 · metas, desempenho, baseline e tráfego", "objetivo": "Aplicar a metodologia Top-Down: transformar metas e restrições do negócio em requisitos técnicos, definir parâmetros de desempenho, caracterizar a rede existente e analisar o tráfego.", "resumo": [["Top-Down × Bottom-Up", "Top-Down começa pelas metas do negócio e pelos usuários; Bottom-Up começa pelos cabos e equipamentos. Em projetos complexos, Top-Down é mais seguro."], ["Metas e restrições", "Metas: o que a organização quer alcançar. Restrições: orçamento, prazo, pessoal técnico e políticas. Juntas geram os requisitos técnicos."], ["Parâmetros de desempenho", "Largura de banda (capacidade), vazão (taxa real), latência (ms), jitter (variação da latência) e disponibilidade (em “noves”)."], ["Baseline", "Raio-x da rede atual: diagramas físico e lógico, inventário de ativos e dados de desempenho. Ferramentas: Zabbix, Grafana, PRTG, Wireshark, ping, traceroute, snmpwalk."], ["Análise de tráfego", "Quais aplicações, quem usa, de onde para onde e em que horário. NetFlow, sFlow e J-Flow coletam os fluxos; o resultado orienta QoS ou upgrade de link."], ["Ciclo", "O projeto não termina na implementação: monitorar, analisar e otimizar continuamente."]], "historia": "Leo, recém-contratado pela Inovatech, quer começar passando cabos Cat6a e configurando o switch. Clara, a diretora de tecnologia, o interrompe: “Você está pensando nos tijolos antes de ter a planta da casa”. O primeiro passo não é conectar um cabo. É **conversar** com a CEO, com o financeiro e com os usuários.", "historiaTitulo": "A saga de Leo", "caderno": [{"q": "Explique a diferença entre as abordagens Top-Down e Bottom-Up no projeto de redes.", "a": "Top-Down começa pelo topo: objetivos do negócio e necessidades dos usuários, depois a parte lógica e só no fim a física. Bottom-Up começa pelos cabos e equipamentos. O Top-Down garante que cada decisão técnica sirva a um propósito.", "t": "Discursiva"}, {"q": "Use a analogia da casa sem planta para justificar o Top-Down.", "a": "Construir sem planta leva a estrutura instável, cômodos mal distribuídos e problemas elétricos. Projetar rede sem método leva a redes lentas, inseguras e que não atendem ao usuário. O Top-Down é a planta.", "t": "Discursiva"}, {"q": "Diferencie metas de negócio e restrições, com dois exemplos de cada.", "a": "Metas: objetivos estratégicos (abrir filial, suportar videoconferência HD, melhorar a internet). Restrições: limites que moldam o projeto (orçamento, prazo, falta de pessoal técnico qualificado, políticas da empresa).", "t": "Comparação"}, {"q": "No caso da rede varejista com Wi-Fi em 50 lojas, liste um requisito técnico derivado e duas restrições.", "a": "Requisitos: até 100 usuários simultâneos por loja, captive portal para capturar dados, gerência centralizada na matriz. Restrições: até R$ 200.000, implementação em 3 meses, equipe local com pouco conhecimento (solução de fácil manutenção).", "t": "Estudo de caso"}, {"q": "Defina largura de banda, vazão, latência, jitter e disponibilidade.", "a": "Largura de banda: capacidade máxima do link (bps). Vazão: taxa real alcançada, geralmente menor. Latência: tempo da origem ao destino (ms). Jitter: variação da latência. Disponibilidade: porcentagem do tempo em que a rede funciona (ex.: 99,999%).", "t": "Conceitos"}, {"q": "Explique a analogia da rodovia para os parâmetros de desempenho.", "a": "Largura de banda é o número de pistas; vazão, os carros que realmente passam por hora; latência, o tempo total da viagem; jitter, a imprevisibilidade desse tempo (às vezes 30, às vezes 50 minutos).", "t": "Discursiva"}, {"q": "Quais parâmetros definir para videoconferência HD? E para um backup noturno?", "a": "Videoconferência: mínimo de 5 Mbps por usuário, latência até 150 ms, jitter até 30 ms e perda abaixo de 1%. Backup noturno: o principal é a vazão, para caber na janela de tempo; a latência importa pouco.", "t": "Aplicação"}, {"q": "O que é network baseline e por que é obrigatório?", "a": "É a documentação e análise da topologia, configuração e desempenho da rede existente. É obrigatório porque raramente se projeta do zero: é preciso conhecer o ponto de partida, os problemas e as oportunidades, como o médico que pede exames antes de diagnosticar.", "t": "Discursiva"}, {"q": "Quais três grupos de documentação são coletados na caracterização da rede existente?", "a": "Diagramas de rede (físico e lógico), inventário de ativos (modelos, versões, configurações) e análise de desempenho (uso médio e de pico, latência, CPU e memória dos equipamentos).", "t": "Discursiva"}, {"q": "Para que serve a análise de tráfego e quais tecnologias coletam os fluxos?", "a": "Para saber quais aplicações consomem a rede, quem usa, de onde para onde e em que horários, orientando QoS ou aumento de link. NetFlow, sFlow e J-Flow, embutidos em roteadores e switches.", "t": "Discursiva"}, {"q": "No caso da Clínica Saúde Plena, quais foram os quatro achados do diagnóstico?", "a": "Meta: PEP rápido e teleconsultas estáveis, crescimento de 20%, orçamento R$ 15.000, execução fora do expediente. Rede: um roteador doméstico e todos na mesma rede Wi-Fi. Link de 50 Mbps entregando 20 Mbps no pico. Tráfego: streaming de música e backups para o Google Drive durante o dia.", "t": "Estudo de caso"}, {"q": "Quais foram as quatro ações da solução para a Clínica Saúde Plena?", "a": "Link de fibra empresarial de 200 Mbps simétricos; firewall/roteador profissional com VLANs (administração, teleconsulta e visitantes com limite de banda); QoS priorizando PEP e teleconsultas; backups agendados após a meia-noite.", "t": "Discursiva"}, {"q": "Explique o erro “focar só na largura de banda” e como o Top-Down o evita.", "a": "A empresa contrata 1 Gbps e a lentidão continua, porque o problema era latência alta ou firewall subdimensionado. Analisar vários parâmetros (latência, jitter, vazão) dá o diagnóstico certo: não adianta alargar a rodovia se o asfalto é ruim ou o pedágio é lento.", "t": "Discursiva"}, {"q": "No escritório de contabilidade, 70% da banda era UDP na porta 443 saindo de um servidor interno. Qual a causa provável e o próximo passo?", "a": "UDP 443 é típico do QUIC, usado por serviços do Google. Provavelmente um cliente de sincronização em nuvem subindo arquivos no horário de trabalho. Próximo passo: acessar o servidor, ver serviços e logs e limitar a banda do software ou agendar a sincronização para a noite.", "t": "Diagnóstico"}], "flash": [{"f": "Top-Down", "b": "Projeto que começa pelas metas do negócio e pelos usuários e termina nos equipamentos."}, {"f": "Bottom-Up", "b": "Projeto que começa pelos cabos e equipamentos. Arriscado em redes complexas."}, {"f": "Restrição", "b": "Limite do projeto: orçamento, prazo, pessoal técnico, políticas."}, {"f": "Largura de banda", "b": "Capacidade máxima de transmissão de um link, em bps."}, {"f": "Vazão (throughput)", "b": "Taxa real de transferência, normalmente menor que a largura de banda."}, {"f": "Latência", "b": "Tempo que o pacote leva da origem ao destino, em ms."}, {"f": "Jitter", "b": "Variação da latência. Crítico para voz e vídeo."}, {"f": "Disponibilidade", "b": "Porcentagem do tempo em que a rede funciona. Ex.: 99,999% (“cinco noves”)."}, {"f": "Network baseline", "b": "Raio-x documentado da rede existente: topologia, configuração e desempenho."}, {"f": "NetFlow / sFlow", "b": "Tecnologias de roteadores e switches que coletam dados sobre os fluxos de tráfego."}, {"f": "QoS", "b": "Qualidade de Serviço: prioriza um tipo de tráfego (ex.: ERP) sobre outros."}, {"f": "Links simétricos", "b": "Mesma velocidade de download e de upload."}], "vf": [{"s": "Na metodologia Top-Down, a escolha dos equipamentos é uma das primeiras decisões do projeto.", "v": false, "j": "Falso. A escolha de hardware é uma das **últimas** decisões: só acontece depois das metas, dos requisitos e da análise de tráfego."}, {"s": "Orçamento, prazo e equipe técnica limitada são exemplos de restrições do projeto.", "v": true, "j": "Verdadeiro. As restrições moldam as soluções possíveis."}, {"s": "Vazão e largura de banda são sinônimos.", "v": false, "j": "Falso. Largura de banda é a **capacidade** máxima; vazão é a **taxa real** alcançada, geralmente menor."}, {"s": "Jitter é a variação da latência e é crítico para voz e vídeo.", "v": true, "j": "Verdadeiro."}, {"s": "Para um backup noturno, a latência é o parâmetro mais crítico.", "v": false, "j": "Falso. No backup noturno o mais importante é a **vazão**, para transferir tudo dentro da janela de tempo."}, {"s": "Uma disponibilidade de 99,999% é chamada de “cinco noves”.", "v": true, "j": "Verdadeiro."}, {"s": "Como quase todo projeto é feito do zero, a caracterização da rede existente é opcional.", "v": false, "j": "Falso. É raro projetar do zero; a caracterização (baseline) é um passo **obrigatório**."}, {"s": "Wireshark, Zabbix, Grafana e PRTG ajudam a caracterizar a rede existente.", "v": true, "j": "Verdadeiro, junto com ping, traceroute e snmpwalk."}, {"s": "A análise de tráfego pode justificar tanto uma política de QoS quanto a contratação de um link maior.", "v": true, "j": "Verdadeiro. Depende de o tráfego ser legítimo para o negócio ou não."}, {"s": "Se a rede está lenta, aumentar a velocidade do link sempre resolve.", "v": false, "j": "Falso. A causa pode ser **latência** alta ou um firewall subdimensionado; é preciso analisar vários parâmetros."}, {"s": "Na Clínica Saúde Plena, a solução incluiu uma rede de visitantes com limite de banda.", "v": true, "j": "Verdadeiro. A VLAN de visitantes separa pacientes e celulares pessoais da rede do PEP."}, {"s": "O projeto de rede termina quando a rede é implementada.", "v": false, "j": "Falso. O projeto é um **ciclo** contínuo de monitoramento, análise e otimização."}], "pbl": [{"titulo": "Aulas ao vivo para 500 alunos", "duracao": "3 aulas", "cenario": "Uma universidade quer transmitir aulas ao vivo em HD para 500 alunos ao mesmo tempo. Os alunos interagem por chat e enviam arquivos de até 50 MB. O orçamento é limitado, a equipe de TI é pequena e tudo precisa estar pronto antes do próximo semestre.", "problema": "Como aplicar o Top-Down para transformar esse desejo em metas, restrições e requisitos técnicos mensuráveis?", "perguntas": ["Quais são as metas de negócio por trás das aulas online?", "Quais restrições limitam a solução?", "Quanta banda 500 transmissões HD exigem (considere 4 Mbps cada)?", "Como reduzir a carga no servidor central e o esforço da equipe pequena?"], "entregaveis": ["Quadro com pelo menos 3 metas, 3 restrições e 4 requisitos", "Cálculo da banda necessária", "Mapa Top-Down: negócio → requisitos → lógica → física"], "solucao": ["Metas: expandir o alcance para outras cidades, criar nova fonte de receita, manter a qualidade de ensino.", "Restrições: orçamento limitado, equipe de TI enxuta, prazo até o início do semestre.", "Banda: 500 × 4 Mbps = **2 Gbps**, mais o tráfego de chat e arquivos.", "Requisitos: baixa latência e jitter, uso de **CDN** para aliviar o servidor e aproximar o conteúdo, plataforma de gerência centralizada para a equipe pequena."]}, {"titulo": "A internet da clínica caiu de novo", "duracao": "2 aulas", "cenario": "A Clínica Saúde Plena (30 funcionários) tem o prontuário eletrônico (PEP) na nuvem lento e teleconsultas que caem. Há um único roteador doméstico, todos no mesmo Wi-Fi, link de 50 Mbps que entrega 20 Mbps no pico, streaming de música nos consultórios e backups durante o dia. Orçamento: R$ 15.000; obras só fora do expediente.", "problema": "Quais parâmetros de desempenho definir e qual solução propor, respeitando orçamento e horário?", "perguntas": ["Quais metas e restrições a clínica tem?", "Que latência, banda e jitter o PEP e a teleconsulta exigem?", "O que o baseline e a análise de tráfego revelam?", "Quais ações resolvem o problema sem estourar o orçamento?"], "entregaveis": ["Tabela de parâmetros por aplicação", "Diagnóstico com as causas", "Plano de ação com custos estimados e cronograma fora do expediente"], "solucao": ["Parâmetros: PEP com latência máxima de 50 ms; teleconsulta com 2 Mbps dedicados por sessão, latência até 100 ms e jitter abaixo de 20 ms.", "Causas: rede plana sem separação, roteador doméstico, vazão real baixa no pico, tráfego não essencial (streaming e backups) no horário de atendimento.", "Solução: link de fibra empresarial de 200 Mbps simétricos; firewall profissional com VLANs (administração, teleconsulta, visitantes com limite de banda); QoS priorizando PEP e teleconsulta; backups após a meia-noite."]}], "lab": ["topdown", "perf"]}, {"id": "p2", "titulo": "Projeto da Rede Lógica", "subtitulo": "Capítulo 2 · topologia, redundância, segmentação e protocolos", "objetivo": "Projetar a rede lógica: escolher a topologia, planejar balanceamento e caminhos de backup, aplicar multihoming, NAT, DMZ, VLAN e VPN, definir endereçamento e nomenclatura, estratégias de segurança e gerência e protocolos de comutação e roteamento.", "resumo": [["Topologias", "Estrela: ponto central, falha dele para tudo. Malha: vários caminhos, alta confiabilidade. Barramento: um cabo compartilhado, falha nele derruba tudo."], ["Redundância", "Balanceamento de carga distribui acessos entre servidores. Caminho de backup assume quando o principal falha (ex.: dois links)."], ["Multihoming e NAT", "Multihoming: mais de um provedor ao mesmo tempo. NAT: vários dispositivos privados compartilham um IP público."], ["DMZ, VLAN e VPN", "DMZ isola servidores públicos da rede interna. VLAN divide uma rede física em redes lógicas. VPN cria túnel criptografado pela internet."], ["Endereços e nomes", "Plano IP com espaço para crescer (ex.: `10.10.0.0/16`) e nomes padronizados como `BR-SP-FIN-SRV01`."], ["Protocolos", "STP evita loops na camada 2. OSPF calcula as melhores rotas dentro da empresa. BGP escolhe caminhos entre provedores, por políticas."]], "historia": "Na ConectaTudo, Ana mostra a Leo que uma boa rede é uma “arquitetura invisível”. Semanas depois da entrega, uma obra rompe a fibra do provedor principal e um servidor web queima. O tráfego passa sozinho para o segundo provedor, o balanceador tira o servidor defeituoso do grupo, e **ninguém na empresa percebe nada**.", "historiaTitulo": "A saga de Leo", "caderno": [{"q": "O que é topologia de rede e quais são suas duas dimensões?", "a": "É o mapa de como os nós estão conectados. Tem a dimensão física (cabos) e a lógica (fluxo de dados).", "t": "Discursiva"}, {"q": "Compare estrela, malha e barramento quanto ao ponto de falha.", "a": "Estrela: falha num dispositivo não afeta os outros, mas a falha do ponto central paralisa a rede. Malha: múltiplos caminhos, alta confiabilidade, usada em ambientes críticos como aeroportos. Barramento: um cabo compartilhado; se ele falhar, a rede toda cai.", "t": "Comparação"}, {"q": "Diferencie balanceamento de carga e caminho de backup, com um exemplo de cada.", "a": "Balanceamento distribui o tráfego entre vários servidores para evitar sobrecarga (e-commerce na Black Friday). Caminho de backup é uma rota alternativa que assume se a principal falhar (segundo link de internet).", "t": "Discursiva"}, {"q": "O que é multihoming e qual a analogia usada?", "a": "Conectar a rede a mais de um provedor ao mesmo tempo, para redundância e otimização. É como ter duas portas de casa dando para ruas diferentes.", "t": "Discursiva"}, {"q": "Explique o NAT com a analogia do recepcionista.", "a": "O NAT permite que vários dispositivos privados compartilhem um único IP público. Para fora, toda a correspondência vai para o endereço do prédio (IP público); o recepcionista (roteador) sabe para qual sala (dispositivo) entregar.", "t": "Discursiva"}, {"q": "O que é uma DMZ e por que usar uma em vez de redirecionar uma porta para um servidor interno?", "a": "É uma sub-rede isolada que hospeda servidores públicos (como o site), separada da rede interna. Redirecionar porta para um servidor interno expõe a rede interna; na DMZ, um invasor que comprometa o servidor público não chega direto aos escritórios.", "t": "Discursiva"}, {"q": "O que é uma VLAN e quais dois benefícios ela traz?", "a": "Uma rede local virtual que segmenta uma rede física em várias redes lógicas independentes. Benefícios: segurança (isolamento) e organização (e melhor desempenho, por reduzir o tráfego desnecessário).", "t": "Discursiva"}, {"q": "Para que serve uma VPN e qual a analogia do carro-forte?", "a": "Cria um túnel seguro e criptografado sobre a internet pública para acessar uma rede privada. É como mandar um cartão-postal num cofre lacrado dentro de um carro-forte: mesmo interceptado, ninguém lê.", "t": "Discursiva"}, {"q": "Interprete o nome `BR-SP-FIN-SRV01` e explique a vantagem de uma nomenclatura padronizada.", "a": "Brasil, São Paulo, Financeiro, Servidor 01. Um nome padronizado revela na hora localização, departamento e função, o que facilita a gerência, bem mais do que lembrar um IP.", "t": "Discursiva"}, {"q": "O que é defesa em camadas? Dê quatro exemplos de barreiras.", "a": "Usar várias barreiras de segurança combinadas: firewall no perímetro, VLANs para segmentar, antivírus nos dispositivos e autenticação de dois fatores.", "t": "Discursiva"}, {"q": "Qual a diferença entre protocolos de comutação e de roteamento?", "a": "Comutação atua dentro da mesma rede local (camada 2), como o carteiro no bairro. Roteamento encontra o melhor caminho entre redes diferentes (camada 3), como o centro de distribuição entre cidades.", "t": "Discursiva"}, {"q": "Qual problema o STP resolve e como?", "a": "Em redes com caminhos redundantes na camada 2, os quadros podem circular em loop infinito (tempestade de broadcast). O STP bloqueia temporariamente uma das rotas; se a principal falhar, desbloqueia a de backup.", "t": "Discursiva"}, {"q": "Compare OSPF e BGP.", "a": "OSPF é o “GPS interno” da empresa: calcula a rota mais rápida dentro da própria rede; os roteadores trocam seus mapas e calculam juntos. BGP é o protocolo da internet: escolhe caminhos entre grandes redes (provedores) com base em políticas e acordos.", "t": "Comparação"}, {"q": "Descreva a solução lógica da startup de 50 funcionários em dois andares com site próprio.", "a": "Topologia em estrela (roteador principal e switch por andar); endereçamento `10.10.0.0/16` para crescer; VLANs por departamento (Engenharia, Vendas, Administração); site na DMZ; dois provedores (multihoming) com BGP; VPN para home office.", "t": "Estudo de caso"}], "flash": [{"f": "Topologia em estrela", "b": "Todos ligados a um ponto central. Se o centro falha, a rede para."}, {"f": "Topologia em malha", "b": "Cada nó ligado a vários outros. Múltiplos caminhos, alta confiabilidade."}, {"f": "Balanceamento de carga", "b": "Distribui o tráfego entre vários servidores para evitar sobrecarga."}, {"f": "Failover", "b": "Passagem automática para o caminho ou equipamento de backup quando o principal falha."}, {"f": "Multihoming", "b": "Rede ligada a mais de um provedor de internet ao mesmo tempo."}, {"f": "NAT", "b": "Vários dispositivos privados saem para a internet com um único IP público."}, {"f": "DMZ", "b": "Sub-rede isolada para servidores públicos, separada da rede interna."}, {"f": "VLAN", "b": "Rede lógica independente criada dentro de uma rede física."}, {"f": "VPN", "b": "Túnel criptografado sobre a internet para acessar uma rede privada."}, {"f": "STP", "b": "Spanning Tree Protocol: bloqueia caminhos redundantes para evitar loops na camada 2."}, {"f": "OSPF", "b": "Protocolo de roteamento interno que calcula o caminho mais curto."}, {"f": "BGP", "b": "Protocolo de roteamento entre provedores, baseado em políticas."}], "vf": [{"s": "Na topologia em estrela, a falha do ponto central paralisa toda a rede.", "v": true, "j": "Verdadeiro. É o ponto único de falha dessa topologia."}, {"s": "A topologia em barramento é a mais indicada para ambientes críticos, como aeroportos.", "v": false, "j": "Falso. Ambientes críticos usam **malha**, que oferece vários caminhos. No barramento, uma falha no cabo derruba tudo."}, {"s": "O balanceamento de carga distribui acessos entre vários servidores.", "v": true, "j": "Verdadeiro. Evita que um único servidor fique sobrecarregado."}, {"s": "Multihoming significa usar várias VLANs dentro do mesmo switch.", "v": false, "j": "Falso. Multihoming é ligar a rede a **mais de um provedor** de internet."}, {"s": "O NAT permite que vários dispositivos com IP privado compartilhem um único IP público.", "v": true, "j": "Verdadeiro."}, {"s": "Servidores internos podem ser expostos com segurança à internet por simples redirecionamento de porta.", "v": false, "j": "Falso. Isso é um risco enorme; o correto é colocar os servidores públicos numa **DMZ**."}, {"s": "Uma VLAN divide uma rede física em várias redes lógicas isoladas.", "v": true, "j": "Verdadeiro. É como usar biombos para dividir um salão."}, {"s": "Uma VPN dispensa criptografia porque usa um cabo exclusivo entre os escritórios.", "v": false, "j": "Falso. A VPN roda **sobre a internet pública** e depende de criptografia para formar o túnel seguro."}, {"s": "O STP evita que quadros fiquem circulando em loop em redes com caminhos redundantes.", "v": true, "j": "Verdadeiro. Ele bloqueia temporariamente uma das rotas."}, {"s": "O OSPF é o protocolo usado entre grandes provedores da internet.", "v": false, "j": "Falso. Entre provedores usa-se o **BGP**. O OSPF é usado **dentro** da rede da empresa."}, {"s": "Uma rede “plana”, sem VLANs, é mais segura porque é mais simples.", "v": false, "j": "Falso. A rede plana gera **insegurança** e baixo desempenho; a correção é segmentar com VLANs."}, {"s": "Uma nomenclatura padronizada facilita a gerência da rede.", "v": true, "j": "Verdadeiro. O nome já revela local, setor e função do equipamento."}], "pbl": [{"titulo": "A nova sede da ConectaTudo", "duracao": "3 aulas", "cenario": "A ConectaTudo, startup de 50 funcionários, vai ocupar dois andares com Engenharia, Vendas e Administração. Ela hospeda o próprio site, tem vendedores em home office e não pode ficar fora do ar se um provedor falhar.", "problema": "Como desenhar a rede lógica da nova sede: topologia, segmentação, endereçamento, redundância e acesso remoto?", "perguntas": ["Qual topologia usar e onde ficam os switches?", "Quantas VLANs criar e qual plano de IPs deixa espaço para crescer?", "Onde colocar o servidor do site?", "Como manter a empresa online se um provedor cair?", "Como os vendedores remotos entram na rede com segurança?"], "entregaveis": ["Diagrama lógico com VLANs, DMZ e links", "Plano de endereçamento por VLAN", "Padrão de nomes para os equipamentos", "Justificativa de cada protocolo escolhido (STP, OSPF, BGP)"], "solucao": ["Topologia em estrela: roteador/firewall principal e um switch por andar; links redundantes entre switches protegidos pelo **STP**.", "VLANs: Engenharia, Vendas, Administração e Visitantes; bloco `10.10.0.0/16` dividido por VLAN (ex.: `10.10.10.0/24`, `10.10.20.0/24`…).", "Servidor do site na **DMZ**, separado da rede interna.", "Dois provedores (**multihoming**) com **BGP** para balancear e ter caminho de backup; **OSPF** internamente.", "**VPN** de acesso remoto para os vendedores; nomes como `BR-SE-ENG-SW01`."]}, {"titulo": "Três redes numa clínica", "duracao": "2 aulas", "cenario": "Uma clínica médica usa uma única rede para os computadores da recepção, os prontuários dos médicos e o Wi-Fi dos pacientes. Um contador acessa arquivos da clínica de casa, e a loja online de produtos da clínica caiu na última promoção por excesso de acessos.", "problema": "Quais conceitos da rede lógica resolvem os três problemas: dados expostos, acesso remoto inseguro e site que cai?", "perguntas": ["Qual o risco de pacientes na mesma rede dos prontuários?", "Como o contador acessa os arquivos com segurança?", "Como evitar que a loja caia no pico de acessos?", "Onde entram DMZ e NAT nesse desenho?"], "entregaveis": ["Diagrama antes e depois", "Tabela problema → conceito → solução", "Parágrafo explicando a solução para a dona da clínica, sem jargão"], "solucao": ["Dados expostos: criar **três VLANs** isoladas (administração, médicos e visitantes/Wi-Fi).", "Acesso remoto: **VPN**, o túnel criptografado que funciona como carro-forte para os dados.", "Site que cai: **balanceador de carga** distribuindo os acessos entre vários servidores, com escalabilidade horizontal no pico.", "A loja fica na **DMZ**; o **NAT** permite que toda a rede interna saia com um IP público."]}], "lab": ["topology", "zones"]}, {"id": "p3", "titulo": "Projeto da Rede Física", "subtitulo": "Capítulo 3 · cabeamento estruturado, LAN e WAN", "objetivo": "Projetar a infraestrutura física: cabeamento estruturado segundo as normas, seleção de tecnologias de LAN (Ethernet, Wi-Fi, switches, PoE) e de WAN (links dedicados, MPLS, VPN).", "resumo": [["Cabeamento estruturado", "Metodologia padronizada e hierárquica: backbone (vertical) e cabeamento horizontal até as áreas de trabalho. Normas ABNT NBR 14565 e ANSI/TIA-568."], ["Componentes", "Patch panels, tomadas de telecomunicações, racks e patch cords, além dos cabos de par trançado e fibra."], ["LAN com fio", "Fast Ethernet 100 Mbps, Gigabit 1 Gbps, 10 Gigabit 10 Gbps. Comum: 1 Gbps nas estações e 10 Gbps em servidores e backbone."], ["Switches e PoE", "Escolha por portas, velocidade, gerenciamento e PoE, que alimenta telefones IP, câmeras e APs pelo cabo de rede."], ["WAN", "Link dedicado de fibra: máximo desempenho e custo. MPLS: rede privada da operadora com QoS. VPN site-to-site: ótimo custo-benefício, depende da internet."], ["Investimento", "Cabeamento é investimento de 10 a 15 anos. Economizar em categoria inferior sai mais caro depois."]], "historia": "Leo e Ana projetam a sede da InovaTech: Cat6a em todo o escritório, rack de 42U numa sala climatizada, duas tomadas por mesa, backbone de fibra entre os andares, switches Gigabit com PoE, APs Wi-Fi 6 e dois links: fibra de 1 Gbps e rádio de 200 Mbps como backup.", "historiaTitulo": "A saga de Leo", "caderno": [{"q": "Defina cabeamento estruturado e explique por que ele é hierárquico.", "a": "Metodologia padronizada para instalar a infraestrutura de cabos (dados, telefonia e outras mídias) num prédio ou campus. É hierárquico porque organiza a rede em backbone (vertical), que liga salas de equipamentos, e cabeamento horizontal, que chega às áreas de trabalho.", "t": "Discursiva"}, {"q": "Explique a analogia do sistema circulatório para o cabeamento estruturado.", "a": "O coração é o rack ou sala de equipamentos; as artérias principais são o backbone vertical; os vasos menores são o cabeamento horizontal; as partes do corpo são as áreas de trabalho e os dispositivos.", "t": "Discursiva"}, {"q": "Quais são as normas de cabeamento citadas e por que são importantes?", "a": "ABNT NBR 14565 (Brasil) e ANSI/TIA-568 (internacional). Definem boas práticas de projeto e instalação e garantem confiabilidade e compatibilidade com vários equipamentos e aplicações.", "t": "Discursiva"}, {"q": "Liste os componentes do cabeamento estruturado além dos cabos.", "a": "Patch panels (painéis de conexão), tomadas de telecomunicações nas áreas de trabalho, racks e patch cords (cordões de manobra).", "t": "Discursiva"}, {"q": "Onde usar par trançado e onde usar fibra óptica num prédio?", "a": "Par trançado (Cat6, Cat6a) no cabeamento horizontal até as mesas. Fibra no backbone vertical entre andares e entre prédios de um campus, pela distância, velocidade e imunidade a interferência.", "t": "Discursiva"}, {"q": "Quais são as velocidades Ethernet disponíveis e qual configuração é comum em escritórios?", "a": "Fast Ethernet 100 Mbps, Gigabit 1 Gbps e 10 Gigabit 10 Gbps. Comum: Gigabit nas estações e 10 Gigabit para servidores e backbone.", "t": "Discursiva"}, {"q": "Quais critérios usar para escolher um switch?", "a": "Número de portas, velocidade de cada porta, se precisa ser gerenciável e se deve fornecer PoE para telefones IP, câmeras e pontos de acesso.", "t": "Discursiva"}, {"q": "O que é PoE e qual vantagem ele trouxe no projeto da InovaTech?", "a": "Power over Ethernet: alimentação elétrica pelo próprio cabo de rede. Na InovaTech alimentou telefones VoIP e câmeras IP, simplificando a instalação (sem tomada elétrica em cada ponto).", "t": "Discursiva"}, {"q": "Compare link dedicado, MPLS e VPN como tecnologias de WAN.", "a": "Link dedicado de fibra: conexão privada e exclusiva, maior desempenho e confiabilidade, mais caro. MPLS: rede privada virtual da operadora, alto desempenho e QoS, bom para filiais com VoIP e vídeo. VPN: túnel criptografado sobre a internet, ótimo custo-benefício, desempenho depende da internet.", "t": "Comparação"}, {"q": "Quando a VPN sobre a internet não é a melhor escolha de WAN?", "a": "Quando há aplicações críticas sensíveis a latência e perda (sistemas em tempo real, videoconferência de alta qualidade entre matriz e filial), porque a internet pública não dá garantias. Aí o MPLS pode ser necessário.", "t": "Discursiva"}, {"q": "Descreva as decisões de WAN da InovaTech.", "a": "VPN de acesso remoto para os vendedores em outros estados; para a internet, dois provedores diferentes: fibra de 1 Gbps como principal e rádio de 200 Mbps como backup (failover).", "t": "Estudo de caso"}, {"q": "Por que “economizar no cabeamento” é um equívoco?", "a": "O cabeamento é a fundação da rede e dura de 10 a 15 anos. Categoria inferior ou instalação fora das normas trazem problemas de desempenho, diagnóstico difícil e custo muito maior para refazer depois.", "t": "Discursiva"}, {"q": "Recomende cabeamento, LAN e WAN para uma clínica de 15 funcionários com prontuário eletrônico e Wi-Fi para pacientes.", "a": "Cabeamento Cat6 certificado. LAN: switches Gigabit com PoE; dois APs Wi-Fi 6, um para funcionários (WPA3) e outro em VLAN separada para pacientes, com portal cativo. WAN: fibra de 300 a 500 Mbps e VPN de acesso remoto para os médicos.", "t": "Projeto"}, {"q": "Uma empresa com switches Gigabit e computadores novos acha a rede lenta. O cabo é Cat5, de 10 anos atrás. Qual a causa e a solução?", "a": "O Cat5 é o gargalo: seu desempenho garantido é de 100 Mbps, dez vezes menos que os equipamentos. Solução: trocar todo o cabeamento horizontal por Cat6 ou Cat6a.", "t": "Diagnóstico"}], "flash": [{"f": "Cabeamento estruturado", "b": "Instalação padronizada e hierárquica de cabos num prédio ou campus."}, {"f": "Backbone vertical", "b": "Cabeamento principal que liga andares e salas de equipamentos. Normalmente fibra."}, {"f": "Cabeamento horizontal", "b": "Liga o rack do andar às tomadas das áreas de trabalho."}, {"f": "ABNT NBR 14565", "b": "Norma brasileira de cabeamento estruturado."}, {"f": "ANSI/TIA-568", "b": "Norma internacional de cabeamento estruturado."}, {"f": "Patch panel", "b": "Painel de conexão no rack onde chegam os cabos horizontais."}, {"f": "Patch cord", "b": "Cordão de manobra que liga o patch panel ao switch ou o PC à tomada."}, {"f": "Rack 42U", "b": "Gabinete padronizado com 42 unidades de altura para equipamentos."}, {"f": "PoE", "b": "Power over Ethernet: energia pelo cabo de rede para telefones IP, câmeras e APs."}, {"f": "MPLS", "b": "Serviço da operadora que cria rede privada com QoS entre filiais."}, {"f": "VPN site-to-site", "b": "Túnel criptografado que liga duas redes de escritório pela internet."}, {"f": "Link de backup (failover)", "b": "Segundo link, de outro provedor, que assume se o principal falhar."}], "vf": [{"s": "O cabeamento estruturado organiza a infraestrutura em backbone e cabeamento horizontal.", "v": true, "j": "Verdadeiro. É uma organização hierárquica."}, {"s": "A ABNT NBR 14565 é a norma brasileira de cabeamento estruturado.", "v": true, "j": "Verdadeiro. A referência internacional é a ANSI/TIA-568."}, {"s": "O backbone entre andares costuma ser feito com cabo coaxial.", "v": false, "j": "Falso. O backbone entre andares e prédios costuma usar **fibra óptica**, pela velocidade, distância e imunidade a interferências."}, {"s": "Patch cords são os cordões de manobra que conectam os dispositivos.", "v": true, "j": "Verdadeiro."}, {"s": "Uma configuração comum é Gigabit nas estações e 10 Gigabit nos servidores e no backbone.", "v": true, "j": "Verdadeiro."}, {"s": "PoE permite alimentar câmeras IP e telefones VoIP pelo cabo de rede.", "v": true, "j": "Verdadeiro."}, {"s": "Um único roteador Wi-Fi potente no centro do escritório garante cobertura completa.", "v": false, "j": "Falso. Paredes, obstáculos e interferência limitam a cobertura; é preciso um **site survey** para definir quantidade e posição dos APs."}, {"s": "O link dedicado de fibra é a opção de WAN mais barata.", "v": false, "j": "Falso. É a de **maior desempenho e maior custo**. A VPN sobre internet é a de melhor custo-benefício."}, {"s": "O MPLS oferece QoS e é indicado para filiais com VoIP e videoconferência.", "v": true, "j": "Verdadeiro."}, {"s": "A VPN sobre a internet oferece garantia de latência e de perda de pacotes.", "v": false, "j": "Falso. A internet pública **não oferece garantias**; o desempenho da VPN varia com ela."}, {"s": "Cabeamento Cat5 limita a rede a cerca de 100 Mbps mesmo com switches Gigabit.", "v": true, "j": "Verdadeiro, segundo o exercício do capítulo: vira o gargalo da rede."}, {"s": "Cabeamento deve ser planejado como investimento de 1 a 2 anos.", "v": false, "j": "Falso. O cabeamento é um investimento de longo prazo, de **10 a 15 anos**."}], "pbl": [{"titulo": "Dois andares da InovaTech", "duracao": "3 aulas", "cenario": "A InovaTech, software house de 50 funcionários, vai ocupar um escritório de dois andares. Usa telefones VoIP e câmeras IP, os desenvolvedores trabalham com notebooks e a equipe de vendas fica em vários estados. A empresa não pode parar se o link principal cair.", "problema": "Como projetar a rede física da InovaTech: cabeamento, LAN e WAN, pensando em 10 anos de uso?", "perguntas": ["Qual categoria de cabo e quantas tomadas por mesa?", "Onde ficam os racks e o que liga os andares?", "Quais switches e APs escolher?", "Como conectar os vendedores e garantir a internet se o link principal falhar?"], "entregaveis": ["Planta simplificada com racks, backbone e pontos", "Lista de equipamentos com especificação (portas, velocidade, PoE, padrão Wi-Fi)", "Desenho da WAN com links principal e de backup"], "solucao": ["Cabeamento **Cat6a** em todo o escritório (suporta 10 Gbps), duas tomadas por mesa, seguindo a NBR 14565.", "Rack de 42U em sala climatizada no 1º andar, rack menor no 2º, ligados por **backbone de fibra**.", "Switches Gigabit com **PoE** para VoIP e câmeras; APs **Wi-Fi 6** nos dois andares e rede separada para visitantes.", "WAN: **VPN de acesso remoto** para vendas; fibra de 1 Gbps como principal e rádio de 200 Mbps de outro provedor como backup (failover)."]}, {"titulo": "Matriz em Aracaju, filial no interior", "duracao": "2 aulas", "cenario": "Uma rede de farmácias tem a matriz em Aracaju e três filiais no interior de Sergipe. O sistema de vendas é em tempo real e a matriz faz videoconferências diárias com os gerentes. As filiais têm orçamento pequeno e internet de qualidade variável.", "problema": "Qual tecnologia de WAN usar para ligar a matriz às filiais equilibrando custo, desempenho e segurança?", "perguntas": ["Quais aplicações são sensíveis a latência e perda?", "Quanto custa cada opção (dedicado, MPLS, VPN) em relação às outras?", "Dá para combinar tecnologias?", "Que LAN cada filial precisa?"], "entregaveis": ["Tabela comparativa das três tecnologias para o caso", "Diagrama da WAN proposta", "Recomendação com justificativa de custo × desempenho"], "solucao": ["Sensíveis: sistema de vendas em tempo real e videoconferência, que sofrem com latência e perda.", "Opção equilibrada: **MPLS** para garantir QoS às aplicações críticas entre matriz e filiais; **VPN site-to-site** sobre a internet como caminho de backup mais barato.", "Se o orçamento não comportar MPLS, VPN site-to-site em todas as filiais, com QoS local e link de internet de melhor qualidade na matriz, sabendo que o desempenho dependerá da internet.", "LAN das filiais: switch Gigabit, cabeamento Cat6 e AP com rede separada para clientes."]}], "lab": ["building", "wan"]}, {"id": "p4", "titulo": "Projeto de Rede sem Fio", "subtitulo": "Capítulo 4 · padrões, frequências, site survey e segurança", "objetivo": "Planejar uma rede sem fio: características, ambientes indoor e outdoor, padrões 802.11, modos de operação, métricas, frequências, site survey e segurança.", "resumo": [["Wi-Fi", "Rede que usa ondas de rádio em vez de cabos. Vantagens: mobilidade, flexibilidade e escalabilidade. Desafios: interferência, atenuação e segurança."], ["Indoor × outdoor", "Indoor: paredes, móveis e pessoas atenuam o sinal e criam zonas mortas. Outdoor: distância, chuva e neblina; equipamentos mais robustos."], ["Padrões 802.11", "b 11 Mbps · g 54 Mbps · n 600 Mbps (MIMO) · ac/Wi-Fi 5 1,3 Gbps (MU-MIMO) · ax/Wi-Fi 6 9,6 Gbps (OFDMA)."], ["Frequências", "2,4 GHz: mais alcance, mais interferência e poucos canais. 5 GHz: mais velocidade e canais, menos alcance. 6 GHz: Wi-Fi 6E."], ["Site survey", "Planejamento, análise de espectro, survey preditivo, survey ativo/passivo no local e relatório com mapas de calor."], ["Segurança", "WEP (inseguro) < WPA < WPA2 (AES) < WPA3. Autenticação por PSK ou 802.1X/RADIUS. Ocultar SSID e filtrar MAC são medidas complementares."]], "historia": "Leo recebe a planta da **Galeria Conectada**: um salão com pé-direito duplo, salas de concreto de paredes grossas e um jardim de esculturas a céu aberto, tudo para a inauguração em menos de um mês. Ana sorri: antes de comprar qualquer AP, eles vão fazer um site survey.", "historiaTitulo": "A saga de Leo", "caderno": [{"q": "O que é uma rede sem fio e qual a analogia dos walkie-talkies?", "a": "Uma rede que usa ondas de rádio em vez de cabos. Na biblioteca, em vez de amarrar o bilhete numa pedra e jogar (cabo), você fala no walkie-talkie e o amigo ouve no dele: a comunicação vai pelo ar.", "t": "Discursiva"}, {"q": "Cite três vantagens e três desafios das redes Wi-Fi.", "a": "Vantagens: mobilidade, flexibilidade para adicionar dispositivos e escalabilidade (basta um novo AP). Desafios: interferência (micro-ondas, telefones sem fio, outras redes), atenuação do sinal e segurança, pois os dados vão pelo ar.", "t": "Discursiva"}, {"q": "Compare os desafios de uma rede indoor e de uma outdoor.", "a": "Indoor: atenuação por paredes, portas, móveis e pessoas, criando zonas mortas; exige posicionamento cuidadoso dos APs. Outdoor: distância e clima (chuva, neblina) enfraquecem o sinal; exige equipamentos robustos para intempéries.", "t": "Comparação"}, {"q": "Complete a tabela: frequência e velocidade de 802.11b, g, n, ac e ax.", "a": "802.11b: 2,4 GHz, 11 Mbps. 802.11g: 2,4 GHz, 54 Mbps. 802.11n: 2,4 e 5 GHz, 600 Mbps. 802.11ac (Wi-Fi 5): 5 GHz, 1,3 Gbps. 802.11ax (Wi-Fi 6/6E): 2,4, 5 e 6 GHz, 9,6 Gbps.", "t": "Tabela"}, {"q": "O que significam MIMO, MU-MIMO e OFDMA e em que padrões apareceram?", "a": "MIMO (802.11n): múltiplas antenas para aumentar velocidade e alcance. MU-MIMO (802.11ac): MIMO multiusuário, atendendo vários dispositivos ao mesmo tempo. OFDMA (802.11ax): divide o canal para atender muitos dispositivos com eficiência em ambientes densos.", "t": "Discursiva"}, {"q": "Diferencie o modo infraestruturado do modo ad-hoc, com a topologia de cada um.", "a": "Infraestruturado: todos se conectam a um AP, que se liga à rede cabeada; topologia em estrela, como o terminal de um aeroporto. Ad-hoc: os dispositivos se conectam diretamente, sem AP; topologia em malha, como amigos conversando num parque.", "t": "Comparação"}, {"q": "Quais são as três métricas de desempenho do Wi-Fi e suas unidades?", "a": "Taxa de transferência (throughput), em Mbps ou Gbps. Latência (ping), em ms. Intensidade do sinal, em dBm.", "t": "Discursiva"}, {"q": "Qual sinal é mais forte: −50 dBm ou −80 dBm? Por quê?", "a": "−50 dBm. O dBm do Wi-Fi costuma ser negativo, e quanto mais perto de zero, mais forte o sinal.", "t": "Discursiva"}, {"q": "Compare as faixas de 2,4 GHz, 5 GHz e 6 GHz.", "a": "2,4 GHz: maior alcance, mais interferência e poucos canais (estrada antiga que vai longe, com trânsito). 5 GHz: mais velocidade e canais, menos alcance (autoestrada moderna). 6 GHz: exclusiva do Wi-Fi 6E, muitos canais e sem dispositivos antigos (pista particular).", "t": "Comparação"}, {"q": "Descreva as cinco etapas de um site survey.", "a": "1) Planejamento: planta baixa e requisitos. 2) Análise de espectro: fontes de interferência de RF. 3) Survey preditivo: simulação em software com a planta e os materiais. 4) Survey ativo/passivo no local: medir sinal, taxa e latência andando pelo local. 5) Relatório: mapas de calor e posições dos APs.", "t": "Procedimento"}, {"q": "Ordene WEP, WPA, WPA2 e WPA3 da mais fraca à mais forte e comente cada um.", "a": "WEP: obsoleto e inseguro (fechadura de brinquedo). WPA: melhor que o WEP, com vulnerabilidades conhecidas. WPA2: o mais usado, com AES (porta de cofre). WPA3: o mais recente, mais forte contra força bruta e melhor em redes abertas.", "t": "Discursiva"}, {"q": "Diferencie autenticação por PSK e por 802.1X/RADIUS.", "a": "PSK (Pre-Shared Key): uma senha compartilhada por todos. 802.1X com servidor RADIUS: cada usuário tem login e senha individuais, típico de empresas (WPA2/WPA3-Enterprise).", "t": "Discursiva"}, {"q": "Ocultar o SSID e filtrar MAC tornam a rede segura? Explique.", "a": "Não sozinhos. Ocultar o SSID não impede atacantes determinados de encontrarem a rede, e o filtro de MAC pode ser contornado. São camadas extras que só complementam criptografia forte e autenticação.", "t": "Discursiva"}, {"q": "O sinal é ótimo na sala e péssimo no quarto, com o roteador ao lado da TV. Cite três ações.", "a": "1) Mover o roteador para um local central e elevado, como o corredor. 2) Se for dual-band, usar 2,4 GHz no quarto, que atravessa melhor as paredes. 3) Instalar um repetidor ou um sistema mesh entre a sala e o quarto.", "t": "Diagnóstico"}], "flash": [{"f": "802.11", "b": "Família de padrões Wi-Fi definida pelo IEEE."}, {"f": "Wi-Fi 5", "b": "802.11ac: 5 GHz, até 1,3 Gbps, MU-MIMO."}, {"f": "Wi-Fi 6", "b": "802.11ax: até 9,6 Gbps, OFDMA, para ambientes densos."}, {"f": "Wi-Fi 6E", "b": "Wi-Fi 6 usando também a faixa de 6 GHz."}, {"f": "MIMO", "b": "Múltiplas antenas para aumentar velocidade e alcance (desde o 802.11n)."}, {"f": "Modo infraestruturado", "b": "Dispositivos ligados a um ponto de acesso. Topologia em estrela."}, {"f": "Modo ad-hoc", "b": "Dispositivos ligados diretamente, sem AP. Topologia em malha."}, {"f": "dBm", "b": "Unidade da intensidade do sinal. −50 dBm é mais forte que −80 dBm."}, {"f": "2,4 GHz × 5 GHz", "b": "2,4: mais alcance e mais interferência. 5: mais velocidade e menos alcance."}, {"f": "Site survey", "b": "Estudo do local para posicionar os APs: preditivo, ativo/passivo e relatório com mapa de calor."}, {"f": "WPA3", "b": "Protocolo de segurança Wi-Fi mais recente e forte contra força bruta."}, {"f": "802.1X / RADIUS", "b": "Autenticação individual por usuário em redes corporativas."}], "vf": [{"s": "Interferência, atenuação e segurança são os principais desafios das redes sem fio.", "v": true, "j": "Verdadeiro."}, {"s": "Em redes indoor, paredes e móveis podem criar zonas mortas de sinal.", "v": true, "j": "Verdadeiro. Eles absorvem e refletem as ondas de rádio."}, {"s": "O 802.11ac opera nas faixas de 2,4 GHz e 5 GHz.", "v": false, "j": "Falso. Pela tabela do capítulo, o 802.11ac (Wi-Fi 5) opera em **5 GHz**. Quem opera nas duas é o 802.11n; o 802.11ax usa 2,4, 5 e 6 GHz."}, {"s": "O 802.11ax (Wi-Fi 6) foi pensado para ambientes com muitos dispositivos conectados.", "v": true, "j": "Verdadeiro, com tecnologias como o OFDMA."}, {"s": "No modo ad-hoc todos os dispositivos precisam de um ponto de acesso central.", "v": false, "j": "Falso. Isso é o modo **infraestruturado**. No ad-hoc os dispositivos se conectam diretamente."}, {"s": "Um sinal de −80 dBm é mais forte que um de −50 dBm.", "v": false, "j": "Falso. Quanto mais perto de zero, mais forte: **−50 dBm é mais forte**."}, {"s": "A faixa de 2,4 GHz tem maior alcance, mas sofre mais interferência que a de 5 GHz.", "v": true, "j": "Verdadeiro. Micro-ondas e telefones sem fio também usam essa faixa."}, {"s": "A faixa de 6 GHz é usada pelo padrão Wi-Fi 6E.", "v": true, "j": "Verdadeiro."}, {"s": "No site survey, o survey preditivo dispensa a medição no local.", "v": false, "j": "Falso. O survey ativo/passivo no local **valida e ajusta** o modelo preditivo."}, {"s": "O WEP ainda é considerado seguro para redes domésticas.", "v": false, "j": "Falso. O WEP é **obsoleto e inseguro**. O mínimo recomendado é WPA2, e WPA3 quando disponível."}, {"s": "O WPA2 usa o padrão de criptografia AES.", "v": true, "j": "Verdadeiro."}, {"s": "Ocultar o SSID impede que atacantes encontrem a rede.", "v": false, "j": "Falso. É uma medida simples, mas **não impede** atacantes determinados."}], "pbl": [{"titulo": "A Galeria Conectada", "duracao": "3 aulas", "cenario": "Um novo espaço de arte tem um salão principal com pé-direito duplo, salas menores com paredes grossas de concreto e um jardim de esculturas a céu aberto. Visitantes vão usar um app com áudio-guia e a equipe usa tablets para vendas. A inauguração é em menos de um mês.", "problema": "Como projetar uma rede sem fio que cubra salão, salas de concreto e jardim, com desempenho e segurança para equipe e visitantes?", "perguntas": ["Que desafios cada ambiente (salão, salas de concreto, jardim) impõe?", "Qual padrão e quais faixas usar?", "Como será o site survey?", "Como separar a rede da equipe da rede dos visitantes?", "Que sinal mínimo aceitar em cada área?"], "entregaveis": ["Planta com a posição proposta dos APs e mapa de calor estimado", "Roteiro do site survey (5 etapas)", "Configuração das redes: SSID, segurança, autenticação", "Justificativa dos equipamentos indoor e outdoor"], "solucao": ["Salão: muitos visitantes ao mesmo tempo, então **Wi-Fi 6 (802.11ax)** com vários APs. Salas de concreto: forte atenuação, então um AP por sala. Jardim: APs **outdoor** robustos para intempéries.", "5 GHz para desempenho perto dos APs e 2,4 GHz como apoio para alcance.", "Site survey: planta, análise de espectro, survey preditivo, medições no local e relatório com mapas de calor; meta de sinal acima de −65 dBm.", "Rede da equipe com **WPA2/WPA3-Enterprise (802.1X)**; rede de visitantes separada e isolada."]}, {"titulo": "Wi-Fi da consultoria", "duracao": "2 aulas", "cenario": "Uma consultoria com 15 funcionários ocupa 200 m² com divisórias. Usa notebooks, smartphones e uma sala de reuniões com smart TV para videoconferência HD. Os dados dos clientes são confidenciais e visitantes precisam de internet.", "problema": "Que padrão, quantos APs e que configuração de segurança atendem a consultoria com bom custo-benefício?", "perguntas": ["Quais aplicações a rede precisa suportar?", "Wi-Fi 5 ou Wi-Fi 6? Por quê?", "Quantos APs e onde, considerando as divisórias?", "Como autenticar funcionários e separar visitantes?"], "entregaveis": ["Levantamento de requisitos", "Planta com os APs e as medições de sinal", "Ficha de configuração das duas redes"], "solucao": ["Requisitos: web, e-mail, arquivos no servidor local e videoconferência HD; segurança dos dados dos clientes é prioridade.", "Padrão **802.11ac (Wi-Fi 5)** pelo custo-benefício; **dois APs de teto** para evitar sombras das divisórias.", "Site survey simplificado com app no smartphone, garantindo sinal acima de **−65 dBm** na sala de reuniões e nas mesas.", "Rede “Consultoria-Corp” com **WPA2-Enterprise (802.1X)**, login individual; rede “Consultoria-Visitantes” isolada da rede interna."]}], "lab": ["wifi", "wsec"]}, {"id": "p5", "titulo": "Teste e Documentação", "subtitulo": "Capítulo 5 · plano de testes, documentação e ferramentas", "objetivo": "Elaborar e executar testes de rede (conectividade, desempenho, failover e segurança), definir o conteúdo da documentação do projeto e escolher ferramentas de apoio.", "resumo": [["Plano de testes", "Roteiro que valida cada aspecto da rede antes da produção, como o ensaio geral de uma peça de teatro."], ["Tipos de teste", "Conectividade (`ping`), desempenho (`iperf`, Speedtest), failover (desligar o link principal) e segurança (OpenVAS, Nmap)."], ["Documentação", "Topologia física e lógica, planilha de IPs, backup das configurações e políticas de segurança. É a planta da casa."], ["Ferramentas", "Diagramas: Visio, Lucidchart, draw.io. Projetos: Jira, Trello. Monitoramento: Zabbix, SolarWinds NPM, Grafana. Inventário: NetBox."], ["Erros comuns", "Não ter plano formal, documentação desatualizada e testar só conectividade."], ["Regra de ouro", "Atualizar a documentação a cada mudança. Documentação incorreta pode ser pior do que nenhuma."]], "historia": "Na InovaTech, Clara recebe Leo numa sala cheia de caixas e cabos saindo das paredes: “Bem-vindo ao caos organizado”. A missão dele agora é provar que a rede funciona e deixar tudo escrito, para que qualquer pessoa consiga manter e expandir a rede no futuro.", "historiaTitulo": "A saga de Leo", "caderno": [{"q": "O que é a elaboração de testes num projeto de rede?", "a": "O processo de planejar, criar e executar verificações para garantir que a rede atende a todos os requisitos técnicos e de negócio, da conectividade básica a simulações de carga e avaliações de segurança, antes de entrar em produção.", "t": "Discursiva"}, {"q": "Explique a analogia do ensaio geral de teatro para os testes.", "a": "Antes da estreia (implantação), atores (dispositivos), cenário (infraestrutura física) e roteiro (configurações) são testados; cada cena é um caso de teste. Falhas são corrigidas no ensaio, não na frente do público.", "t": "Discursiva"}, {"q": "Como fazer um teste de conectividade? Dê um exemplo de comando.", "a": "Verificar se um dispositivo se comunica com outro, geralmente com ping. Ex.: `ping 192.168.1.1` a partir de um computador para testar a comunicação com o roteador.", "t": "Discursiva"}, {"q": "Como o `iperf` é usado num teste de desempenho?", "a": "Configura-se um servidor iperf num lado da rede e um cliente no outro; o teste mede a taxa de transferência máxima (largura de banda) entre os dois pontos.", "t": "Discursiva"}, {"q": "O que é um teste de failover? Dê um exemplo.", "a": "Simular a falha de um componente crítico para ver se a redundância funciona. Ex.: desconectar o cabo do link principal e verificar se o tráfego passa sozinho para o link secundário.", "t": "Discursiva"}, {"q": "Por que “a rede pinga” não significa que a rede está pronta?", "a": "Porque conectividade é só um aspecto. É preciso testar desempenho, segurança e redundância: uma rede que só responde ao ping pode ser lenta, insegura ou não aguentar uma falha.", "t": "Discursiva"}, {"q": "Liste os quatro conteúdos essenciais da documentação de uma rede.", "a": "Topologia (diagramas físico e lógico), planilha de endereçamento IP, cópias de segurança das configurações dos dispositivos e políticas de segurança (regras de firewall, VPN, acesso).", "t": "Discursiva"}, {"q": "Por que guardar cópias das configurações de roteadores, switches e firewalls?", "a": "Para recuperar rapidamente um equipamento que falhe: basta restaurar a configuração em vez de refazê-la do zero.", "t": "Discursiva"}, {"q": "Classifique as ferramentas: Visio, Lucidchart, Jira, Trello, Zabbix e SolarWinds NPM.", "a": "Diagramação: Visio (padrão da indústria) e Lucidchart (nuvem, colaborativo). Gerenciamento de projetos: Jira (tarefas de TI) e Trello (Kanban). Monitoramento: Zabbix (código aberto) e SolarWinds NPM (comercial).", "t": "Classificação"}, {"q": "Qual o risco de uma documentação desatualizada e como evitá-lo?", "a": "Uma documentação incorreta leva a decisões erradas e pode ser pior que nenhuma. Solução: atualizar a documentação sempre que houver mudança na rede, como parte do procedimento.", "t": "Discursiva"}, {"q": "Descreva o plano de testes do escritório de contabilidade com 20 funcionários.", "a": "Plano criado antes da compra: conectividade de todas as mesas, velocidade do acesso ao sistema online e segurança. Execução: ping de cada ponto ao servidor, Speedtest em vários horários e varredura de vulnerabilidades com OpenVAS.", "t": "Estudo de caso"}, {"q": "Quais os 3 testes mais importantes antes de entregar a rede de uma startup de 5 pessoas?", "a": "1) Conectividade fim a fim entre todos os dispositivos e com a internet. 2) Desempenho e cobertura do Wi-Fi, já que startups dependem de mobilidade. 3) Segurança básica: senha forte no Wi-Fi e firewall do roteador ativo.", "t": "Projeto"}, {"q": "Liste 5 itens da documentação da rede dessa startup.", "a": "Diagrama da topologia; planilha de IPs; senhas dos equipamentos e do Wi-Fi guardadas com segurança; contatos do provedor; manual curto para os usuários (como conectar e resolver problemas comuns).", "t": "Discursiva"}, {"q": "Escolha duas ferramentas para o diagrama da rede e justifique.", "a": "Lucidchart, por ser online e colaborativo, facilitando compartilhar com a equipe. Microsoft Visio, por ser completo, conhecido no mercado e ter uma grande biblioteca de ícones de rede.", "t": "Discursiva"}], "flash": [{"f": "Plano de testes", "b": "Documento com o que será testado, como e qual o resultado esperado."}, {"f": "Teste de conectividade", "b": "Verifica se um dispositivo alcança outro. Ferramenta típica: `ping`."}, {"f": "iperf", "b": "Ferramenta cliente-servidor que mede a largura de banda entre dois pontos."}, {"f": "Teste de failover", "b": "Simula a falha de um componente para validar a redundância."}, {"f": "OpenVAS", "b": "Ferramenta de varredura de vulnerabilidades."}, {"f": "Planilha de IPs", "b": "Registro de cada dispositivo com nome e endereço IP."}, {"f": "Backup de configuração", "b": "Cópia dos arquivos de configuração para recuperação rápida."}, {"f": "Microsoft Visio", "b": "Padrão da indústria para diagramas de rede."}, {"f": "Lucidchart", "b": "Diagramas em nuvem com colaboração em tempo real."}, {"f": "Zabbix", "b": "Monitoramento de redes e servidores, de código aberto."}, {"f": "NMS", "b": "Network Management System: software de monitoramento e gerência de rede."}, {"f": "Trello × Jira", "b": "Trello: Kanban simples. Jira: gestão de tarefas e projetos de TI."}], "vf": [{"s": "O plano de testes deve ser elaborado depois que a rede já está em produção.", "v": false, "j": "Falso. O plano é feito **antes**, e no caso do capítulo até antes de comprar os equipamentos."}, {"s": "O `ping` é a ferramenta mais comum para testes de conectividade.", "v": true, "j": "Verdadeiro."}, {"s": "O `iperf` é usado para medir a largura de banda entre dois pontos da rede.", "v": true, "j": "Verdadeiro, com um servidor de um lado e um cliente do outro."}, {"s": "Desconectar o cabo do link principal para ver se o tráfego vai para o secundário é um teste de failover.", "v": true, "j": "Verdadeiro."}, {"s": "Se todos os pontos respondem ao `ping`, os testes estão concluídos.", "v": false, "j": "Falso. Também é preciso testar **desempenho, segurança e redundância**."}, {"s": "A planilha de endereçamento IP faz parte da documentação da rede.", "v": true, "j": "Verdadeiro."}, {"s": "Uma documentação desatualizada é sempre melhor do que nenhuma documentação.", "v": false, "j": "Falso. Documentação **incorreta pode ser pior** que nenhuma, porque induz a erros."}, {"s": "Guardar cópias das configurações acelera a recuperação quando um equipamento falha.", "v": true, "j": "Verdadeiro."}, {"s": "O Zabbix é uma ferramenta de diagramação de redes.", "v": false, "j": "Falso. O Zabbix é de **monitoramento**. Diagramação é com Visio, Lucidchart ou draw.io."}, {"s": "O Trello organiza as etapas do projeto em quadros Kanban.", "v": true, "j": "Verdadeiro."}, {"s": "O OpenVAS pode ser usado para procurar falhas de segurança na rede.", "v": true, "j": "Verdadeiro. Foi o que se fez no cenário do escritório de contabilidade."}, {"s": "As senhas dos equipamentos podem ficar anotadas no próprio diagrama impresso na parede do rack.", "v": false, "j": "Falso. As senhas entram na documentação, mas **armazenadas de forma segura**, nunca expostas."}], "pbl": [{"titulo": "Entrega da rede da contabilidade", "duracao": "3 aulas", "cenario": "Uma empresa de contabilidade com 20 funcionários vai inaugurar escritório novo. Precisa de acesso rápido ao servidor de arquivos e ao sistema de contabilidade online, e só aceita a rede se ela for comprovadamente segura e confiável.", "problema": "Que plano de testes e que pacote de documentação a equipe precisa entregar para a rede ser aceita?", "perguntas": ["O que testar, com qual ferramenta e qual resultado esperar em cada caso?", "Como testar a velocidade em diferentes horários?", "Como comprovar a segurança?", "O que entra no pacote de documentação e onde ele fica guardado?"], "entregaveis": ["Plano de testes em tabela: teste, ferramenta, procedimento, resultado esperado, resultado obtido", "Diagrama da rede", "Planilha de IPs", "Checklist de aceite assinado pelo cliente"], "solucao": ["Conectividade: `ping` de cada ponto ao servidor, 100% de respostas.", "Desempenho: Speedtest em vários horários e `iperf` entre estação e servidor de arquivos.", "Segurança: varredura com **OpenVAS**, senhas fortes e acesso só para funcionários autorizados.", "Failover, se houver dois links: desligar o principal e medir o tempo até o tráfego passar para o outro.", "Documentação: diagrama no Lucidchart, planilha de IPs no Google Sheets (funcionário, computador, IP), configurações do roteador e do switch salvas em pasta segura do servidor, políticas de segurança."]}, {"titulo": "Documentação que envelheceu", "duracao": "2 aulas", "cenario": "A InovaTech cresceu de 20 para 60 pessoas em um ano. O diagrama da rede é de quando a empresa tinha um andar, a planilha de IPs tem conflitos e ninguém sabe onde estão as configurações do firewall. Um técnico novo levou um dia inteiro para achar a causa de uma queda.", "problema": "Como reconstruir a documentação e criar uma rotina que a mantenha atualizada?", "perguntas": ["O que precisa ser levantado de novo?", "Quais ferramentas usar para diagramas, inventário, monitoramento e tarefas?", "Como garantir que toda mudança atualize a documentação?", "Como medir se a documentação está confiável?"], "entregaveis": ["Inventário atualizado e novo diagrama", "Proposta de ferramentas com justificativa", "Procedimento de mudança (quem altera, o que registra, onde)", "Cartão Kanban de exemplo com uma mudança documentada"], "solucao": ["Levantamento: refazer o baseline com varredura da rede (ex.: Nmap), `ping`/`traceroute` e exportação das configurações de cada equipamento.", "Ferramentas: Visio ou Lucidchart para diagramas; NetBox ou planilha para inventário e IPs; Zabbix com Grafana para monitoramento; Trello ou Jira para registrar mudanças.", "Procedimento: nenhuma mudança é concluída sem atualizar diagrama, planilha e backup de configuração; a tarefa no Kanban só vai para “Feito” com a documentação anexada.", "Indicador: tempo para diagnosticar falhas e número de divergências encontradas em auditorias periódicas."]}], "lab": ["failover", "tests"]}], "comoEstudar": "Escolha um módulo. Leia o **Resumo**, explore o **Laboratório visual**, responda o **Caderno** à mão, revise com os **Flashcards**, treine o **V ou F** escrevendo a justificativa e resolva o **PBL** em equipe. As respostas só aparecem depois que você tenta."};
