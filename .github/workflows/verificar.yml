name: Verificar portal

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Atualizar lista offline e índice de busca
        run: python3 tools/gerar-offline.py
      - name: Salvar as listas se mudaram
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- offline-manifest.json busca-index.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add offline-manifest.json busca-index.json
            git commit -m "Atualiza lista offline e índice de busca (automático)"
            git push
          fi
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Instalar ferramentas de teste
        run: |
          npm install --no-save playwright axe-core
          npx playwright install --with-deps chromium
      - name: Testar (erros, layout e acessibilidade)
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          node tools/verificar.js
